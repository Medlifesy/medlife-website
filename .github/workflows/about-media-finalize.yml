name: Finalize About Media Experience

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update About page only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('about-medlife.html')
          text = p.read_text(encoding='utf-8')

          old = '.logo-box:before,.logo-box:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(229,42,80,.14)}'
          new = '.logo-box:before,.logo-box:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(229,42,80,.14);background-image:url("./logo.PNG");background-repeat:no-repeat;background-position:center;background-size:26%;opacity:.42}'
          if old in text:
              text = text.replace(old, new, 1)
          elif 'background-image:url("./logo.PNG")' not in text:
              raise SystemExit('logo circle CSS target not found')

          text = re.sub(r'(<figure class="gallery-card">\\s*<img)(?![^>]*loading=)', r'\\1 loading="lazy" decoding="async" fetchpriority="low"', text)

          media_css = '''
.media-section{padding:82px 0;background:linear-gradient(180deg,#f7f8fb,#fff)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.media-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 8px 25px rgba(21,29,54,.05);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.media-card:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(21,29,54,.09);border-color:#f0cbd4}
.media-card .media-label{display:block;color:var(--red);font-size:11px;font-weight:900;margin-bottom:7px;letter-spacing:.04em}
.media-card h3{margin:0 0 8px;color:var(--navy);font-size:17px}
.media-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.9}
.media-card a{display:inline-flex;margin-top:13px;color:var(--red);font-size:12px;font-weight:900}
.media-note{margin-top:18px;text-align:center;color:#7d8797;font-size:11px}
@media(max-width:960px){.media-grid{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.media-grid{grid-template-columns:1fr}}
'''
          marker = '.cta{background:var(--navy);'
          if '.media-section{' not in text:
              text = text.replace(marker, media_css + '\n' + marker, 1)

          section = '''
<section class="section media-section reveal" id="media"><div class="wrap"><div class="section-head"><span class="eyebrow">الحضور الإعلامي والرقمي</span><h2>ميدلايف في المجتمع وفي الإعلام</h2><p>لا يقتصر حضور ميدلايف على العمل الميداني؛ تحرص المؤسسة على توثيق مبادراتها، ونقل رسالتها الصحية والتطوعية، وإتاحة ما نُشر عنها عبر منصات المؤسسة ووسائل الإعلام.</p></div><div class="media-grid">
<article class="media-card"><span class="media-label">المنصة الرسمية</span><h3>LinkedIn — Med Life Syria</h3><p>الصفحة المؤسسية على LinkedIn، وتتضمن نبذة عن المؤسسة وتحديثات حول المبادرات والأنشطة والشراكات.</p><a href="https://sy.linkedin.com/company/med-life-syria" target="_blank" rel="noopener noreferrer">زيارة الصفحة</a></article>
<article class="media-card"><span class="media-label">القناة الرسمية</span><h3>YouTube — MedLife</h3><p>القناة الرسمية التي أطلقتها ميدلايف لنشر التغطيات المصورة، والمحتوى التوعوي، واللقاءات، والمواد التدريبية.</p><a href="https://www.youtube.com/@medlifesy" target="_blank" rel="noopener noreferrer">زيارة القناة</a></article>
<article class="media-card"><span class="media-label">تغطية إعلامية رسمية</span><h3>سانا — مؤسسة ميدلايف الطبية</h3><p>صفحة الوسم في الوكالة العربية السورية للأنباء، وتجمع المواد المنشورة حول أنشطة المؤسسة.</p><a href="https://sana.sy/tag/%D9%85%D8%A4%D8%B3%D8%B3%D8%A9-%D9%85%D9%8A%D8%AF%D9%84%D8%A7%D9%8A%D9%81-%D8%A7%D9%84%D8%B7%D8%A8%D9%8A%D8%A9/" target="_blank" rel="noopener noreferrer">استعراض التغطيات</a></article>
<article class="media-card"><span class="media-label">سانا — 2026</span><h3>فعالية الوقاية من أضرار أشعة الشمس</h3><p>تغطية لفعالية توعوية نظمتها ميدلايف بالتعاون مع جمعية جسور الأمل نبض الغد في طرطوس.</p><a href="https://sana.sy/governorates/tartus/2519122/" target="_blank" rel="noopener noreferrer">قراءة التغطية</a></article>
<article class="media-card"><span class="media-label">صحيفة الثورة</span><h3>برامج طبية جديدة لميدلايف</h3><p>تغطية صحفية لبرامج المؤسسة ومبادراتها الطبية والإنسانية وتوسع نشاطها.</p><a href="https://archive.thawra.sy/?p=731600" target="_blank" rel="noopener noreferrer">قراءة الخبر</a></article>
<article class="media-card"><span class="media-label">Syria Home News</span><h3>مبادرة بسمة أمل في مشفى الأطفال</h3><p>تغطية لمبادرة إنسانية هدفت إلى تقديم الدعم النفسي والمعنوي للأطفال المرضى وإدخال الفرح إلى قلوبهم.</p><a href="https://syriahomenews.com/%D9%85%D8%A8%D8%A7%D8%AF%D8%B1%D8%A9-%D8%A8%D8%B3%D9%85%D8%A9-%D8%A3%D9%85%D9%84-%D9%81%D9%8A-%D9%85%D8%B3%D8%AA%D8%B4%D9%81%D9%89-%D8%A7%D9%84%D8%A3%D8%B7%D9%81%D8%A7%D9%84-%D8%A8/" target="_blank" rel="noopener noreferrer">قراءة التغطية</a></article>
</div><div class="media-note">تم إدراج الروابط التي أمكن التحقق من صلتها بميدلايف مباشرة، وسيتم إضافة أي منصات اجتماعية أخرى عند تثبيت روابطها الرسمية.</div></div></section>
'''
          if 'id="media"' not in text:
              text = text.replace('<section class="logo-strip reveal">', section + '<section class="logo-strip reveal">', 1)

          p.write_text(text, encoding='utf-8')
          print('About page updated successfully.')

      - name: Commit About update and remove this one-shot workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add about-medlife.html .github/workflows/about-media-finalize.yml
          git rm .github/workflows/about-media-finalize.yml
          git commit -m 'feat(about): enhance media presence and loading [skip ci]' || exit 0
          git push
