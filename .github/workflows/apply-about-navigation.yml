name: Apply about page navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-about-navigation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable global navigation on about page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('about-medlife.html')
          text = path.read_text(encoding='utf-8')
          if '/site-nav.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('about-medlife.html does not contain </body>')
              text = text.replace(marker, '  <script src="/site-nav.js"></script>\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation change
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about-medlife.html
          if git diff --cached --quiet; then
            echo 'About page navigation already enabled.'
          else
            git commit -m 'feat(about): unify global navigation'
            git push
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-about-navigation.yml
          git add .github/workflows/apply-about-navigation.yml
          if git diff --cached --quiet; then
            echo 'Temporary workflow already removed.'
          else
            git commit -m 'chore: remove temporary about navigation workflow'
            git push
          fi
