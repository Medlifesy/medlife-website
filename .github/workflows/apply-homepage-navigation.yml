name: Apply homepage navigation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-homepage-navigation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable homepage global navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'site-nav.js' not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html does not contain </body>')
              text = text.replace(marker, '  <script src="/site-nav.js"></script>\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage navigation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Homepage navigation already enabled.'
            exit 0
          fi
          git commit -m 'feat(homepage): enable global navigation bar'
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-homepage-navigation.yml
          git add .github/workflows/apply-homepage-navigation.yml
          git commit -m 'chore: remove temporary homepage navigation workflow'
          git push
