name: Connect MedLife AI to Articles Admin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connect AI and image studio scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('articles-admin.html')
          s = p.read_text(encoding='utf-8')
          tags = '<script src="/article-ai-studio.js"></script><script src="/article-images-studio.js"></script>'
          if '/article-images-studio.js' not in s:
              if '</body>' in s:
                  s = s.replace('</body>', tags + '</body>', 1)
              else:
                  s += tags
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit connection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles-admin.html
          git diff --cached --quiet || git commit -m "Connect AI and image studio to admin UI"
          git push