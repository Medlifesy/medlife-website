name: Finalize About Community

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update About only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('about-medlife.html')
          text=p.read_text(encoding='utf-8')

          # Remove the decorative empty-circle pseudo-elements from the hero logo.
          text=re.sub(r'\.logo-box:before,.logo-box:after\{content:"";.*?\}\s*\.logo-box:before\{inset:-18px\}\.logo-box:after\{inset:18px\}', '', text, count=1, flags=re.S)

          # Make gallery images non-blocking on first paint.
          text=re.sub(r'(<figure class="gallery-card">\s*<img)(?![^>]*\bloading=)', r'\1 loading="lazy" decoding="async" fetchpriority="low"', text)

          css='''.community-section{padding:82px 0;background:#fff}\n.community-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}\n.community-card{background:#f9fafc;border:1px solid var(--line);border-radius:20px;padding:24px}\n.community-card .community-label{display:block;color:var(--red);font-size:11px;font-weight:900;margin-bottom:7px}\n.community-card h3{margin:0 0 9px;color:var(--navy);font-size:17px}\n.community-card p{margin:0;color:var(--muted);font-size:13px;line-height:2}\n.community-card small{display:block;margin-top:13px;color:#8993a4;font-size:10px}\n.community-note{margin-top:18px;padding:15px 18px;border:1px dashed #d9dfe8;border-radius:14px;color:#7d8797;font-size:11px;text-align:center;line-height:1.9}\n@media(max-width:960px){.community-grid{grid-template-columns:1fr 1fr}}\n@media(max-width:620px){.community-grid{grid-template-columns:1fr}}\n'''
          if '.community-section{' not in text:
              text=text.replace('.cta{background:var(--navy);', css+'\n.cta{background:var(--navy);', 1)

          section='''<section class="section community-section reveal" id="community-voices"><div class="wrap"><div class="section-head"><span class="eyebrow">من المجتمع</span><h2>شهادات وانطباعات موثقة</h2><p>نحرص على عرض ما يمكن توثيقه من آراء المشاركين والجهات المحلية، من دون تعميمات أو اقتباسات غير موثقة.</p></div><div class="community-grid"><article class="community-card"><span class="community-label">الأهالي والمشاركون</span><h3>أهمية المبادرات الصحية</h3><p>في تغطية سانا لفعالية الوقاية من أضرار أشعة الشمس، أشار عدد من الأهالي المشاركين إلى أهمية المبادرة والمعلومات المقدمة ودورها في حماية صحة الأطفال وتعزيز الوعي الصحي لدى الأسر.</p><small>المصدر: سانا، طرطوس — 5 تموز 2026</small></article><article class="community-card"><span class="community-label">القطاع الأكاديمي</span><h3>دعم ثقافة التطوع</h3><p>بحسب منشور ميدلايف الموثق عبر LinkedIn، عبّر عميد كلية الطب البشري في جامعة طرطوس عن دعمه لفكرة المؤسسة، وأكد أهمية تعزيز ثقافة التطوع لدى طلاب الطب وتشجيعهم على النشاطات الإنسانية والطبية الميدانية.</p><small>المصدر: Med Life Syria / LinkedIn — 2025</small></article><article class="community-card"><span class="community-label">القطاع الصحي المحلي</span><h3>الوصول إلى المجتمع المحلي</h3><p>في تغطية صحيفة الحرية لفعالية التوعية الصحية في طرطوس، أوضح فريق ميدلايف أن مشاركته ركزت على إيصال الرسائل الصحية إلى أكبر شريحة ممكنة من المجتمع المحلي.</p><small>المصدر: صحيفة الحرية — 22 حزيران 2025</small></article></div><div class="community-note">لا نملك حتى الآن مادة مستقلة كافية تسمح بوصف «رأي الشارع السوري» أو «الرأي العالمي» تجاه ميدلايف بشكل عام؛ لذلك لن ننسب آراء عامة لمصادر أو أشخاص من دون توثيق. يمكن توسيع هذا القسم لاحقاً بإضافة مقابلات واستبيانات وشهادات منشورة من متطوعين ومستفيدين وشركاء.</div></div></section>'''
          if 'id="community-voices"' not in text:
              text=text.replace('<section class="logo-strip reveal">', section+'\n<section class="logo-strip reveal">', 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add about-medlife.html .github/workflows/finalize-about-community.yml
          git rm .github/workflows/finalize-about-community.yml
          git commit -m 'feat(about): add verified community voices and remove empty circles [skip ci]' || exit 0
          git push
