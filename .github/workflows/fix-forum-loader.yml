name: Fix forum navigation loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-forum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared navigation loader
        shell: python
        run: |
          from pathlib import Path
          page = Path('forum-v3.html')
          text = page.read_text(encoding='utf-8')
          if '/site-nav.js' not in text:
              if '</body>' not in text:
                  raise SystemExit('forum-v3.html has no closing body tag')
              text = text.replace('</body>', '<script src="/site-nav.js"></script>\n</body>', 1)
              page.write_text(text, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add forum-v3.html .github/workflows/fix-forum-loader.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(forum): load shared navigation'
          git rm .github/workflows/fix-forum-loader.yml
          git commit -m 'chore: remove temporary forum loader workflow'
          git push