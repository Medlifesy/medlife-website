name: Fix homepage gallery

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-homepage:
    if: github.event.head_commit.message != 'fix: add dynamic homepage photo section'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update homepage gallery
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<li><a href="#activities">أنشطة ميدلايف</a></li>',
              '<li><a href="#homepageGallery"><i class="fa-solid fa-images"></i> صورنا</a></li>'
          )
          text = text.replace(
              '<a href="#activities">أنشطة ميدلايف</a>',
              '<a href="#homepageGallery"><i class="fa-solid fa-images"></i> صورنا</a>'
          )
          text = text.replace(
              '<section class="section contact">',
              '<section class="section contact" id="contact">',
              1
          )

          text = re.sub(
              r'<section class="section soft reveal" id="activities">.*?</section>',
              '',
              text,
              count=1,
              flags=re.S
          )

          if 'src="./js/gallery.js"' not in text:
              text = text.replace(
                  '</body>',
                  '<script src="./js/gallery.js"></script></body>',
                  1
              )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes needed."
            exit 0
          fi
          git commit -m "fix: add dynamic homepage photo section"
          git push
