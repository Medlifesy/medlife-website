name: Install MedLife AI Studio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'ci: install MedLife AI Studio') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Inject AI studio script
        shell: python
        run: |
          from pathlib import Path
          p = Path('articles-admin.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="article-ai-upgrade.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('articles-admin.html has no closing body tag')
              s = s.replace('</body>', tag + '</body>', 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('AI studio already installed')
      - name: Commit injection
        run: |
          git config user.name 'MedLife AI Studio Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add articles-admin.html
          git diff --cached --quiet || git commit -m 'ci: install MedLife AI Studio'
          git push
