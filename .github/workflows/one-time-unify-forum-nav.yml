name: One-time unify Forum navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace Forum custom header with global navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('forum-v3.html')
          text = page.read_text(encoding='utf-8')

          updated, count = re.subn(r'<header class="nav">.*?</header>', '', text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one Forum custom header, found {count}')

          marker = '<script src="/site-nav.js"></script>'
          if marker not in updated:
              updated = updated.replace('</body>', marker + '\n</body>', 1)

          page.write_text(updated, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add forum-v3.html .github/workflows/one-time-unify-forum-nav.yml
          git commit -m 'fix(forum): unify global navigation with homepage'
          git rm .github/workflows/one-time-unify-forum-nav.yml
          git commit -m 'chore: remove temporary forum navigation workflow'
          git push
