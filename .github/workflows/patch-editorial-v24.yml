name: Repair article publishing system

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair article API
        shell: python
        run: |
          from pathlib import Path
          import re

          worker = Path('workers/articles-api/worker.js')
          text = worker.read_text(encoding='utf-8')

          # Keep the POST slug behavior idempotent.
          text = text.replace(
              "let b=await req.json(),articleSlug=await uniqueSlug(env.DB,b.title_ar||b.title_en||'article');",
              "let b=await req.json(),articleSlug=await uniqueSlug(env.DB,b.slug||b.title_ar||b.title_en||'article');"
          )

          # Replace the entire PUT handler with one clean, idempotent implementation.
          put = r'''if(p[1]&&req.method==='PUT'){let b=await req.json();const current=await env.DB.prepare('SELECT slug FROM articles WHERE id=?').bind(p[1]).first();const articleSlug=b.slug?await uniqueSlug(env.DB,b.slug,p[1]):(current?.slug||await uniqueSlug(env.DB,b.title_ar||b.title_en||'article',p[1]));await env.DB.prepare('UPDATE articles SET title_ar=?,title_en=?,excerpt_ar=?,excerpt_en=?,content_ar=?,content_en=?,author_name=?,author_email=?,category=?,image_url=?,status=?,slug=?,updated_at=CURRENT_TIMESTAMP WHERE id=?').bind(b.title_ar,b.title_en,b.excerpt_ar,b.excerpt_en,normalizeArticleContent(b.content_ar),normalizeArticleContent(b.content_en),b.author_name,b.author_email,b.category,b.image_url,b.status,articleSlug,p[1]).run();return json(await env.DB.prepare('SELECT * FROM articles WHERE id=?').bind(p[1]).first())}'''
          pattern = r"if\(p\[1\]&&req\.method==='PUT'\)\{.*?\}if\(p\[1\]&&p\[2\]==='status'"
          text, n = re.subn(pattern, put + "if(p[1]&&p[2]==='status'", text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'PUT handler repair expected 1 match, got {n}')

          worker.write_text(text, encoding='utf-8')

      - name: Commit repair
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add workers/articles-api/worker.js .github/workflows/patch-editorial-v24.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(articles): repair permanent publish slug flow'
          git push
