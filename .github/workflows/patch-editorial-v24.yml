name: Upgrade editorial studio V24
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(admin): apply editorial studio v24 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V24 safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin/editorial-command-center-v24.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style>\/\* MEDLIFE V24 SAFETY PATCH \*\/.*?<\/style>\s*<script>\(function\(\)\{.*?\}\)\(\);<\/script>\s*', '', s, flags=re.S)
          patch=r'''<style>/* MEDLIFE V24 SAFETY PATCH */
          html{scroll-behavior:smooth}.content{scroll-behavior:smooth}.content .ml-intro{background:linear-gradient(180deg,#fff7f9,#fff);border-right:4px solid var(--red);padding:14px 16px;border-radius:12px;margin-bottom:20px}.content .ml-section{scroll-margin-top:90px}.toc a:hover{background:#fff0f4;border-radius:7px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.content{scroll-behavior:auto}button{transition:none!important}}</style>
          <script>(function(){
          const q=id=>document.getElementById(id),toast=x=>{const t=q('toast');if(!t)return;t.textContent=x;t.style.display='block';clearTimeout(window.__mlt);window.__mlt=setTimeout(()=>t.style.display='none',3200)};
          const content=()=>q('content'),snap=()=>content()?.innerHTML||'',count=()=>({i:content()?.querySelectorAll('img').length||0,t:content()?.querySelectorAll('table').length||0});
          const selectedId=()=>q('sid')?.textContent.trim(); const value=id=>(q(id)?.value||'').trim();
          async function call(url,opt={}){const r=await fetch(url,{...opt,credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||('HTTP '+r.status));return d}
          function safeFormat(){const c=content();if(!selectedId()||!c)return toast('اختر مقالاً أولاً');const before=snap(),b=count();c.querySelector('.toc')?.remove();[...c.querySelectorAll('h2,h3')].forEach((h,i)=>{h.classList.add('ml-section');h.id='ml-section-'+(i+1)});[...c.querySelectorAll('p,div')].filter(el=>el.children.length===0&&el.textContent.trim()).forEach(el=>{const text=el.textContent.trim();if(/^(?:\d{1,2}|[٠-٩]{1,2})\s*[-ـ.)ـ]\s+/.test(text)&&text.length<=180){const h=document.createElement('h2');h.innerHTML=el.innerHTML;el.replaceWith(h)}});const hs=[...c.querySelectorAll('h2,h3')];hs.forEach((h,i)=>{h.classList.add('ml-section');h.id='ml-section-'+(i+1)});if(hs.length){const toc=document.createElement('nav');toc.className='toc';const strong=document.createElement('strong');strong.textContent='فهرس المحتوى';toc.appendChild(strong);hs.forEach(h=>{const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.trim();toc.appendChild(a)});c.insertBefore(toc,c.firstChild)}const first=[...c.children].find(el=>el.tagName!=='NAV'&&!['H2','H3'].includes(el.tagName));if(first)first.classList.add('ml-intro');c.querySelectorAll('table').forEach(t=>{if(!t.parentElement.classList.contains('table-wrap')){const w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.appendChild(t)}});c.querySelectorAll('img').forEach((im,i)=>{im.style.maxWidth='100%';im.loading='lazy';if(!im.alt)im.alt='صورة توضيحية في مقال MedLife '+(i+1)});const a=count();if(a.i<b.i||a.t<b.t){c.innerHTML=before;return toast('تم إلغاء التنسيق لحماية الصور والجداول')}toast('تم تنسيق المقال دون حذف المحتوى')}
          q('format')&&(q('format').onclick=safeFormat);
          if(q('ai'))q('ai').onclick=async function(){if(!selectedId())return toast('اختر مقالاً أولاً');q('aiM').classList.add('on');q('aiBody').innerHTML='<p style="padding:14px">جاري التحليل الطبي والتحرير وSEO…</p>';try{const d=await call('/api/article-ai',{method:'POST',body:JSON.stringify({action:'seo',article_id:selectedId(),title:value('title'),excerpt:value('excerpt'),content:content().innerText})});const raw=d.suggestions??d.result??d.message??d;const text=typeof raw==='string'?raw:JSON.stringify(raw,null,2);const title=raw&&typeof raw==='object'?(raw.title_ar||raw.suggested_title||raw.seo_title||raw.title||''):'';const excerpt=raw&&typeof raw==='object'?(raw.excerpt_ar||raw.suggested_excerpt||raw.meta_description||''):'';q('aiBody').innerHTML='<div style="padding:14px;line-height:2;font-size:11px"><b>نتيجة المراجعة والتحسين</b><pre style="white-space:pre-wrap;font:inherit">'+text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</pre><div style="display:flex;gap:6px;flex-wrap:wrap">'+(title?'<button id="mlApplyTitle" class="primary">تطبيق العنوان المقترح</button>':'')+(excerpt?'<button id="mlApplyExcerpt">تطبيق الملخص المقترح</button>':'')+'<button id="mlSafeFormat">تطبيق تنسيق MedLife الآمن</button></div><p style="color:var(--muted)">لا يتم تغيير النص الطبي تلقائياً؛ القرار النهائي للمحرر.</p></div>';q('mlApplyTitle')&&(q('mlApplyTitle').onclick=()=>{q('title').value=title;toast('تم تطبيق العنوان المقترح')});q('mlApplyExcerpt')&&(q('mlApplyExcerpt').onclick=()=>{q('excerpt').value=excerpt;toast('تم تطبيق الملخص المقترح')});q('mlSafeFormat')&&(q('mlSafeFormat').onclick=()=>{safeFormat();q('aiM').classList.remove('on')})}catch(e){q('aiBody').innerHTML='<p class="bad" style="padding:14px">تعذر تشغيل المراجعة: '+String(e.message||e)+'</p>'}};
          })();</script>'''
          s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add admin/editorial-command-center-v24.html
          git diff --cached --quiet || (git commit -m 'chore(admin): apply editorial studio v24 patch' && git push)
