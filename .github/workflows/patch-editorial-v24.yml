name: Upgrade editorial studio V24
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(admin): apply editorial studio v24 patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch V24 safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin/editorial-command-center-v24.html')
          s=p.read_text(encoding='utf-8')
          marker='/* MEDLIFE V24 SAFETY PATCH */'
          if marker in s:
              print('patch already present')
              raise SystemExit(0)
          patch=r'''<style>/* MEDLIFE V24 SAFETY PATCH */
          html{scroll-behavior:smooth}.content{scroll-behavior:smooth}.content .ml-intro{background:linear-gradient(180deg,#fff7f9,#fff);border-right:4px solid var(--red);padding:14px 16px;border-radius:12px;margin-bottom:20px}.content .ml-section{scroll-margin-top:90px}.toc a:hover{background:#fff0f4;border-radius:7px}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.content{scroll-behavior:auto}button{transition:none!important}}</style>
          <script>(function(){
          const q=id=>document.getElementById(id),toast=x=>{const t=q('toast');if(!t)return;t.textContent=x;t.style.display='block';clearTimeout(window.__mlt);window.__mlt=setTimeout(()=>t.style.display='none',3200)};
          const snap=()=>q('content')?.innerHTML||''; const count=()=>({i:q('content')?.querySelectorAll('img').length||0,t:q('content')?.querySelectorAll('table').length||0});
          function safeFormat(){
            if(!window.S||!S.sel)return toast('اختر مقالاً أولاً');
            const c=q('content'),before=snap(),b=count(); c.querySelector('.toc')?.remove();
            [...c.querySelectorAll('h2,h3')].forEach((h,i)=>{h.classList.add('ml-section');h.id='ml-section-'+(i+1)});
            const candidates=[...c.querySelectorAll('p,div')].filter(el=>el.children.length===0&&el.textContent.trim());
            let n=0; for(const el of candidates){const text=el.textContent.trim(); if(/^(?:\d{1,2}|[٠-٩]{1,2})\s*[-ـ.)ـ]\s+/.test(text)&&text.length<=180){const h=document.createElement('h2');h.innerHTML=el.innerHTML;h.className='ml-section';h.id='ml-section-'+(++n);el.replaceWith(h)}}
            [...c.querySelectorAll('h2,h3')].forEach((h,i)=>{h.classList.add('ml-section');h.id='ml-section-'+(i+1)});
            const hs=[...c.querySelectorAll('h2,h3')]; if(hs.length){const toc=document.createElement('nav');toc.className='toc';const title=document.createElement('strong');title.textContent='فهرس المحتوى';toc.appendChild(title);hs.forEach((h,i)=>{h.id='ml-section-'+(i+1);const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.trim();toc.appendChild(a)});c.insertBefore(toc,c.firstChild)}
            const first=[...c.children].find(el=>el.tagName!=='NAV'&&!['H2','H3'].includes(el.tagName)); if(first&&!first.classList.contains('ml-intro'))first.classList.add('ml-intro');
            c.querySelectorAll('table').forEach(t=>{if(!t.parentElement.classList.contains('table-wrap')){const w=document.createElement('div');w.className='table-wrap';t.parentNode.insertBefore(w,t);w.appendChild(t)}t.querySelectorAll('th,td').forEach(x=>x.removeAttribute('width'))});
            c.querySelectorAll('img').forEach((im,i)=>{im.style.maxWidth='100%';im.loading='lazy';if(!im.alt)im.alt='صورة توضيحية في مقال MedLife '+(i+1)});
            const a=count(); if(a.i<b.i||a.t<b.t){c.innerHTML=before;return toast('تم إلغاء التنسيق تلقائياً لحماية الصور والجداول')} if(typeof push==='function')push(); if(typeof update==='function')update(); toast('تم تنسيق المقال دون حذف النص أو الصور أو الجداول');
          }
          q('format')&&(q('format').onclick=safeFormat);
          q('pending')&&(q('pending').setAttribute('title','عرض المقالات التي أرسلها أصحابها للمراجعة')));
          if(q('ai'))q('ai').onclick=async function(){
            if(!S.sel)return toast('اختر مقالاً أولاً'); q('aiM').classList.add('on'); q('aiBody').innerHTML='<p style="padding:14px">جاري التحليل الطبي والتحرير وSEO…</p>';
            try{const d=await api('/api/article-ai',{method:'POST',body:JSON.stringify({action:'seo',article_id:S.sel.id,title:val('title'),excerpt:val('excerpt'),content:q('content').innerText})});
              const raw=d.suggestions??d.result??d.message??d; const text=typeof raw==='string'?raw:JSON.stringify(raw,null,2); let suggestedTitle=raw?.title_ar||raw?.suggested_title||raw?.title||raw?.seo_title||''; let suggestedExcerpt=raw?.excerpt_ar||raw?.meta_description||raw?.suggested_excerpt||'';
              q('aiBody').innerHTML='<div style="padding:14px;line-height:2;font-size:11px"><b>نتيجة المراجعة</b><pre style="white-space:pre-wrap;font:inherit">'+esc(text)+'</pre><div style="display:flex;gap:6px;flex-wrap:wrap">'+(suggestedTitle?'<button id="mlApplyTitle" class="primary">تطبيق العنوان المقترح</button>':'')+(suggestedExcerpt?'<button id="mlApplyExcerpt">تطبيق الملخص المقترح</button>':'')+'<button id="mlSafeFormat">تطبيق تنسيق MedLife الآمن</button></div><p style="color:var(--muted)">لن يغيّر النظام النص الطبي تلقائياً؛ التعديلات الدلالية تبقى بموافقة المحرر.</p></div>';
              q('mlApplyTitle')&&(q('mlApplyTitle').onclick=()=>{q('title').value=suggestedTitle;update();toast('تم تطبيق العنوان المقترح')}); q('mlApplyExcerpt')&&(q('mlApplyExcerpt').onclick=()=>{q('excerpt').value=suggestedExcerpt;update();toast('تم تطبيق الملخص المقترح')}); q('mlSafeFormat')&&(q('mlSafeFormat').onclick=()=>{safeFormat();q('aiM').classList.remove('on')});
            }catch(e){q('aiBody').innerHTML='<p class="bad" style="padding:14px">تعذر تشغيل المراجعة: '+esc(e.message)+'</p>'}
          };
          })();</script>'''
          s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add admin/editorial-command-center-v24.html
          git diff --cached --quiet || (git commit -m 'chore(admin): apply editorial studio v24 patch' && git push)
