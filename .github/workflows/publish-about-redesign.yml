name: Publish comprehensive about page

on:
  push:
    branches: [main]
    paths:
      - 'about-medlife-redesign.html'
      - '.github/workflows/publish-about-redesign.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish redesign
        shell: bash
        run: |
          cp about-medlife-redesign.html about-medlife.html
          rm -f about-medlife-redesign.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add about-medlife.html about-medlife-redesign.html
          git commit -m 'feat(about): publish comprehensive institutional page'
          git push

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/publish-about-redesign.yml
          git add .github/workflows/publish-about-redesign.yml
          git commit -m 'chore: remove temporary about redesign workflow'
          git push
