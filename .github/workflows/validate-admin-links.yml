name: Validate Admin Navigation

on:
  push:
    paths:
      - 'admin.html'
      - 'admin-v2.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'
  pull_request:
    paths:
      - 'admin.html'
      - 'admin-v2.html'
      - '_redirects'
      - '.github/workflows/validate-admin-links.yml'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate internal admin links
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urlparse

          page = Path('admin-v2.html').read_text(encoding='utf-8')
          hrefs = re.findall(r'''href=["']([^"']+)["']''', page, flags=re.I)
          ignored = ('#', 'javascript:', 'mailto:', 'tel:', 'http://', 'https://')
          errors = []

          for href in hrefs:
              href = href.split('#', 1)[0].split('?', 1)[0]
              if not href or href.startswith(ignored):
                  continue

              if href.startswith('/'):
                  target = Path(href.lstrip('/'))
              else:
                  target = Path('admin-v2.html').parent / href

              if target.is_dir():
                  target = target / 'index.html'

              if not target.exists():
                  errors.append(f'Missing internal target: {href} -> {target}')

          if errors:
              print('\n'.join(errors))
              raise SystemExit(1)

          print(f'OK: validated {len(hrefs)} admin hrefs; all internal targets exist.')
          PY

      - name: Validate admin redirect
        run: |
          grep -Eq '^/admin\.html[[:space:]]+/admin-v2\.html[[:space:]]+302$' _redirects
          echo 'OK: /admin.html redirects to /admin-v2.html'
