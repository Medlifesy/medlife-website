name: Verify Forum global navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  verify-forum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Forum uses global navigation
        shell: python
        run: |
          from pathlib import Path
          page = Path('forum-v3.html')
          text = page.read_text(encoding='utf-8')
          marker = '<script src="/site-nav.js"></script>'
          if marker not in text:
              text = text.replace('</body>', marker + '\n</body>', 1)
          page.write_text(text, encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'MedLife Bot'
          git config user.email 'actions@medlifesy.org'
          git add forum-v3.html .github/workflows/verify-forum-global-nav.yml
          if git diff --cached --quiet; then
            git rm .github/workflows/verify-forum-global-nav.yml
            git commit -m 'chore: remove temporary forum nav verification'
            git push
            exit 0
          fi
          git commit -m 'fix(forum): ensure global navigation script is loaded'
          git rm .github/workflows/verify-forum-global-nav.yml
          git commit -m 'chore: remove temporary forum nav verification'
          git push
