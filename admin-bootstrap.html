<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife | تهيئة حساب الإدارة</title><meta name="theme-color" content="#12203a"><link rel="icon" href="logo.PNG"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/homepage-redesign.css"><style>body{margin:0;background:var(--ml-bg);font-family:Cairo,sans-serif;color:var(--ml-ink);min-height:100vh}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(470px,100%);background:#fff;border:1px solid var(--ml-line);border-radius:24px;padding:32px;box-shadow:var(--ml-shadow)}.brand{text-align:center;margin-bottom:24px}.brand img{width:65px}.brand h1{margin:8px 0 3px;color:var(--ml-navy);font-size:23px}.brand p{margin:0;color:var(--ml-muted);font-size:11px}.notice{padding:13px 15px;border-radius:14px;background:#fff8e8;border:1px solid #f1dfae;color:#795b12;font-size:11px;line-height:1.9;margin-bottom:20px}.field{margin-bottom:16px}.field label{display:block;color:var(--ml-navy);font-size:11px;font-weight:800;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;border:1px solid var(--ml-line);border-radius:12px;padding:12px;font:13px Cairo;outline:none}.readonly{background:#f7f8fa!important;color:#667085}.btn{width:100%;border:0;border-radius:13px;padding:13px;font:900 12px Cairo;color:#fff;background:var(--ml-red);cursor:pointer}.result{display:none;margin-top:16px;padding:13px 15px;border-radius:14px;font-size:11px;line-height:1.9}.result.ok{display:block;background:#f0faf6;color:#167346}.result.error{display:block;background:#fff5f6;color:#b42323}.back{display:block;text-align:center;margin-top:18px;color:var(--ml-muted);font-size:11px}</style></head><body><div class="wrap"><main class="card"><div class="brand"><img src="/logo.PNG" alt="MedLife"><h1>تهيئة حساب إدارة المقالات</h1><p>يتم ربط الحساب بعضو MedLife الموجود مسبقاً.</p></div><div class="notice"><strong>استخدام لمرة واحدة:</strong> هذه الصفحة تنشئ أو تحدّث حساب <b>admin</b> داخل <b>member_accounts</b>. لا تشارك رمز التهيئة.</div><form id="form"><div class="field"><label>اسم المستخدم</label><input class="readonly" value="admin" readonly></div><div class="field"><label for="secret">رمز التهيئة</label><input id="secret" type="password" autocomplete="off" required></div><div class="field"><label for="password">كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="new-password" minlength="12" required></div><div class="field"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></div><button class="btn" id="submit" type="submit">إنشاء / تحديث حساب الإدارة</button></form><div id="result" class="result"></div><a class="back" href="/articles-admin.html">الانتقال إلى لوحة المقالات</a></main></div><script>const form=document.getElementById('form'),btn=document.getElementById('submit'),result=document.getElementById('result');form.addEventListener('submit',async e=>{e.preventDefault();result.className='result';btn.disabled=true;btn.textContent='جارٍ تجهيز الحساب...';try{const r=await fetch('/api/admin-bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:document.getElementById('secret').value,password:document.getElementById('password').value,confirmPassword:document.getElementById('confirmPassword').value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر إنشاء الحساب');result.className='result ok';result.textContent='تم تجهيز حساب admin بنجاح. يمكنك الآن الدخول إلى لوحة المقالات.';form.reset()}catch(err){result.className='result error';result.textContent=err.message}finally{btn.disabled=false;btn.textContent='إنشاء / تحديث حساب الإدارة'}});</script></body></html>
