<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife | دخول الإدارة</title><link rel="icon" href="logo.PNG"><link rel="stylesheet" href="/homepage-redesign.css"></head>
<body style="margin:0;background:#f7f8fa;font-family:Cairo,Arial,sans-serif;color:#283244">
<main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section style="width:min(460px,100%);background:#fff;border:1px solid #e1e5eb;border-radius:20px;padding:30px;box-shadow:0 18px 55px rgba(21,29,54,.08)">
<div style="text-align:center"><img src="/logo.PNG" alt="MedLife" style="width:64px;height:64px"><h1 style="color:#151d36;margin:10px 0 4px">دخول الإدارة العامة</h1><p style="color:#6e7788;font-size:12px;margin:0 0 24px">مركز الإدارة العامة لمؤسسة MedLife</p></div>
<form id="form"><label style="display:block;font-size:12px;font-weight:800;color:#151d36;margin:12px 0 6px">البريد الإلكتروني أو رمز العضوية</label><input id="identifier" required autocomplete="username email" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #e1e5eb;border-radius:10px;font:inherit"><label style="display:block;font-size:12px;font-weight:800;color:#151d36;margin:14px 0 6px">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:12px;border:1px solid #e1e5eb;border-radius:10px;font:inherit"><button id="submit" type="submit" style="width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:#b21f45;color:#fff;font:inherit;font-weight:800;cursor:pointer">تسجيل الدخول</button><div id="msg" style="display:none;margin-top:12px;padding:11px;border-radius:9px;background:#fff1f3;color:#a32936;font-size:11px;line-height:1.8;white-space:pre-wrap"></div></form>
</section></main>
<script>
const $=id=>document.getElementById(id);
async function login(){
 const r=await fetch('/api/admin-session?action=login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'include',cache:'no-store',body:JSON.stringify({identifier:$('identifier').value.trim(),password:$('password').value})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.success){const e=new Error(j.error||'تعذر تسجيل الدخول.');e.detail=j.detail||'';throw e}
 return j;
}
$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;$('submit').textContent='جاري التحقق...';$('msg').style.display='none';try{await login();window.location.replace('/admin.html')}catch(err){$('msg').style.display='block';$('msg').textContent=err.message+(err.detail?'\nتفاصيل النظام: '+err.detail:'')}finally{$('submit').disabled=false;$('submit').textContent='تسجيل الدخول'}});
</script></body></html>
