<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملف العضو | MedLife</title><link rel="icon" href="logo.PNG"><style>:root{--n:#151d36;--p:#ff2a54;--bg:#f5f7fb;--l:#e5eaf1;--m:#64748b;--g:#059669;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17203a;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:25px 16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:24px;color:var(--n)}.brand span{color:var(--p)}.btn{display:inline-block;border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;text-decoration:none;background:var(--n);color:#fff}.light{background:#fff;color:var(--n);border:1px solid var(--l)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin:15px 0;box-shadow:0 8px 25px #18243a08}.hero{display:flex;align-items:center;gap:16px}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#ffe3e9;color:var(--p);font-size:28px;font-weight:900}.name{font-size:25px;font-weight:900}.muted{color:var(--m);font-size:13px;margin-top:5px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f7}.active{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.suspended{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{padding:13px;background:#f8fafc;border-radius:12px}.label{display:block;color:var(--m);font-size:12px;margin-bottom:5px}.value{font-weight:750}.empty{text-align:center;color:var(--m);padding:35px}.error{color:var(--r)}@media(max-width:650px){.top,.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand">Med<span>Life</span> · ملف العضو</div><a class="btn light" href="/admin-members.html">← إدارة الأعضاء</a></header><div id="root" class="empty">أدخل مفتاح الإدارة لتحميل الملف.</div></main><script>const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let key=prompt('مفتاح الإدارة:')||'';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const team=x=>({content:'المحتوى الطبي',consultations:'الاستشارات الطبية',design:'التصميم',coordination:'التنسيق',technical:'التقني'}[x]||x||'غير محدد');const status=x=>({active:'نشط',pending:'معلق',suspended:'موقوف',inactive:'غير نشط'}[x]||x||'غير محدد');async function run(){if(!id){$('root').innerHTML='<span class="error">رقم العضو غير موجود في الرابط.</span>';return}try{let r=await fetch('/api/admin/member/'+encodeURIComponent(id),{headers:{'X-Admin-Key':key}}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'تعذر تحميل ملف العضو');let m=j.member||j.data||j;let initial=(m.full_name||'?').trim().charAt(0);$('root').innerHTML=`<section class="card"><div class="hero"><div class="avatar">${esc(initial)}</div><div><div class="name">${esc(m.full_name||'بدون اسم')}</div><div class="muted">${esc(m.member_code||'بدون رقم عضوية')} · ${esc(team(m.cell))}</div><div style="margin-top:9px"><span class="badge ${esc(m.status||'')}">${esc(status(m.status))}</span></div></div></div></section><section class="card"><h2>البيانات الأساسية</h2><div class="grid">${item('رقم العضوية',m.member_code)}${item('الدور',m.medlife_role||'عضو')}${item('الفريق',team(m.cell))}${item('الحالة',status(m.status))}${item('البريد الإلكتروني',m.account_email||m.email)}${item('الهاتف',m.phone)}${item('المحافظة',m.governorate)}${item('تاريخ الانضمام',m.joined_at||m.created_at)}</div></section><section class="card"><h2>الإدارة</h2><div class="grid">${item('Telegram',m.telegram_username||m.telegram_id)}${item('آخر تحديث',m.updated_at)}${item('آخر تسجيل دخول',m.last_login_at)}</div></section>`}catch(e){$('root').innerHTML='<div class="card error">'+esc(e.message)+'</div>'}}function item(a,b){return `<div class="item"><span class="label">${esc(a)}</span><span class="value">${esc(b||'—')}</span></div>`}run();</script></body></html>
