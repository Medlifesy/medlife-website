<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة أعضاء MedLife</title><link rel="icon" href="logo.PNG"><style>body{font-family:Arial,sans-serif;background:#f7f9fc;color:#17203a;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,textarea{font:inherit;padding:11px;border-radius:10px;border:1px solid #dbe3ed}button{cursor:pointer;background:#ff2a54;color:#fff;border:0;font-weight:700}.danger{background:#151d36}.item{border-top:1px solid #e2e8f0;padding:15px 0}.muted{color:#64748b;font-size:13px;line-height:1.8}.actions{margin-top:10px;display:flex;gap:8px}.error{color:#b91c1c}.ok{color:#047857}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#f1f5f9;font-size:12px}</style></head><body><main class="wrap"><h1>إدارة عضوية MedLife</h1><p class="muted">هذه الصفحة مخصصة للإدارة فقط. لا تشارك مفتاح الإدارة مع أي شخص.</p><section class="card"><div class="row"><input id="key" type="password" placeholder="Admin API Key" style="flex:1"><button id="load">تحميل الطلبات</button></div><div id="msg"></div></section><section class="card"><h2>طلبات الانضمام الجديدة</h2><div id="applications">—</div></section><section class="card"><h2>الأعضاء</h2><div id="members">—</div></section></main><script>const $=id=>document.getElementById(id);let key='';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function workText(x){if(!x)return'غير محدد';if(x==='working')return'يعمل حالياً';if(x==='not_working')return'لا يعمل حالياً';return x}async function action(url,payload){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(payload)});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'فشل التنفيذ');return j}function render(d){$('applications').innerHTML=d.applications.length?d.applications.map(a=>`<div class="item"><strong>${esc(a.full_name)}</strong> <span class="badge">${esc(a.status)}</span><div class="muted">${esc(a.email)} · ${esc(a.phone)} · ${esc(a.governorate)} · ${esc(a.interest)}</div>${a.profession||a.workplace?`<div class="muted">العمل: ${esc(a.profession||'غير محدد')} · مكان العمل: ${esc(a.workplace||'غير محدد')}</div>`:''}<div class="actions">${a.status==='pending'?`<button onclick="approve('new',${a.id})">قبول وإنشاء الحساب</button><button class="danger" onclick="reject('new',${a.id})">رفض</button>`:''}</div></div>`).join(''):'لا توجد طلبات.';$('members').innerHTML=d.members.length?d.members.map(m=>`<div class="item"><strong>${esc(m.full_name)}</strong> <span class="badge">${esc(m.status)} / ${esc(m.account_status)}</span><div class="muted">${esc(m.member_code||'')} · ${esc(m.account_email||m.email)} · ${esc(m.medlife_role)} · ${esc(m.cell)}</div>${m.cell==='consultations'?`<div class="muted"><strong>اختصاص الاستشارات:</strong> ${esc(m.consultation_specialty||'غير محدد')}</div>`:''}${m.profession||m.workplace?`<div class="muted"><strong>العمل:</strong> ${esc(m.profession||'غير محدد')} · <strong>مكان العمل:</strong> ${esc(m.workplace||'غير محدد')} · <strong>الحالة:</strong> ${esc(workText(m.employment_status))}</div>`:''}<div class="actions">${m.status==='pending'?`<button onclick="approve('current',${m.id})">تفعيل الحساب</button>`:''}${m.status==='pending'?`<button class="danger" onclick="reject('current',${m.id})">رفض</button>`:''}</div></div>`).join(''):'لا يوجد أعضاء.'}async function load(){key=$('key').value.trim();if(!key){$('msg').innerHTML='<p class="error">أدخل مفتاح الإدارة.</p>';return}try{const r=await fetch('/api/admin/list-members',{headers:{'X-Admin-Key':key}}),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر التحميل');render(d);$('msg').innerHTML='<p class="ok">تم تحميل البيانات.</p>'}catch(e){$('msg').innerHTML='<p class="error">'+esc(e.message)+'</p>'}}async function approve(type,id){try{await action('/api/admin/approve-member',{type,id});await load()}catch(e){alert(e.message)}}async function reject(type,id){const reason=prompt('سبب الرفض (اختياري):')||'';try{await action('/api/admin/reject-member',{type,id,reason});await load()}catch(e){alert(e.message)}}$('load').onclick=load;</script></body></html>
