<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الأعضاء | MedLife</title><link rel="icon" href="logo.PNG"><style>:root{--n:#151d36;--p:#ff2a54;--bg:#f5f7fb;--l:#e5eaf1;--m:#64748b;--g:#059669;--r:#dc2626}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17203a;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1280px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{font-weight:900;color:var(--n);font-size:25px}.brand span{color:var(--p)}.sub{color:var(--m);font-size:13px;margin-top:4px}.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;background:var(--n);color:#fff}.primary{background:var(--p)}.light{background:#fff;color:var(--n);border:1px solid var(--l)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #18243a08}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{padding:18px;border:1px solid var(--l);border-radius:15px;background:#fff}.stat b{font-size:27px;display:block;margin-top:7px}.label{color:var(--m);font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{flex:1;min-width:180px;padding:12px;border:1px solid var(--l);border-radius:11px;background:#fff;font:inherit}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:right;padding:14px 10px;border-bottom:1px solid var(--l);vertical-align:middle}.table th{font-size:12px;color:var(--m)}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#eef2f7}.active{background:#dcfce7;color:#166534}.pending{background:#fef3c7;color:#92400e}.suspended{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px;flex-wrap:wrap}.empty{text-align:center;color:var(--m);padding:35px}.error{color:var(--r)}.ok{color:var(--g)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.wrap{padding:18px 12px}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">Med<span>Life</span> · إدارة الأعضاء</div><div class="sub">إدارة الأعضاء وطلبات الانضمام وحالة الحسابات</div></div><a class="btn light" href="/admin/">← لوحة التحكم</a></header><section class="card"><div class="toolbar"><input id="key" type="password" placeholder="مفتاح الإدارة" autocomplete="current-password"><button class="btn primary" id="load">تحميل البيانات</button></div><div id="msg" class="sub"></div></section><section class="stats"><div class="stat"><span class="label">إجمالي الأعضاء</span><b id="total">—</b></div><div class="stat"><span class="label">الأعضاء النشطون</span><b id="activeCount">—</b></div><div class="stat"><span class="label">الحسابات المعلقة</span><b id="pendingCount">—</b></div><div class="stat"><span class="label">طلبات الانضمام</span><b id="appsCount">—</b></div></section><section class="card"><h2>طلبات الانضمام</h2><div id="applications" class="empty">قم بتحميل البيانات أولاً.</div></section><section class="card"><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو رقم العضوية أو البريد أو الهاتف..."><select id="status"><option value="">كل الحالات</option><option value="active">نشط</option><option value="pending">معلق</option><option value="suspended">موقوف</option></select><select id="cell"><option value="">كل الفرق</option><option value="content">المحتوى الطبي</option><option value="consultations">الاستشارات الطبية</option><option value="design">التصميم</option><option value="coordination">التنسيق</option><option value="technical">التقني</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>العضو</th><th>العضوية</th><th>الفريق</th><th>الدور</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="members"><tr><td colspan="6" class="empty">قم بتحميل البيانات أولاً.</td></tr></tbody></table></div></section></main><script>const $=id=>document.getElementById(id);let key='',data={members:[],applications:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const cellName=x=>({content:'المحتوى الطبي',consultations:'الاستشارات الطبية',design:'التصميم',coordination:'التنسيق',technical:'التقني'}[x]||x||'غير محدد');const statusText=x=>({active:'نشط',pending:'معلق',suspended:'موقوف',inactive:'غير نشط'}[x]||x||'غير محدد');function badge(x){let c=x==='active'?'active':x==='pending'?'pending':x==='suspended'?'suspended':'';return `<span class="badge ${c}">${esc(statusText(x))}</span>`}function render(){let q=$('search').value.trim().toLowerCase(),st=$('status').value,c=$('cell').value;let ms=data.members.filter(m=>(!q||[m.full_name,m.member_code,m.account_email,m.email,m.phone].some(v=>String(v||'').toLowerCase().includes(q)))&&(!st||m.status===st)&&(!c||m.cell===c));$('total').textContent=data.members.length;$('activeCount').textContent=data.members.filter(m=>m.status==='active').length;$('pendingCount').textContent=data.members.filter(m=>m.status==='pending').length;$('appsCount').textContent=data.applications.filter(a=>a.status==='pending').length;$('members').innerHTML=ms.length?ms.map(m=>`<tr><td><strong>${esc(m.full_name)}</strong><div class="sub">${esc(m.account_email||m.email||m.phone||'')}</div></td><td>${esc(m.member_code||'—')}</td><td>${esc(cellName(m.cell))}</td><td>${esc(m.medlife_role||'عضو')}</td><td>${badge(m.status)}</td><td><div class="actions"><button class="btn light" onclick="viewMember(${m.id})">عرض</button>${m.status==='pending'?`<button class="btn primary" onclick="approve('current',${m.id})">تفعيل</button>`:''}</div></td></tr>`).join(''):`<tr><td colspan="6" class="empty">لا توجد نتائج مطابقة.</td></tr>`;$('applications').innerHTML=data.applications.length?data.applications.map(a=>`<div style="padding:14px 0;border-bottom:1px solid var(--l)"><strong>${esc(a.full_name)}</strong> ${badge(a.status)}<div class="sub">${esc(a.email)} · ${esc(a.phone)} · ${esc(a.governorate)} · ${esc(a.interest)}</div>${a.status==='pending'?`<div class="actions" style="margin-top:9px"><button class="btn primary" onclick="approve('new',${a.id})">قبول وإنشاء الحساب</button><button class="btn" onclick="reject('new',${a.id})">رفض</button></div>`:''}</div>`).join(''):'<div class="empty">لا توجد طلبات.</div>'}async function load(){key=$('key').value.trim();if(!key){$('msg').innerHTML='<span class="error">أدخل مفتاح الإدارة.</span>';return}try{let r=await fetch('/api/admin/list-members',{headers:{'X-Admin-Key':key}}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'تعذر تحميل البيانات');data=j;render();$('msg').innerHTML='<span class="ok">تم تحميل البيانات بنجاح.</span>'}catch(e){$('msg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}}async function action(url,payload){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key},body:JSON.stringify(payload)}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'فشل التنفيذ');return j}async function approve(type,id){if(!confirm('تأكيد قبول/تفعيل هذا الطلب؟'))return;try{await action('/api/admin/approve-member',{type,id});await load()}catch(e){alert(e.message)}}async function reject(type,id){let reason=prompt('سبب الرفض (اختياري):')??'';try{await action('/api/admin/reject-member',{type,id,reason});await load()}catch(e){alert(e.message)}}function viewMember(id){let m=data.members.find(x=>x.id===id);if(!m)return;alert(`العضو: ${m.full_name}\nرقم العضوية: ${m.member_code||'—'}\nالفريق: ${cellName(m.cell)}\nالدور: ${m.medlife_role||'عضو'}\nالحالة: ${statusText(m.status)}\nالبريد: ${m.account_email||m.email||'—'}\nالهاتف: ${m.phone||'—'}`)}$('load').onclick=load;$('search').oninput=render;$('status').onchange=render;$('cell').onchange=render;</script></body></html>
