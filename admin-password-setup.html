<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLife | إعداد كلمة مرور الإدارة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/homepage-redesign.css">
<style>
body{font-family:Cairo,sans-serif;background:var(--ml-bg);color:var(--ml-ink);min-height:100vh}.box{width:min(680px,calc(100% - 28px));margin:60px auto;background:#fff;border:1px solid var(--ml-line);border-radius:22px;padding:30px;box-shadow:var(--ml-shadow)}h1{color:var(--ml-navy);font-size:26px;margin:0 0 10px}p{color:var(--ml-muted);line-height:2;font-size:13px}.warn{background:#fff7e8;border:1px solid #f3d18c;padding:14px;border-radius:14px;color:#7a5500;font-size:12px;line-height:2;margin:20px 0}label{display:block;color:var(--ml-navy);font-size:12px;font-weight:800;margin:16px 0 7px}input{width:100%;box-sizing:border-box;border:1px solid var(--ml-line);border-radius:12px;padding:13px;font:inherit}button{margin-top:20px;border:0;border-radius:12px;background:var(--ml-red);color:#fff;padding:13px 20px;font:800 12px Cairo;cursor:pointer}textarea{width:100%;min-height:180px;box-sizing:border-box;margin-top:15px;border:1px solid var(--ml-line);border-radius:12px;padding:12px;font:12px monospace;direction:ltr;text-align:left}.ok{margin-top:15px;padding:12px;border-radius:12px;background:#effaf4;color:#176b43;font-size:12px;line-height:1.9}
</style></head><body><main class="box"><div class="ml-eyebrow">MEDLIFE ADMIN</div><h1>إنشاء Hash لكلمة مرور الإدارة</h1><p>هذه الصفحة لا ترسل كلمة المرور إلى أي خادم. يتم توليد PBKDF2 hash داخل متصفحك فقط، وفق نفس الصيغة المستخدمة في نظام MedLife.</p><div class="warn"><strong>استخدام لمرة واحدة:</strong> بعد إنشاء الحساب وتشغيل تسجيل الدخول، سنحذف هذه الصفحة من GitHub.</div><label>كلمة مرور Admin</label><input id="pw" type="password" autocomplete="new-password"><label>تأكيد كلمة المرور</label><input id="pw2" type="password" autocomplete="new-password"><button id="go">توليد SQL</button><div id="out"></div></main><script>
const ITER=100000, enc=new TextEncoder();
function hex(a){return Array.from(new Uint8Array(a)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function makeHash(pw){const salt=crypto.getRandomValues(new Uint8Array(16));const key=await crypto.subtle.importKey('raw',enc.encode(pw),{name:'PBKDF2'},false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},key,256);return `pbkdf2$sha256$${ITER}$${hex(salt)}$${hex(bits)}`}
document.getElementById('go').onclick=async()=>{const p=document.getElementById('pw').value,p2=document.getElementById('pw2').value;if(p.length<12)return alert('كلمة المرور يجب أن تكون 12 محرفاً على الأقل.');if(p!==p2)return alert('كلمتا المرور غير متطابقتين.');const hash=await makeHash(p);const sql=`INSERT INTO members (full_name,mother_name,national_id,email,gender,education_level,governorate,medlife_role,cell,join_date,volunteer_certificate,status,account_email,password_hash,account_status,member_code) VALUES ('MedLife Administrator','MedLife','ADMIN-${Date.now()}','admin@medlifesy.org','not_specified','administrator','Tartous','admin','administration',date('now'),'no','active','admin@medlifesy.org','${hash}','active','ADMIN-${Date.now()}');`;document.getElementById('out').innerHTML='<div class="ok">تم توليد الـHash داخل المتصفح. انسخ SQL التالي إلى D1 Console ونفذه مرة واحدة فقط.</div><textarea readonly>'+sql.replace(/</g,'&lt;')+'</textarea>'};
</script></body></html>
