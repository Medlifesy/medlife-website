<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>طلبات استعادة الحساب | MedLife</title><link rel="icon" href="logo.PNG">
<style>
:root{--n:#12203a;--p:#e51f45;--bg:#f5f7fb;--l:#e5eaf1;--m:#66748b;--g:#087f5b;--gold:#b77900}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#243047;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1380px;margin:auto;padding:28px 18px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;margin-bottom:18px}.brand{font-size:25px;font-weight:900;color:var(--n)}.brand span{color:var(--p)}.sub{color:var(--m);font-size:12px;margin-top:4px}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.soft{background:#fff;color:var(--n);border:1px solid var(--l)}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:18px;margin-bottom:15px;box-shadow:0 10px 35px rgba(18,32,58,.06)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid var(--l);border-radius:15px;padding:15px}.stat small{display:block;color:var(--m)}.stat strong{display:block;font-size:27px;color:var(--p);margin-top:4px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--l);vertical-align:top}.table th{font-size:11px;color:var(--m)}.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;background:#fef3c7;color:#92400e}.btn-mini{padding:7px 10px;border-radius:9px;font:800 10px system-ui;cursor:pointer;border:1px solid var(--l);background:#fff}.modal{position:fixed;inset:0;background:rgba(18,32,58,.5);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.box{width:min(900px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--l);border-radius:12px;padding:11px}.item small{display:block;color:var(--m);font-size:10px}.item strong{display:block;margin-top:3px;word-break:break-word}.wide{grid-column:1/-1}.msg{margin-top:8px;font-size:11px}.err{color:#b42318}.ok{color:var(--g)}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="brand">Med<span>Life</span> · طلبات استعادة الحساب</div><div class="sub">طلبات يتم تعبئتها من Telegram وتظهر هنا مباشرة للمراجعة الإدارية.</div></div><div><a class="btn soft" href="/admin/">← لوحة الإدارة</a> <button class="btn primary" id="refresh">تحديث</button></div></header>
<div id="msg" class="msg"></div>
<section class="stats"><div class="stat"><small>طلبات بانتظار المراجعة</small><strong id="count">—</strong></div><div class="stat"><small>آخر طلب</small><strong id="last" style="font-size:16px">—</strong></div><div class="stat"><small>المصدر</small><strong style="font-size:16px">Telegram → الموقع</strong></div></section>
<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>رقم الطلب</th><th>الاسم</th><th>الهاتف</th><th>Telegram</th><th>القسم</th><th>الخلية</th><th>تاريخ الطلب</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="9" style="padding:30px;text-align:center;color:var(--m)">جارٍ التحميل...</td></tr></tbody></table></div></section>
</main><div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="title" style="margin:0;color:var(--n)">تفاصيل الطلب</h2><div id="meta" class="sub"></div></div><button class="btn soft" id="close">إغلاق</button></div><div id="details" class="grid" style="margin-top:15px"></div></div></div>
<script>
const $=id=>document.getElementById(id);let requests=[];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function fmt(v){if(!v)return '—';try{return new Date(v).toLocaleString('ar-SY')}catch{return v}}
function render(){ $('count').textContent=requests.length; $('last').textContent=requests[0]?.full_name||'—'; $('rows').innerHTML=requests.length?requests.map((r,i)=>{const p=r.profile||{};return `<tr><td><strong>${esc(r.id)}</strong></td><td>${esc(r.full_name)}</td><td>${esc(r.phone||p.phone)}</td><td>${esc(r.telegram_user_id||'—')}</td><td>${esc(p.department_name||'—')}</td><td>${esc(p.unit_name||'—')}</td><td>${esc(fmt(r.submitted_at||r.created_at))}</td><td><span class="badge">بانتظار التحقق</span></td><td><button class="btn-mini" onclick="openReq(${i})">عرض التفاصيل</button></td></tr>`}).join(''):`<tr><td colspan="9" style="padding:30px;text-align:center;color:var(--m)">لا توجد طلبات بانتظار المراجعة.</td></tr>`}
async function load(){try{$('msg').className='msg';$('msg').textContent='جاري تحميل الطلبات من نظام Telegram…';const r=await fetch('/api/admin/recovery-requests',{credentials:'include',cache:'no-store'});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تحميل الطلبات');requests=d.requests||[];render();$('msg').className='msg ok';$('msg').textContent=`تم تحميل ${requests.length} طلب/طلبات مباشرة من نظام Telegram.`}catch(e){$('msg').className='msg err';$('msg').textContent=e.message;$('rows').innerHTML='<tr><td colspan="9" style="padding:30px;text-align:center;color:#b42318">تعذر تحميل طلبات الاستعادة.</td></tr>'}}
function openReq(i){const r=requests[i],p=r.profile||{};$('meta').textContent=`${r.id} · ${fmt(r.submitted_at||r.created_at)}`;const entries=[['الاسم النظامي',p.legal_name_ar||r.full_name],['اسم الأب',p.father_name],['اسم الأم',p.mother_name],['الجنس',p.gender],['تاريخ الميلاد',p.birth_date],['الجنسية',p.nationality],['الرقم الوطني',p.national_id],['المحافظة',p.province],['المدينة',p.city],['الهاتف',p.phone||r.phone],['البريد',p.email||r.email],['Telegram ID',r.telegram_user_id],['المهنة',p.profession],['الاختصاص',p.specialization],['جهة العمل',p.employer],['المسمى الوظيفي',p.job_title],['سنة الانضمام',p.medlife_join_year],['آخر دور',p.last_medlife_role],['القسم',p.department_name],['الخلية/الفرع',p.unit_name],['الالتزام الأسبوعي',p.weekly_commitment_hours],['نمط التطوع',p.volunteer_mode],['الاستجابة للطوارئ',p.emergency_response],['التنقل',p.mobility],['المشرف السابق',p.previous_medlife_supervisor],['الأهداف',p.goals],['المهارات',Array.isArray(p.skills)?p.skills.join('، '):p.skills],['اللغات',Array.isArray(p.languages)?p.languages.join('، '):p.languages]];$('details').innerHTML=entries.map(([k,v])=>`<div class="item"><small>${esc(k)}</small><strong>${esc(v||'—')}</strong></div>`).join('')+`<div class="item wide"><small>ملاحظات الخبرة التطوعية</small><strong>${esc(p.volunteer_experience_notes||'—')}</strong></div>`;$('modal').classList.add('show')}
$('close').onclick=()=>$('modal').classList.remove('show');$('refresh').onclick=load;load();
</script></body></html>
