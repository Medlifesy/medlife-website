<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأدوار والصلاحيات | MedLife</title><link rel="icon" href="/logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--n:#151d36;--r:#a51f45;--bg:#f5f6f8;--w:#fff;--l:#e3e6eb;--m:#778090;--ok:#17765b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#273043;font-family:Cairo,Arial,sans-serif}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.top{height:76px;background:#fff;border-bottom:1px solid var(--l)}.topin{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--n)}.brand img{width:45px;height:45px}.brand b{display:block;font-size:14px}.brand small{display:block;color:var(--m);font-size:9px}.btn{border:1px solid var(--l);background:#fff;color:var(--n);border-radius:8px;padding:9px 14px;font:inherit;font-size:10px;font-weight:800;cursor:pointer}.primary{background:var(--n);color:#fff;border-color:var(--n)}main{padding:30px 0 60px}.head{margin-bottom:18px}.head h1{margin:0;color:var(--n);font-size:26px}.head p{margin:4px 0;color:var(--m);font-size:10px}.layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.roles,.panel{background:#fff;border:1px solid var(--l);border-radius:14px;padding:10px}.role{width:100%;background:#fff;border:0;border-bottom:1px solid var(--l);padding:13px 11px;text-align:right;font:inherit;cursor:pointer}.role:last-child{border:0}.role.active{background:#eef1f5;color:var(--n);font-weight:900;border-radius:8px}.panel{padding:20px}.panel h2{margin:0;color:var(--n);font-size:16px}.panel>p{margin:4px 0 18px;color:var(--m);font-size:9px}.perm{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:11px 0;border-bottom:1px solid var(--l)}.perm:last-child{border:0}.perm b{font-size:10px}.perm small{display:block;color:var(--m);font-size:8px}.check{width:19px;height:19px;accent-color:var(--n)}.actions{display:flex;align-items:center;gap:10px;margin-top:17px}.msg{font-size:9px;font-weight:800}.ok{color:var(--ok)}.err{color:var(--r)}@media(max-width:700px){.layout{grid-template-columns:1fr}.top{height:auto}.topin{padding:9px 0}.head h1{font-size:22px}}</style></head><body><header class="top"><div class="wrap topin"><a class="brand" href="/admin.html"><img src="/logo.PNG" alt="MedLife"><span><b>MedLife Admin</b><small>الأدوار والصلاحيات</small></span></a><a class="btn" href="/admin.html">العودة إلى الإدارة</a></div></header><main class="wrap"><div class="head"><h1>الأدوار والصلاحيات</h1><p>تحديد الصلاحيات الفعلية لكل دور إداري في منظومة MedLife.</p></div><div class="layout"><aside class="roles" id="roles">جارٍ التحميل...</aside><section class="panel"><h2 id="title">اختر دوراً</h2><p id="desc">يمكنك تعديل الصلاحيات ثم حفظها.</p><div id="perms"></div><div class="actions"><button class="btn primary" id="save">حفظ الصلاحيات</button><span id="msg" class="msg"></span></div></section></div></main><script>const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));let data,selected;async function load(){const r=await fetch('/api/admin-core?action=roles',{credentials:'include',cache:'no-store'});data=await r.json();if(!r.ok)throw Error(data.error||'تعذر تحميل الأدوار');$('roles').innerHTML=(data.roles||[]).map((r,i)=>`<button class="role ${i?'':'active'}" data-key="${esc(r.role_key)}">${esc(r.name)}<br><small style="color:#778090">${r.users||0} مستخدم</small></button>`).join('');document.querySelectorAll('.role').forEach(x=>x.onclick=()=>select(x.dataset.key));select(data.roles?.[0]?.role_key)}function select(k){selected=k;document.querySelectorAll('.role').forEach(x=>x.classList.toggle('active',x.dataset.key===k));const r=(data.roles||[]).find(x=>x.role_key===k);$('title').textContent=r?.name||k;const current=new Set((data.role_permissions||[]).filter(x=>x.role_key===k).map(x=>x.permission_key));$('perms').innerHTML=(data.permissions||[]).map(p=>`<label class="perm"><span><b>${esc(p.name)}</b><small>${esc(p.key)}</small></span><input class="check" type="checkbox" value="${esc(p.key)}" ${current.has(p.key)?'checked':''}></label>`).join('')}$('save').onclick=async()=>{const permissions=[...document.querySelectorAll('.check:checked')].map(x=>x.value);$('msg').className='msg';$('msg').textContent='جارٍ الحفظ...';try{const r=await fetch('/api/admin-core?action=set-role-permissions',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({role_key:selected,permissions})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر حفظ الصلاحيات');$('msg').className='msg ok';$('msg').textContent='تم حفظ الصلاحيات بنجاح.'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message}};load().catch(e=>{$('roles').textContent=e.message;$('msg').textContent=e.message;$('msg').className='msg err'});</script></body></html>
