<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الفرق والخلايا V2 | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f7fb;color:#243047;font-family:Cairo,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.top h1{margin:0;color:#12203a}.top p{color:#6b778c;font-size:12px}.btn{border:0;border-radius:10px;padding:10px 14px;font:800 11px Cairo;cursor:pointer}.red{background:#e51f45;color:#fff}.soft{background:#eef2f7;color:#12203a}.green{background:#e8f8f2;color:#08704f}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 12px 30px rgba(18,32,58,.06)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:13px;border:1px solid #e5eaf1;border-radius:14px;background:#fff}.stat small{display:block;color:#6b778c;font-size:10px}.stat b{font-size:24px;color:#e51f45}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{border:1px solid #e5eaf1;border-radius:15px;padding:14px}.section h3{margin:0;color:#12203a;font-size:15px}.cell{border:1px solid #e5eaf1;background:#fbfcfe;border-radius:11px;padding:9px;margin-top:7px;display:flex;justify-content:space-between;gap:10px}.chip{display:inline-block;background:#eef2f7;border-radius:999px;padding:4px 8px;font-size:9px;margin:3px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.tools input,.tools select,.modal select,.modal textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #e5eaf1;border-radius:9px;font:inherit}.members{display:grid;gap:8px;margin-top:10px}.member{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;align-items:center;border:1px solid #e5eaf1;border-radius:11px;padding:9px}.muted{color:#6b778c;font-size:10px}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.role{border:1px solid #e5eaf1;border-radius:13px;padding:12px}.role h4{margin:0;color:#12203a}.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:20px;width:min(650px,100%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.full{grid-column:1/-1}@media(max-width:900px){.stats,.grid,.roles{grid-template-columns:1fr}.tools{grid-template-columns:1fr}.member,.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>إدارة الفرق والخلايا V2</h1><p>توزيع أعضاء MedLife على الأقسام والخلايا والأدوار التنظيمية.</p></div><div><a class="btn soft" href="/admin/">لوحة الإدارة</a><button class="btn red" id="addSec">إضافة قسم</button><button class="btn red" id="addCell">إضافة خلية</button></div></div><div id="msg"></div><div class="stats" style="margin:14px 0"><div class="stat"><small>الأعضاء</small><b id="m">—</b></div><div class="stat"><small>الأقسام</small><b id="s">—</b></div><div class="stat"><small>الخلايا</small><b id="c">—</b></div><div class="stat"><small>التكليفات</small><b id="a">—</b></div><div class="stat"><small>غير موزعين</small><b id="u">—</b></div></div><section class="card"><h2>الأقسام والخلايا</h2><div id="org" class="grid"></div></section><section class="card"><h2>توزيع الأعضاء</h2><div class="tools"><input id="q" placeholder="بحث بالاسم أو رقم العضوية أو الهاتف"><select id="fs"><option value="">كل الأقسام</option></select><select id="fc"><option value="">كل الخلايا</option></select><select id="fst"><option value="">الكل</option><option value="assigned">موزع</option><option value="unassigned">غير موزع</option></select></div><div id="members" class="members"></div></section><section class="card"><h2>الإدارة العامة</h2><div id="roles" class="roles"></div></section></main><div id="modal" class="modal"><div class="box"><div style="display:flex;justify-content:space-between"><h3 id="mt">توزيع عضو</h3><button class="btn soft" id="close">إغلاق</button></div><form id="form" class="form"><label class="full">العضو<select id="member"></select></label><label>القسم<select id="section"></select></label><label>الخلية<select id="cell"></select></label><label>الدور<select id="role"><option value="member">عضو</option><option value="general_team_supervisor">مشرف عام للفريق</option><option value="advisor">مستشار</option><option value="medical_director">المدير الطبي</option><option value="general_cell_supervisor">مشرف عام للخلايا</option><option value="cell_supervisor">مشرف خلية</option><option value="assistant_supervisor">مساعد مشرف</option></select></label><label>ملاحظات<textarea id="notes"></textarea></label><div class="full"><button class="btn red">حفظ</button></div></form></div></div><script>const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const rt={member:'عضو',general_team_supervisor:'مشرف عام للفريق',advisor:'مستشار',medical_director:'المدير الطبي',general_cell_supervisor:'مشرف عام للخلايا',cell_supervisor:'مشرف خلية',assistant_supervisor:'مساعد مشرف'};let st={sections:[],cells:[],assignments:[],members:[]};async function api(o={}){let r=await fetch('/api/admin/organization',{...o,credentials:'include',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ العملية');return d}function cellNames(id){return st.cells.filter(x=>x.section_id===id)}function assigned(id){return st.assignments.find(x=>x.member_id===id&&x.role_key==='member')}function fillFilters(){fs.innerHTML='<option value="">كل الأقسام</option>'+st.sections.filter(x=>x.section_type!=='administration').map(x=>`<option value="${x.id}">${esc(x.name_ar)}</option>`).join('');fillCells()}function fillCells(){let id=+fs.value||0,cells=id?st.cells.filter(x=>x.section_id===id):st.cells;fc.innerHTML='<option value="">كل الخلايا</option>'+cells.map(x=>`<option value="${x.id}">${esc(x.name_ar)}</option>`).join('')}function render(){m.textContent=st.members.length;s.textContent=st.sections.length;c.textContent=st.cells.length;a.textContent=st.assignments.length;u.textContent=st.members.filter(x=>!assigned(x.id)).length;fillFilters();org.innerHTML=st.sections.filter(x=>x.section_type!=='administration').map(sec=>`<div class="section"><h3>${esc(sec.name_ar)}</h3><div class="muted">${cellNames(sec.id).length} خلايا</div>${cellNames(sec.id).map(cell=>{let ms=st.assignments.filter(x=>x.cell_id===cell.id);return `<div class="cell"><span><b>${esc(cell.name_ar)}</b><div>${ms.slice(0,6).map(x=>`<span class="chip">${esc(x.full_name)}</span>`).join('')||'<span class="muted">لا يوجد أعضاء</span>'}</div></span><button class="btn green" onclick="openAssign(null,${cell.id})">تعيين</button></div>`}).join('')}</div>`).join('');renderMembers();roles.innerHTML=['general_team_supervisor','advisor','medical_director','general_cell_supervisor','cell_supervisor','assistant_supervisor'].map(k=>`<div class="role"><h4>${rt[k]}</h4>${st.assignments.filter(x=>x.role_key===k).map(x=>`<p>${esc(x.full_name)} <span class="muted">${esc(x.cell_name||'عام')}</span></p>`).join('')||'<span class="muted">غير محدد</span>'}</div>`).join('')}function renderMembers(){let q=$('q').value.trim().toLowerCase(),sid=+fs.value||0,cid=+fc.value||0,status=fst.value;let rows=st.members.filter(x=>{let as=st.assignments.filter(a=>a.member_id===x.id&&a.role_key==='member'),hay=[x.full_name,x.member_code,x.phone].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!sid||as.some(a=>a.section_id===sid))&&(!cid||as.some(a=>a.cell_id===cid))&&(!status||(status==='assigned'?as.length===1:as.length===0))});members.innerHTML=rows.slice(0,250).map(x=>{let a=assigned(x.id);return `<div class="member"><div><b>${esc(x.full_name)}</b><div class="muted">${esc(x.member_code||'بدون رقم')} · ${esc(x.phone||'')}</div></div><div>${a?esc(a.section_name||'—'):'<span class="muted">غير موزع</span>'}</div><div>${a?esc(a.cell_name||'—'):'—'}</div><button class="btn green" onclick="openAssign(${x.id},${a?.cell_id||''})">${a?'تعديل':'توزيع'}</button></div>`}).join('')||'<div class="muted">لا توجد نتائج.</div>'}function openAssign(mid,cellId){modal.classList.add('show');member.innerHTML=st.members.map(x=>`<option value="${x.id}" ${x.id===mid?'selected':''}>${esc(x.full_name)} — ${esc(x.member_code||'')}</option>`).join('');section.innerHTML='<option value="">اختر</option>'+st.sections.filter(x=>x.section_type!=='administration').map(x=>`<option value="${x.id}">${esc(x.name_ar)}</option>`).join('');if(cellId){let c=st.cells.find(x=>x.id===cellId);if(c)section.value=c.section_id}updateCells(cellId);let old=mid?assigned(mid):null;role.value=old?.role_key||'member';notes.value=old?.notes||''}function updateCells(sel=0){let sid=+section.value||0,cs=sid?st.cells.filter(x=>x.section_id===sid):st.cells;cell.innerHTML='<option value="">اختر</option>'+cs.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name_ar)}</option>`).join('')}async function load(){try{st=await api();render()}catch(e){msg.innerHTML='<p style="color:#b42318">'+esc(e.message)+'</p>'}}section.onchange=()=>updateCells();fs.onchange=()=>{fillCells();renderMembers()};fc.onchange=renderMembers;fst.onchange=renderMembers;q.oninput=renderMembers;close.onclick=()=>modal.classList.remove('show');form.onsubmit=async e=>{e.preventDefault();let r=role.value,cellId=['general_team_supervisor','advisor','medical_director'].includes(r)?null:(+cell.value||null),sectionId=cellId?(+section.value||null):null;if(!cellId&&r!=='general_team_supervisor'&&r!=='advisor'&&r!=='medical_director'){msg.innerHTML='<p style="color:#b42318">اختر الخلية.</p>';return}try{await api({method:'POST',body:JSON.stringify({action:'assign_role',member_id:+member.value,role_key:r,section_id:sectionId,cell_id:cellId,notes:notes.value})});modal.classList.remove('show');load()}catch(e){msg.innerHTML='<p style="color:#b42318">'+esc(e.message)+'</p>'}};addSec.onclick=async()=>{let n=prompt('اسم القسم');if(!n)return;let code=prompt('الكود بالإنكليزي مثل content_team');if(!code)return;try{await api({method:'POST',body:JSON.stringify({action:'create_section',code,name_ar:n})});load()}catch(e){alert(e.message)}};addCell.onclick=async()=>{let sec=st.sections.filter(x=>x.section_type!=='administration'),opts=sec.map(x=>x.id+': '+x.name_ar).join('\n');let id=Number(prompt('رقم القسم:\n'+opts));if(!id)return;let n=prompt('اسم الخلية');if(!n)return;let code=prompt('الكود بالإنكليزي');if(!code)return;try{await api({method:'POST',body:JSON.stringify({action:'create_cell',section_id:id,code,name_ar:n})});load()}catch(e){alert(e.message)}};load();</script></body></html>
