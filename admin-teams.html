<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة الفرق والخلايا | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--red:#e51f45;--navy:#12203a;--ink:#26344d;--muted:#6b778c;--bg:#f5f7fb;--line:#e5eaf1;--green:#087f5b;--gold:#b77900;--shadow:0 16px 45px rgba(18,32,58,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Arial,sans-serif}.wrap{width:min(1380px,calc(100% - 28px));margin:auto;padding:25px 0 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.top h1{margin:0;color:var(--navy);font-size:28px}.top p{margin:3px 0;color:var(--muted);font-size:12px}.btn{border:0;border-radius:11px;padding:10px 14px;font:800 11px Cairo;cursor:pointer}.primary{background:var(--red);color:#fff}.soft{background:#eef2f7;color:var(--navy)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:15px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select{min-width:180px;flex:1;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;background:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{display:block;color:var(--red);font-size:25px;margin-top:3px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.team{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.team h3{margin:0;color:var(--navy);font-size:15px}.team .count{font-size:25px;color:var(--red);font-weight:900}.team .meta{font-size:10px;color:var(--muted);margin-bottom:9px}.person{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:11px}.person small{display:block;color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#eef2f7;font-size:9px;font-weight:900}.supervisor{background:#fff4e8;color:#9a5b00}.active{background:#e8f8f2;color:#08704f}.modal{position:fixed;inset:0;background:rgba(18,32,58,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modal-box{width:min(700px,100%);background:#fff;border-radius:20px;padding:20px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:10px;font-weight:900;margin:0 0 4px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}.msg{margin-top:9px;font-size:11px}.ok{color:var(--green)}.err{color:#b42318}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid,.modal-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><h1>إدارة الفرق والخلايا</h1><p>توزيع أعضاء MedLife على الخلايا، متابعة المسؤولين، وتعديل الدور والحالة من مكان واحد.</p></div><a class="btn soft" href="/admin/">← لوحة الإدارة</a></header><section class="card"><div class="toolbar"><input id="search" placeholder="بحث بالاسم أو رقم العضوية..."><select id="filterCell"><option value="">كل الخلايا</option></select><select id="filterRole"><option value="">كل الأدوار</option><option value="volunteer">متطوع</option><option value="supervisor">مشرف</option><option value="general_supervisor">مشرف عام</option><option value="assistant_supervisor">مساعد مشرف</option></select><button class="btn primary" id="reload">تحديث البيانات</button></div><div id="msg" class="msg"></div></section><section class="stats"><div class="stat"><small>الأعضاء النشطون</small><strong id="active">—</strong></div><div class="stat"><small>الخلايا الفعالة</small><strong id="cells">—</strong></div><div class="stat"><small>المشرفون</small><strong id="supervisors">—</strong></div><div class="stat"><small>غير موزعين</small><strong id="unassigned">—</strong></div></section><section class="card"><div id="grid" class="grid"></div></section></main><div id="modal" class="modal"><div class="modal-box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 id="mtitle" style="margin:0;color:var(--navy);font-size:20px">تعديل عضو</h2><div id="msub" style="font-size:10px;color:var(--muted)"></div></div><button class="btn soft" id="close">إغلاق</button></div><div class="modal-grid" style="margin-top:15px"><div class="field"><label>الاسم</label><input id="full_name"></div><div class="field"><label>الفريق / الخلية</label><select id="cell"></select></div><div class="field"><label>الدور</label><select id="role"><option value="volunteer">متطوع</option><option value="supervisor">مشرف</option><option value="general_supervisor">مشرف عام</option><option value="assistant_supervisor">مساعد مشرف</option></select></div><div class="field"><label>الحالة</label><select id="status"><option value="active">نشط</option><option value="pending">معلق</option><option value="suspended">موقوف</option><option value="inactive">غير نشط</option></select></div><div class="field"><label>البريد</label><input id="email"></div><div class="field"><label>الهاتف</label><input id="phone"></div><div class="field"><label>المحافظة</label><input id="governorate"></div><div class="field"><label>المهنة</label><input id="profession"></div><div class="field"><label>مكان العمل</label><input id="workplace"></div><div class="field"><label>اختصاص الاستشارات</label><input id="specialty"></div></div><div style="display:flex;justify-content:flex-start;gap:8px;margin-top:15px"><button class="btn primary" id="save">حفظ التعديلات</button></div><div id="saveMsg" class="msg"></div></div></div><script>const $=id=>document.getElementById(id);let members=[];let selected=null;const cells={plasma_cell:'Plasma Cell · القيادة والدعم',neuron_cell:'Neuron Cell · الإعلام المعرفي',astrocyte_cell:'Astrocyte Cell · الدعم والتنسيق',leukocyte_cell:'Leukocyte Cell · الاستجابة الميدانية',heart_cell:'Heart Cell · المبادرات المجتمعية',red_blood_cell:'Red Blood Cell · الدعم اللوجستي',blog:'المدونة / المحتوى',design:'التصميم',video_editing:'تحرير الفيديو',visual_media:'الإعلام المرئي',instagram:'Instagram',telegram:'Telegram',administration:'الإدارة',voice_over:'التعليق الصوتي',coordination:'التنسيق',university_media:'الإعلام الجامعي',field:'الفريق الميداني',consultations:'الاستشارات الطبية'};const roleText={volunteer:'متطوع',supervisor:'مشرف',general_supervisor:'مشرف عام',assistant_supervisor:'مساعد مشرف'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:'include',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ العملية.');return d}async function load(){try{const d=await api('/api/admin/list-members');members=d.members||[];populateFilters();render();$('msg').className='msg ok';$('msg').textContent='تم تحميل بيانات الفرق بنجاح.'}catch(e){$('msg').className='msg err';$('msg').textContent=e.message}}function populateFilters(){const cur=$('filterCell').value;$('filterCell').innerHTML='<option value="">كل الخلايا</option>'+Object.entries(cells).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');$('filterCell').value=cur;$('cell').innerHTML=Object.entries(cells).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('')}function render(){const q=$('search').value.trim().toLowerCase(),fc=$('filterCell').value,fr=$('filterRole').value;const ms=members.filter(m=>(!q||[m.full_name,m.member_code,m.account_email,m.email].some(v=>String(v||'').toLowerCase().includes(q)))&&(!fc||m.cell===fc)&&(!fr||m.medlife_role===fr));$('active').textContent=members.filter(m=>m.status==='active').length;$('cells').textContent=new Set(members.filter(m=>m.status==='active'&&m.cell).map(m=>m.cell)).size;$('supervisors').textContent=members.filter(m=>['supervisor','general_supervisor','assistant_supervisor'].includes(m.medlife_role)&&m.status==='active').length;$('unassigned').textContent=members.filter(m=>!m.cell).length;const groups={};ms.forEach(m=>{const key=m.cell||'__none';(groups[key]??=[]).push(m)});const keys=Object.keys(groups).sort();$('grid').innerHTML=keys.map(k=>{const title=k==='__none'?'غير موزعين':cells[k]||k;const arr=groups[k];return `<article class="team"><h3>${esc(title)}</h3><div class="count">${arr.length}</div><div class="meta">أعضاء ظاهرون حسب الفلتر الحالي</div>${arr.slice(0,10).map(m=>`<div class="person"><div><strong>${esc(m.full_name)}</strong><small>${esc(m.member_code||'—')} · ${esc(roleText[m.medlife_role]||m.medlife_role||'عضو')}</small></div><div><span class="badge ${m.status==='active'?'active':''}">${esc(m.status||'—')}</span><button class="btn soft" style="padding:6px 8px;margin-right:4px" onclick="editMember(${m.id})">تعديل</button></div></div>`).join('')}${arr.length>10?`<div class="meta" style="margin-top:8px">+ ${arr.length-10} أعضاء آخرون</div>`:''}</article>`}).join('')||'<div class="meta">لا توجد نتائج مطابقة.</div>'}function editMember(id){selected=members.find(m=>m.id===id);if(!selected)return;$('full_name').value=selected.full_name||'';$('email').value=selected.email||selected.account_email||'';$('phone').value=selected.phone||'';$('governorate').value=selected.governorate||'';$('profession').value=selected.profession||'';$('workplace').value=selected.workplace||'';$('specialty').value=selected.consultation_specialty||'';$('role').value=selected.medlife_role||'volunteer';$('status').value=selected.status||'active';$('cell').value=selected.cell||'administration';$('msub').textContent=(selected.member_code||'—')+' · '+(selected.email||selected.account_email||'—');$('saveMsg').textContent='';$('modal').classList.add('show')}$('close').onclick=()=>{$('modal').classList.remove('show');selected=null};$('save').onclick=async()=>{if(!selected)return;try{const d=await api('/api/admin/update-member',{method:'PUT',body:JSON.stringify({id:selected.id,full_name:$('full_name').value,email:$('email').value,phone:$('phone').value,governorate:$('governorate').value,profession:$('profession').value,workplace:$('workplace').value,consultation_specialty:$('specialty').value,medlife_role:$('role').value,status:$('status').value,cell:$('cell').value})});$('saveMsg').className='msg ok';$('saveMsg').textContent=d.message;await load();const fresh=members.find(m=>m.id===selected.id);if(fresh)editMember(fresh.id)}catch(e){$('saveMsg').className='msg err';$('saveMsg').textContent=e.message}}$('search').oninput=render;$('filterCell').onchange=render;$('filterRole').onchange=render;$('reload').onclick=load;load();</script></body></html>
