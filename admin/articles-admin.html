<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLife Articles Admin</title>
<style>
:root{--primary:#008c95;--dark:#006b70;--bg:#f4f8f8}
*{box-sizing:border-box}body{font-family:Cairo,Arial,sans-serif;background:var(--bg);padding:20px;color:#243b3d}.container{max-width:1100px;margin:auto}.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 15px #00000010}h1{color:var(--dark)}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:10px;border:1px solid #ddd;font-size:15px}textarea{min-height:140px}button{background:var(--primary);color:#fff;border:0;font-weight:bold;cursor:pointer}button:hover{background:var(--dark)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;padding:15px;border-radius:14px;text-align:center}.stat b{display:block;font-size:25px;color:var(--primary)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.article{border-right:4px solid var(--primary);padding:12px;margin:10px 0;background:#fafafa;border-radius:10px}@media(max-width:700px){.stats,.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<h1>📰 لوحة إدارة مقالات MedLife</h1>
<div class="stats"><div class="stat"><b id="total">0</b>الإجمالي</div><div class="stat"><b id="published">0</b>منشور</div><div class="stat"><b id="pending">0</b>مراجعة</div><div class="stat"><b id="draft">0</b>مسودة</div></div>
<div class="card">
<input id="api" value="https://medlife-articles-api.broad-frog-3978.workers.dev">
<input id="key" placeholder="ADMIN_API_KEY">
<button onclick="load()">جلب المقالات</button>
</div>
<div class="card">
<h3>إضافة / تعديل مقال</h3>
<div class="grid">
<input id="id" placeholder="ID للتعديل">
<input id="author_name" placeholder="اسم الكاتب">
<input id="title_ar" placeholder="العنوان العربي">
<input id="title_en" placeholder="العنوان الإنكليزي">
<input id="category" placeholder="التصنيف">
<select id="status"><option value="pending">قيد المراجعة</option><option value="draft">مسودة</option><option value="published">منشور</option></select>
</div>
<textarea id="content_ar" placeholder="المحتوى العربي"></textarea>
<textarea id="content_en" placeholder="المحتوى الإنكليزي"></textarea>
<button onclick="save()">حفظ المقال</button>
</div>
<div class="card"><h3>المقالات</h3><div id="list"></div></div>
</div>
<script>
const $=x=>document.getElementById(x);function headers(){return {'Content-Type':'application/json','Authorization':'Bearer '+$('key').value}}
async function load(){let r=await fetch($('api').value+'/articles',{headers:headers()});let d=await r.json();let a=Array.isArray(d)?d:(d.articles||[]);$('total').innerText=a.length;$('published').innerText=a.filter(x=>x.status==='published').length;$('pending').innerText=a.filter(x=>x.status==='pending').length;$('draft').innerText=a.filter(x=>x.status==='draft').length;$('list').innerHTML=a.map(x=>`<div class="article"><b>${x.title_ar||''}</b><br>${x.status||''} - ${x.author_name||''}</div>`).join('')}
async function save(){let b={title_ar:$('title_ar').value,title_en:$('title_en').value,content_ar:$('content_ar').value,content_en:$('content_en').value,author_name:$('author_name').value,category:$('category').value,status:$('status').value};let id=$('id').value;await fetch($('api').value+(id?'/articles/'+id:'/articles'),{method:id?'PUT':'POST',headers:headers(),body:JSON.stringify(b)});load();alert('تم الحفظ')}
</script>
</body></html>
