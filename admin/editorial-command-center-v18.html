<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MedLife | Editorial Command Center</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--ink:#151d36;--red:#ff2a54;--green:#059669;--blue:#2563eb;--purple:#6d28d9;--bg:#f5f7fb;--line:#e2e8f0;--muted:#64748b}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Cairo,Arial,sans-serif;background:var(--bg);color:var(--ink)}body{overflow:hidden}.top{height:auto;min-height:70px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}.topin{max-width:1800px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto}.brand img{width:42px;height:42px;object-fit:contain}.brand h1{font-size:15px;margin:0;font-weight:900}.brand p{font-size:8px;color:var(--muted);margin:1px 0 0}.actions{display:flex;gap:6px;align-items:center;flex:1;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.actions::-webkit-scrollbar{display:none}button{font:800 11px Cairo;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;min-height:38px}.red{background:var(--red);color:#fff;border-color:var(--red)}.green{background:var(--green);color:#fff;border-color:var(--green)}.ai{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff;border:0}.shell{height:calc(100vh - 70px);position:relative}.shell iframe{display:block;width:100%;height:100%;border:0;background:#fff}.toast{position:fixed;left:14px;bottom:14px;z-index:100;background:var(--ink);color:#fff;padding:9px 12px;border-radius:10px;font-size:10px;font-weight:800;display:none;max-width:calc(100% - 28px)}.modal{position:fixed;inset:0;z-index:50;background:#0f172a99;display:none;align-items:center;justify-content:center;padding:14px}.modal.show{display:flex}.box{background:#fff;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:16px}.boxhead{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px}.box h2{font-size:17px;margin:0}.box p{font-size:11px;line-height:1.9}.suggestion{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0;font-size:10px;line-height:1.8}@media(max-width:800px){.topin{display:block;padding:8px 10px}.brand{margin-bottom:7px}.brand img{width:34px;height:34px}.brand h1{font-size:12px}.brand p{font-size:7px}.actions{width:100%;gap:5px}.actions button{min-width:max-content;padding:7px 9px;font-size:10px;min-height:34px}.shell{height:calc(100vh - 99px)}}@media(max-width:480px){.brand h1{font-size:11px}.shell{height:calc(100vh - 96px)}}</style></head><body><header class="top"><div class="topin"><div class="brand"><img src="/logo.PNG" alt="MedLife"><div><h1>MedLife Editorial Command Center</h1><p>إدارة المقالات • التحرير • SEO • المعاينة • النشر</p></div></div><nav class="actions"><button id="refresh">🔄 تحديث</button><button id="all">📚 الكل</button><button id="drafts">📝 المسودات</button><button id="published" class="green">🟢 المنشورة</button><button id="preview" class="red">👁️ معاينة</button><button id="review">🧠 مراجعة طبية</button><button id="language">✍️ لغوي</button><button id="tashkeel">🔤 تشكيل</button><button id="format">✨ تنسيق</button><button id="unpublish" class="green">↩️ إلغاء النشر</button><button id="ai" class="ai">🤖 AI SEO</button></nav></div></header><main class="shell"><iframe id="studio" src="/admin/editorial-studio-v12.html" title="MedLife Editorial Studio"></iframe></main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="box"><div class="boxhead"><h2>🤖 AI SEO Optimizer</h2><button id="close">إغلاق</button></div><div id="body"><p>اختر مقالاً ثم ابدأ التحليل.</p></div></div></div><script>(()=>{'use strict';const frame=document.getElementById('studio'),toast=document.getElementById('toast'),modal=document.getElementById('modal'),body=document.getElementById('body');let timer;const msg=s=>{toast.textContent=s;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',3000)};const deep=()=>{let d=frame.contentDocument;if(!d)return null;for(let i=0;i<4;i++){const f=d.getElementById('studio');if(!f||!f.contentDocument)break;d=f.contentDocument}return d};const el=id=>deep()?.getElementById(id);const articleId=()=>Number(el('selectedId')?.textContent||0)||0;const value=id=>(el(id)?.value||'').trim();const content=()=>el('contentEditor')?.innerText||'';const click=id=>{const e=el(id);if(!e){msg('⏳ المحرر لم يجهز بعد');return false}e.click();return true};const filter=k=>{const d=deep();if(!d){msg('⏳ المحرر لم يجهز بعد');return}d.querySelectorAll('#list .item').forEach(i=>{const s=(i.querySelector('.badge')?.textContent||'').trim().toLowerCase();i.style.display=k==='all'||s===k?'':'none'});msg(k==='all'?'📚 عرض كل المقالات':k==='draft'?'📝 عرض المسودات':'🟢 عرض المنشورة')};const seoScore=()=>{const t=value('title'),e=value('excerpt'),c=content(),h=el('contentEditor')?.innerHTML||'',r=deep()?.querySelectorAll('#refs .ref')?.length||0;const checks=[t.length>=30&&t.length<=65,e.length>=100&&e.length<=170,c.length>=1200,/<h[23][ >]/i.test(h),r>=2,/<(ul|ol)[ >]/i.test(h),/href=/i.test(h),/<img[^>]+alt=/i.test(h)];return Math.round(checks.filter(Boolean).length/checks.length*100)};const ai=async()=>{const id=articleId();if(!id){msg('🔴 اختر مقالاً أولاً');return}modal.classList.add('show');body.innerHTML='<p>🤖 جارٍ تحليل المقال...</p>';try{const r=await fetch('/api/article-ai',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({action:'seo',article_id:id,title:value('title'),excerpt:value('excerpt'),content:content()})});const d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||('HTTP '+r.status));body.innerHTML='<div class="suggestion"><b>📊 SEO الحالي: '+seoScore()+'/100</b></div><div class="suggestion"><b>🤖 اقتراحات AI</b><br>'+String(d.suggestions||d.message||JSON.stringify(d)).replace(/[<>]/g,'')+'</div>'}catch(e){body.innerHTML='<div class="suggestion"><b>🟠 تعذر التحليل</b><br>'+String(e.message).replace(/[<>]/g,'')+'</div>'}};frame.addEventListener('load',()=>{msg('✅ تم تحميل محرر المقالات');setTimeout(()=>{if(deep())msg('✅ لوحة المقالات جاهزة')},700)});document.getElementById('refresh').onclick=()=>click('refresh');document.getElementById('all').onclick=()=>filter('all');document.getElementById('drafts').onclick=()=>filter('draft');document.getElementById('published').onclick=()=>filter('published');document.getElementById('preview').onclick=()=>click('previewBtn');document.getElementById('review').onclick=()=>click('review');document.getElementById('language').onclick=()=>click('language');document.getElementById('tashkeel').onclick=()=>click('tashkeel');document.getElementById('format').onclick=()=>click('format');document.getElementById('unpublish').onclick=()=>click('unpublish');document.getElementById('ai').onclick=ai;document.getElementById('close').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};})();</script></body></html>
