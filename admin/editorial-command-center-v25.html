<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife | مركز إدارة المحتوى</title><link rel="icon" href="/logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#17213b;--red:#e91e4d;--bg:#f5f7fa;--card:#fff;--line:#e3e8ef;--muted:#718096;--green:#087f5b;--amber:#a15c00;--shadow:0 8px 30px #17213b10}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,Arial,sans-serif}button,input,textarea{font:inherit}button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}button:hover{transform:translateY(-1px);box-shadow:0 5px 14px #17213b12}.primary{background:var(--red);color:#fff;border-color:var(--red)}.success{background:var(--green);color:#fff;border-color:var(--green)}.danger{color:#b42318;border-color:#f2c8c4}.top{position:sticky;top:0;z-index:20;background:#ffffffed;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.topin{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px}.brand h1{font-size:16px;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.wrap{max-width:1500px;margin:auto;padding:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:13px 15px}.stat span{display:block;color:var(--muted);font-size:10px}.stat b{font-size:22px}.layout{display:grid;grid-template-columns:285px minmax(0,1fr) 270px;gap:14px}.panel{min-width:0;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid var(--line);font-weight:800}.body{padding:13px}.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}.filters button{font-size:11px;padding:7px 9px}.filters .on{background:#fff0f4;border-color:#ffc4d2;color:#b5173d}.list{max-height:calc(100vh - 300px);overflow:auto}.item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:#fafbfc}.item.on{background:#fff3f6;border-right:4px solid var(--red)}.item b{font-size:12px;line-height:1.7}.item small{display:block;color:var(--muted);font-size:9px;margin-top:3px}.badge{display:inline-block;border-radius:999px;padding:2px 7px;background:#eef2f7;color:#475569;font-size:8px;margin-top:5px}.published{background:#e8f7f1;color:#087f5b}.pending{background:#fff4df;color:#a15c00}.rejected{background:#fdecec;color:#b42318}.draft{background:#eef2f7;color:#475569}.editor{padding:17px}.title{font-size:22px;font-weight:800;margin:0 0 12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{min-width:0}.field.full{grid-column:1/-1}.label{display:block;font-size:10px;font-weight:800;margin-bottom:4px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;outline:none;background:#fff}.field textarea{resize:vertical;min-height:70px}.toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:7px;background:#f8fafc;border:1px solid var(--line);border-bottom:0;border-radius:11px 11px 0 0}.toolbar button{padding:6px 9px;font-size:11px}.rich{border:1px solid var(--line);border-radius:0 0 11px 11px;background:#fff}.content{min-height:540px;padding:20px;outline:0;line-height:2;font-size:15px}.content h2{border-right:4px solid var(--red);padding-right:10px;margin:26px 0 10px}.content h3{margin:20px 0 8px}.content img{max-width:100%;height:auto;display:block;margin:16px auto;border-radius:10px}.table-wrap{overflow:auto;margin:16px 0}.content table{border-collapse:collapse;width:100%;min-width:520px}.content th,.content td{border:1px solid #d7dee9;padding:8px}.content th{background:var(--navy);color:#fff}.toc{background:#fff5f7;border:1px solid #ffd0db;border-radius:11px;padding:12px;margin:15px 0}.toc a{display:block;color:#334155;text-decoration:none;margin:3px}.sideRow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:10px}.sideActions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.sideActions button{font-size:10px}.empty{text-align:center;color:var(--muted);padding:60px 15px}.modal{display:none;position:fixed;inset:0;background:#0b122a88;z-index:50;align-items:center;justify-content:center;padding:15px}.modal.on{display:flex}.modalbox{width:min(1050px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.preview{background:#f7f9fc;padding:15px;border-radius:12px}.preview article{background:#fff;border-radius:12px;padding:25px;line-height:2}.toast{position:fixed;bottom:18px;left:18px;z-index:100;background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;display:none}@media(max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)}.layout>.panel:last-child{grid-column:1/-1}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.topin{align-items:flex-start;flex-direction:column;padding:10px}.actions{width:100%}.actions button{flex:1}.wrap{padding:8px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.list{max-height:280px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.editor{padding:11px}.content{min-height:420px;padding:13px;font-size:14px}.sideActions{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="topin"><div class="brand"><img src="/logo.PNG"><div><h1>MedLife — مركز إدارة المحتوى والتحرير</h1><p>إدارة المقالات • المراجعة • التحرير • SEO • النشر</p></div></div><div class="actions"><button id="refresh">تحديث</button><button id="new" class="primary">+ مقال جديد</button><button id="save">حفظ</button><button id="preview">معاينة</button><button id="publish" class="success">نشر</button></div></div></header><main class="wrap"><section class="stats"><div class="stat"><span>كل المقالات</span><b id="cAll">—</b></div><div class="stat"><span>قيد المراجعة</span><b id="cPending">—</b></div><div class="stat"><span>مسودات</span><b id="cDraft">—</b></div><div class="stat"><span>منشورة</span><b id="cPub">—</b></div><div class="stat"><span>مرفوضة</span><b id="cReject">—</b></div></section><div class="layout"><section class="panel"><div class="head">المقالات</div><div class="body"><input id="search" class="search" placeholder="ابحث بعنوان أو كاتب..."><div class="filters"><button data-filter="all" class="on">الكل</button><button data-filter="pending">قيد المراجعة</button><button data-filter="draft">مسودات</button><button data-filter="published">منشورة</button><button data-filter="rejected">مرفوضة</button></div><div id="list" class="list"></div></div></section><section class="panel"><div id="editorEmpty" class="empty">اختر مقالاً من القائمة أو اضغط «مقال جديد».</div><div id="editor" class="editor" style="display:none"><div class="title" id="editorTitle">تحرير المقال</div><div class="fields"><div class="field"><label class="label">العنوان العربي *</label><input id="title"></div><div class="field"><label class="label">التصنيف</label><input id="category"></div><div class="field"><label class="label">الكاتب *</label><input id="author"></div><div class="field"><label class="label">العنوان الإنكليزي</label><input id="titleEn"></div><div class="field full"><label class="label">الملخص</label><textarea id="excerpt"></textarea></div><div class="field full"><label class="label">المحتوى</label><div class="toolbar"><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="formatBlock" data-value="h2">عنوان</button><button data-cmd="insertUnorderedList">قائمة</button><button id="format">تنسيق MedLife</button><button id="ai">مراجعة AI</button></div><div class="rich"><div id="content" class="content" contenteditable="true"></div></div></div></div></div></section><aside class="panel"><div class="head">إجراءات المقال</div><div class="body"><div class="sideRow"><span>الحالة</span><b id="state">—</b></div><div class="sideRow"><span>الكلمات</span><b id="words">0</b></div><div class="sideRow"><span>الصور</span><b id="images">0</b></div><div class="sideRow"><span>الجداول</span><b id="tables">0</b></div><div class="sideActions"><button id="unpublish">إلغاء النشر</button><button id="delete" class="danger">🗑️ حذف</button></div><hr><button id="safeFormat" style="width:100%;margin-top:5px">✨ تنسيق آمن</button></div></aside></div></main><div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2>معاينة المقال</h2><button id="close">إغلاق</button></div><div class="preview"><article><h1 id="pvTitle"></h1><div id="pvBody"></div></article></div></div></div><div id="toast" class="toast"></div><script>(()=>{const $=id=>document.getElementById(id),S={items:[],selected:null,filter:'all',creating:false};const toast=m=>{let t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2800)};async function api(url,opt={}){let r=await fetch(url,{...opt,credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{})}});let d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||('HTTP '+r.status));return d}function status(x){return x.status||x.state||'draft'}function data(d){return d.articles||d.items||d.data||d||[]}async function load(){try{let d=await api('/api/articles');S.items=Array.isArray(data(d))?data(d):[];render();toast('تم تحديث المقالات')}catch(e){toast('تعذر تحميل المقالات: '+e.message)}}function render(){let f=S.filter,q=($('search').value||'').toLowerCase();let a=S.items.filter(x=>{let st=status(x);return(f==='all'||st===f)&&(!q||((x.title||'')+' '+(x.author||'')).toLowerCase().includes(q))});$('list').innerHTML=a.length?a.map(x=>{let st=status(x);return `<div class="item ${S.selected&&String(S.selected.id)===String(x.id)?'on':''}" data-id="${x.id}"><b>${esc(x.title||'بدون عنوان')}</b><small>${esc(x.author||'—')}</small><span class="badge ${st}">${label(st)}</span></div>`}).join(''):'<div class="empty">لا توجد مقالات.</div>';document.querySelectorAll('.item').forEach(e=>e.onclick=()=>select(e.dataset.id));let n=k=>S.items.filter(x=>status(x)===k).length;$('cAll').textContent=S.items.length;$('cPending').textContent=n('pending');$('cDraft').textContent=n('draft');$('cPub').textContent=n('published');$('cReject').textContent=n('rejected')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(s){return({pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'})[s]||s}function select(id){S.selected=S.items.find(x=>String(x.id)===String(id));S.creating=false;fill()}function fill(){let x=S.selected;if(!x)return;$('editorEmpty').style.display='none';$('editor').style.display='block';$('editorTitle').textContent='تحرير المقال';$('title').value=x.title||'';$('titleEn').value=x.title_en||x.titleEn||'';$('category').value=x.category||'';$('author').value=x.author||'';$('excerpt').value=x.excerpt||'';$('content').innerHTML=x.content||x.body||'';update()}function update(){let t=$('content').innerText||'';$('words').textContent=t.trim()?t.trim().split(/\s+/).length:0;$('images').textContent=$('content').querySelectorAll('img').length;$('tables').textContent=$('content').querySelectorAll('table').length;$('state').textContent=S.selected?label(status(S.selected)):'—'}function payload(){return{title:$('title').value.trim(),title_en:$('titleEn').value.trim(),category:$('category').value.trim(),author:$('author').value.trim(),excerpt:$('excerpt').value.trim(),content:$('content').innerHTML,status:S.selected?.status||'draft'}}async function save(){if(!S.selected)return toast('اختر مقالاً أولاً');try{let d=await api('/api/articles',{method:'PUT',body:JSON.stringify({...payload(),id:S.selected.id})});toast('تم حفظ المقال');await load();let id=S.selected.id;S.selected=S.items.find(x=>String(x.id)===String(id));fill()}catch(e){toast('فشل الحفظ: '+e.message)}}async function publish(){if(!S.selected)return toast('اختر مقالاً أولاً');try{await api('/api/articles',{method:'PUT',body:JSON.stringify({...payload(),id:S.selected.id,status:'published'})});toast('تم نشر المقال');await load()}catch(e){toast('فشل النشر: '+e.message)}}async function remove(){if(!S.selected)return toast('اختر مقالاً أولاً');if(status(S.selected)!=='draft')return toast('الحذف متاح للمسودات فقط');if(!confirm('هل أنت متأكد من حذف هذه المسودة نهائياً؟'))return;try{await api('/api/articles',{method:'DELETE',body:JSON.stringify({id:S.selected.id})});S.selected=null;$('editor').style.display='none';$('editorEmpty').style.display='block';toast('تم حذف المسودة');await load()}catch(e){toast('فشل الحذف: '+e.message)}}function newArticle(){let x={id:null,title:'',author:'',category:'',excerpt:'',content:'',status:'draft'};S.selected=x;S.creating=true;$('editorEmpty').style.display='none';$('editor').style.display='block';$('editorTitle').textContent='إضافة مقال جديد';['title','titleEn','category','author','excerpt'].forEach(id=>$(id).value='');$('content').innerHTML='';update()}function safeFormat(){let c=$('content'),before=c.innerHTML,imgs=c.querySelectorAll('img').length,tables=c.querySelectorAll('table').length;c.querySelectorAll('h1').forEach(h=>h.tagName!=='H2'&&(h.outerHTML='<h2>'+h.innerHTML+'</h2>'));let hs=[...c.querySelectorAll('h2,h3')];if(hs.length){let toc=document.createElement('div');toc.className='toc';toc.innerHTML='<strong>فهرس المقال</strong>';hs.forEach((h,i)=>{h.id=h.id||'section-'+i;let a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;toc.appendChild(a)});if(!c.querySelector('.toc'))c.insertBefore(toc,c.firstChild)}if(c.querySelectorAll('img').length!==imgs||c.querySelectorAll('table').length!==tables){c.innerHTML=before;return toast('تم إلغاء التنسيق لحماية الصور والجداول')}toast('تم تنسيق المقال دون حذف المحتوى');update()}$('content').addEventListener('input',update);document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.cmd,false,b.dataset.value||null);$('content').focus();update()});$('refresh').onclick=load;$('save').onclick=save;$('publish').onclick=publish;$('delete').onclick=remove;$('new').onclick=newArticle;$('format').onclick=safeFormat;$('safeFormat').onclick=safeFormat;$('ai').onclick=()=>toast('مراجعة AI ستظهر بعد ربط خدمة التدقيق الخاصة بالمشروع');$('search').oninput=render;$('preview').onclick=()=>{if(!S.selected)return toast('اختر مقالاً أولاً');$('pvTitle').textContent=$('title').value;$('pvBody').innerHTML=$('content').innerHTML;$('modal').classList.add('on')};$('close').onclick=()=>$('modal').classList.remove('on');$('unpublish').onclick=async()=>{if(!S.selected)return;try{await api('/api/articles',{method:'PUT',body:JSON.stringify({...payload(),id:S.selected.id,status:'draft'})});toast('تم إلغاء النشر');load()}catch(e){toast('فشل: '+e.message)}};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('on'));b.classList.add('on');S.filter=b.dataset.filter;render()});load()})();</script></body></html>
