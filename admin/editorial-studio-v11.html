<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLife Editorial Studio V11</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}
#studio{display:block;width:100%;height:100%;border:0;background:#fff}
#toast{position:fixed;left:18px;bottom:18px;z-index:9999;background:#151d36;color:#fff;padding:10px 14px;border-radius:12px;font:700 12px Cairo,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
</style>
</head>
<body>
<iframe id="studio" src="/admin/editorial-studio-v10.html" title="MedLife Editorial Studio"></iframe>
<div id="toast">تم تفعيل تحسينات الجداول للمحرر.</div>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('studio');
  const toast=document.getElementById('toast');
  const showToast=()=>{toast.style.display='block';setTimeout(()=>toast.style.display='none',2200)};

  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function isSeparator(s){return /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(String(s||'').trim());}
  function convertMarkdownTables(root){
    if(!root)return false;
    const walker=root.ownerDocument.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    let changed=false;
    for(const node of nodes){
      const text=node.nodeValue||'';
      if(!text.includes('|')||!text.includes('\n'))continue;
      const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      if(lines.length<2)continue;
      let start=-1,end=-1;
      for(let i=0;i<lines.length;i++){
        if(/^\|.*\|$/.test(lines[i])){start=i;break;}
      }
      if(start<0)continue;
      end=start;
      while(end<lines.length&&/^\|.*\|$/.test(lines[end]))end++;
      const block=lines.slice(start,end);
      if(block.length<2)continue;
      const rows=block.map(line=>line.replace(/^\||\|$/g,'').split('|').map(x=>x.trim()));
      if(rows.length<2||rows[0].length<2)continue;
      let header=rows[0],body=rows.slice(1);
      if(body.length&&isSeparator(block[1]))body=rows.slice(2);
      if(!body.length&&header.length<2)continue;
      const table=root.ownerDocument.createElement('table');
      table.setAttribute('data-medlife-table','1');
      const thead=root.ownerDocument.createElement('thead');
      const hr=root.ownerDocument.createElement('tr');
      header.forEach(cell=>{const th=root.ownerDocument.createElement('th');th.contentEditable='true';th.innerHTML=esc(cell);hr.appendChild(th);});
      thead.appendChild(hr);table.appendChild(thead);
      const tbody=root.ownerDocument.createElement('tbody');
      body.forEach(row=>{const tr=root.ownerDocument.createElement('tr');header.forEach((_,i)=>{const td=root.ownerDocument.createElement('td');td.contentEditable='true';td.innerHTML=esc(row[i]||'');tr.appendChild(td);});tbody.appendChild(tr);});
      table.appendChild(tbody);
      const parent=node.parentNode;
      if(!parent)continue;
      const before=lines.slice(0,start),after=lines.slice(end);
      const frag=root.ownerDocument.createDocumentFragment();
      if(before.length)frag.appendChild(root.ownerDocument.createTextNode(before.join('\n')+'\n'));
      frag.appendChild(table);
      if(after.length)frag.appendChild(root.ownerDocument.createTextNode('\n'+after.join('\n')));
      parent.replaceChild(frag,node);
      changed=true;
    }
    return changed;
  }

  function decorate(doc){
    const editors=[...doc.querySelectorAll('[contenteditable="true"]')].filter(e=>e.classList.contains('rich-editor')||e.classList.contains('editor'));
    editors.forEach(editor=>{
      if(editor.dataset.medlifeV11==='1')return;
      editor.dataset.medlifeV11='1';
      const normalize=()=>{if(convertMarkdownTables(editor)){editor.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:null}));}};
      editor.addEventListener('paste',()=>setTimeout(normalize,0));
      editor.addEventListener('blur',normalize);
      editor.addEventListener('input',()=>{if(editor.innerText.includes('|')&&editor.innerText.includes('\n'))setTimeout(normalize,0);});
      normalize();
    });
    doc.querySelectorAll('.rich-editor table,.editor table').forEach(t=>{t.style.width='100%';t.style.borderCollapse='collapse';t.querySelectorAll('th,td').forEach(c=>{c.style.border='1px solid #dbe3ed';c.style.padding='9px';});});
    if(editors.length)showToast();
  }

  frame.addEventListener('load',()=>{
    try{
      const doc=frame.contentDocument;
      decorate(doc);
      const obs=new MutationObserver(()=>decorate(doc));
      obs.observe(doc.body,{subtree:true,childList:true});
    }catch(e){console.warn('MedLife V11 enhancement:',e);}
  });
})();
</script>
</body>
</html>
