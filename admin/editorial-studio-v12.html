<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife Editorial Studio V12</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}#studio{width:100%;height:100%;border:0}#toast{position:fixed;left:18px;bottom:18px;z-index:9999;background:#151d36;color:#fff;padding:10px 14px;border-radius:12px;font:700 12px Cairo,Arial,sans-serif;display:none;max-width:calc(100% - 36px)}#reviewModal{position:fixed;inset:0;background:#0f172a99;z-index:10000;display:none;align-items:center;justify-content:center;padding:14px}#reviewModal.show{display:flex}.box{background:#fff;width:min(1000px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:20px;font-family:Cairo,Arial,sans-serif}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e2e8f0;padding-bottom:10px}.close{border:0;background:#eef2f7;border-radius:10px;padding:9px 14px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.sec{border:1px solid #e2e8f0;border-radius:14px;margin:10px 0;overflow:hidden}.sec h3{margin:0;padding:9px 12px;background:#f8fafc;font-size:14px}.sec ul{margin:0;padding:12px 30px}.sec li{margin:5px 0;line-height:1.8}.ready{padding:10px;background:#eaf8f2;color:#08704f;border-radius:12px;font-weight:800}.needs{padding:10px;background:#fff0f2;color:#a51e2d;border-radius:12px;font-weight:800}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style></head><body><iframe id="studio" src="/admin/editorial-studio-v10.html" title="MedLife Editorial Studio"></iframe><div id="toast"></div><div id="reviewModal"><div class="box"><div class="head"><h2>🧠 نتيجة المراجعة التحريرية</h2><button class="close" id="closeReview">إغلاق</button></div><div id="reviewBody"></div></div></div><script>(()=>{'use strict';const frame=document.getElementById('studio'),toast=document.getElementById('toast'),modal=document.getElementById('reviewModal'),body=document.getElementById('reviewBody');let timer;const D=()=>frame.contentDocument,$=id=>D()?.getElementById(id),v=id=>($(id)?.value||'').trim(),id=()=>Number($('selectedId')?.textContent||0)||0,toastMsg=(x,t=2800)=>{toast.textContent=x;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',t)};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function api(u,o={}){const r=await fetch(u,{...o,credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok||d.success===false)throw Error(d.error||('HTTP '+r.status));return d}function status(){return String(D()?.querySelector('.item.active .badge')?.textContent||'').trim().toLowerCase()}function refs(){const c=$('refs');return c?[...c.querySelectorAll('.ref')].map(r=>({title:r.querySelector('[data-r=title]')?.value?.trim()||'',organization:r.querySelector('[data-r=organization]')?.value?.trim()||'',year:r.querySelector('[data-r=year]')?.value?.trim()||'',url:r.querySelector('[data-r=url]')?.value?.trim()||'',doi:r.querySelector('[data-r=doi]')?.value?.trim()||''})).filter(x=>x.title||x.url||x.doi):[]}function payload(s){return{id:id(),title_ar:v('title'),title_en:v('titleEn'),category:v('category'),author_name:v('author'),author_email:v('email'),excerpt_ar:v('excerpt'),content_ar:$('contentEditor')?.innerHTML?.trim()||'',status:s,references:refs()}}async function save(s){if(!id())throw Error('اختر مقالاً أولاً.');await api('/api/articles',{method:'PUT',body:JSON.stringify(payload(s))})}function addUnpublish(){const d=D(),p=$('publish');if(!d||!p||d.getElementById('unpublish'))return;const b=d.createElement('button');b.id='unpublish';b.className='btn soft';b.textContent='↩️ إلغاء النشر';b.onclick=async()=>{try{b.disabled=true;await save('draft');toastMsg('✅ تم إلغاء نشر المقال وتحويله إلى مسودة.');d.getElementById('refresh')?.click();setTimeout(sync,500)}catch(e){toastMsg('🔴 '+e.message,4000)}finally{b.disabled=false}};p.parentNode.insertBefore(b,p.nextSibling)}function sync(){addUnpublish();const b=$('unpublish'),p=$('publish');if(b)b.style.display=id()&&status()==='published'?'inline-block':'none';if(p&&id())p.textContent=status()==='published'?'✅ تحديث النشر':'✅ نشر'}function ed(){return $('contentEditor')}function setContent(x){const e=ed();if(!e)throw Error('محرر المقال غير موجود.');e.innerHTML=x;e.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:null}));e.focus()}function paras(x){return String(x||'').split(/\n\s*\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}function formatted(a){let h=a.introduction?paras(a.introduction):'';for(const s of a.sections||[]){h+=`<h2>${esc(s.heading||'')}</h2>`;if(s.kind==='faq'){for(const i of s.items||[])h+=`<h3>❓ ${esc(i.question||'')}</h3>${paras(i.answer||'')}`}else if(s.kind==='comparison'&&(s.items||[]).length){h+='<table><thead><tr><th>العنصر</th><th>الإيجابيات</th><th>السلبيات</th></tr></thead><tbody>';(s.items||[]).forEach(i=>h+=`<tr><td>${esc(i.label||'')}</td><td>${esc(i.pros||'')}</td><td>${esc(i.cons||'')}</td></tr>`);h+='</tbody></table>'}else if(s.kind==='warning'||s.kind==='highlight')h+=`<blockquote>⚠️ ${paras(s.content||'').replace(/^<p>|<\/p>$/g,'')}</blockquote>`;else h+=paras(s.content||'')}if(a.conclusion)h+=`<h2>الخلاصة</h2>${paras(a.conclusion)}`;return h}async function lang(mode){if(!id())throw Error('اختر مقالاً أولاً.');const e=ed(),d=await api('/api/article-language',{method:'POST',body:JSON.stringify({mode,content:e.innerText||e.textContent||''})});if(!d.content)throw Error('لم تُرجع الخدمة محتوى.');setContent(paras(d.content));toastMsg(mode==='diacritize'?'🔤 تم التشكيل. راجع النص ثم احفظ.':'✍️ تم التدقيق اللغوي. راجع النص ثم احفظ.',4200)}async function format(){if(!id())throw Error('اختر مقالاً أولاً.');const e=ed(),d=await api('/api/article-format-fast',{method:'POST',body:JSON.stringify({article:{title:v('title'),category:v('category'),excerpt:v('excerpt'),author_name:v('author'),content:e.innerText||e.textContent||''},instruction:'حافظ على المعنى الطبي والمراجع وحسّن البنية والوضوح فقط.'})});if(!d.article)throw Error('لم تُرجع الخدمة مقالاً.');if(d.article.title)$('title').value=d.article.title;if(d.article.excerpt)$('excerpt').value=d.article.excerpt;setContent(formatted(d.article));toastMsg('✨ تم تنسيق المقال. راجعه ثم احفظه.',4200)}function sec(t,a){if(!Array.isArray(a)||!a.length)return '';return `<div class="sec"><h3>${esc(t)}</h3><ul>${a.map(x=>`<li>${esc(typeof x==='string'?x:(x.claim||x.question||x.reason||'ملاحظة'))}${typeof x==='object'&&x.reason?' — '+esc(x.reason):''}</li>`).join('')}</ul></div>`}function show(r){const ready=String(r.readiness||'').toLowerCase()==='ready';body.innerHTML=`<div class="stats"><div class="stat"><b>${esc(r.overall_score||0)}/100</b>التقييم</div><div class="stat"><b>${ready?'جاهز':'يحتاج مراجعة'}</b>الجاهزية</div><div class="stat"><b>${(r.safety_flags||[]).length}</b>تنبيهات السلامة</div></div><div class="${ready?'ready':'needs'}">${ready?'🟢 مناسب للانتقال إلى المراجعة النهائية.':'🟠 عالج الملاحظات قبل النشر.'}</div>${sec('🔴 ادعاءات تحتاج تحققاً',r.unsupported_claims)}${sec('📚 فجوات المراجع',r.reference_gaps)}${sec('⚠️ تنبيهات السلامة',r.safety_flags)}${sec('✍️ ملاحظات اللغة',r.language_issues)}${sec('🧱 ملاحظات البنية',r.structure_issues)}${sec('🔁 تناقضات',r.contradictions)}${sec('✨ اقتراحات',r.style_suggestions)}${sec('✅ الخطوات التالية',r.recommended_actions)}`;modal.classList.add('show')}async function review(){if(!id())throw Error('اختر مقالاً أولاً.');toastMsg('⏳ جارٍ فحص المقال والمراجع...',4000);const d=await api('/api/article-editorial?action=review',{method:'POST',body:JSON.stringify({article_id:id()})});if(!d.review)throw Error('لم تُرجع المراجعة نتيجة.');show(d.review)}function install(){const d=D();if(!d)return;addUnpublish();const r=$('review'),l=$('language'),t=$('tashkeel'),f=$('format');if(r)r.onclick=()=>review().catch(e=>toastMsg('🔴 '+e.message,4000));if(l)l.onclick=()=>lang('proofread').catch(e=>toastMsg('🔴 '+e.message,4000));if(t)t.onclick=()=>lang('diacritize').catch(e=>toastMsg('🔴 '+e.message,4000));if(f)f.onclick=()=>format().catch(e=>toastMsg('🔴 '+e.message,4000));sync()}frame.addEventListener('load',()=>{install();const d=D();if(d?.body)new MutationObserver(install).observe(d.body,{subtree:true,childList:true});setInterval(sync,900)});document.getElementById('closeReview').onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')}})();</script></body></html>
