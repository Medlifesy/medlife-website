<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLife Editorial Studio V13</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f6f8fb;color:#172033;font-family:Cairo,Arial,sans-serif}.bar{height:108px;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 18px;position:relative;z-index:20}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-weight:900;font-size:19px}.sub{font-size:11px;color:#64748b}.stats{display:flex;gap:8px;margin-top:10px;overflow:auto}.stat{min-width:115px;padding:7px 11px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;font-size:11px}.stat b{font-size:17px;margin-left:4px}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:8px 11px;font:800 11px Cairo;cursor:pointer;background:#eef2f7;color:#172033}.btn.primary{background:#ff2a54;color:#fff}.btn.green{background:#059669;color:#fff}.btn.blue{background:#e7f0ff;color:#2753a6}.frame{height:calc(100% - 108px);width:100%;border:0;background:#fff}.toast{position:fixed;left:16px;bottom:16px;background:#151d36;color:#fff;padding:10px 14px;border-radius:12px;font-size:11px;font-weight:800;z-index:100;display:none;box-shadow:0 8px 24px #0002}@media(max-width:700px){.bar{height:128px}.frame{height:calc(100% - 128px)}.title{font-size:15px}.stat{min-width:100px}}
</style>
</head>
<body>
<header class="bar"><div class="top"><div><div class="title">📝 MedLife Editorial Control Center</div><div class="sub">لوحة آمنة فوق الاستوديو الحالي — لا تغيّر قاعدة البيانات أو مسارات الـAPI.</div></div><div class="actions"><button class="btn" id="refresh">🔄 تحديث</button><button class="btn blue" id="drafts">📝 المسودات</button><button class="btn green" id="published">🟢 المنشورة</button><button class="btn" id="all">📚 الكل</button></div></div><div class="stats"><div class="stat">📚 الكل <b id="allCount">—</b></div><div class="stat">🟢 منشور <b id="pubCount">—</b></div><div class="stat">📝 مسودة <b id="draftCount">—</b></div><div class="stat">👤 كتّاب <b id="authorCount">—</b></div><div class="stat">🔎 البحث <b id="filterState">الكل</b></div></div></header>
<iframe id="studio" class="frame" src="/admin/editorial-studio-v12.html" title="MedLife Editorial Studio"></iframe><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';const frame=document.getElementById('studio'),toast=document.getElementById('toast');let timer;const show=x=>{toast.textContent=x;toast.style.display='block';clearTimeout(timer);timer=setTimeout(()=>toast.style.display='none',2200)};const D=()=>frame.contentDocument;const inner=()=>D()?.getElementById('studio')?.contentDocument;const text=(d,id)=>d?.getElementById(id)?.textContent||'';
function articles(){const d=inner();if(!d)return[];return [...d.querySelectorAll('#list .item')].map(x=>({status:(x.querySelector('.badge')?.textContent||'').trim().toLowerCase(),author:(x.querySelector('small')?.textContent||'').replace(/\s+/g,' ').trim()}))}
function sync(){const a=articles();document.getElementById('allCount').textContent=a.length;document.getElementById('pubCount').textContent=a.filter(x=>x.status==='published').length;document.getElementById('draftCount').textContent=a.filter(x=>x.status==='draft').length;document.getElementById('authorCount').textContent=new Set(a.map(x=>x.author).filter(Boolean)).size}
function filter(kind){const d=inner();if(!d)return;const search=d.getElementById('search');if(kind==='all'){search.value='';document.getElementById('filterState').textContent='الكل';search.dispatchEvent(new Event('input',{bubbles:true}));return}const items=[...d.querySelectorAll('#list .item')];items.forEach(x=>{const s=(x.querySelector('.badge')?.textContent||'').trim().toLowerCase();x.style.display=s===kind?'block':'none'});document.getElementById('filterState').textContent=kind==='published'?'المنشور':'المسودات';show(kind==='published'?'🟢 عرض المنشورات':'📝 عرض المسودات')}
frame.addEventListener('load',()=>{sync();setTimeout(sync,900);setTimeout(sync,2200);});document.getElementById('refresh').onclick=()=>{inner()?.getElementById('refresh')?.click();setTimeout(sync,700);show('🔄 تم تحديث المقالات')};document.getElementById('drafts').onclick=()=>filter('draft');document.getElementById('published').onclick=()=>filter('published');document.getElementById('all').onclick=()=>filter('all');setInterval(sync,2500)})();
</script>
</body></html>
