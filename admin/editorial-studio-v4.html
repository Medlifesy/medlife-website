<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife Editorial Studio V4</title><link rel="icon" href="/logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--r:#ff2a54;--n:#151d36;--bg:#f6f8fb;--line:#e2e8f0;--mut:#64748b;--g:#059669;--p:#6d4aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial,sans-serif;color:#1e293b}.top{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line)}.nav,.page{width:min(1400px,calc(100% - 28px));margin:auto}.nav{min-height:70px;display:flex;justify-content:space-between;align-items:center}.logo{height:44px}.btn{border:0;border-radius:11px;padding:9px 12px;font:800 11px Cairo;cursor:pointer}.btn:disabled{opacity:.55}.soft{background:#eef2f7;color:var(--n)}.primary{background:var(--r);color:#fff}.green{background:#e8f8f2;color:var(--g)}.purple{background:#f0ebff;color:#4b2cb6}.orange{background:#fff2e8;color:#b55a00}.danger{background:#ffecef;color:#a51e2d}.page{padding:25px 0 60px}.title{display:flex;justify-content:space-between;gap:10px;align-items:end}.title h1{margin:0;color:var(--n);font-size:31px}.title p{margin:4px 0;color:var(--mut);font-size:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--mut);font-size:9px}.stat b{font-size:23px;color:var(--r)}.sync{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:10px}.grid{display:grid;grid-template-columns:330px 1fr;gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;font-size:14px;color:var(--n)}.list{max-height:calc(100vh - 280px);overflow:auto}.item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.item.active,.item:hover{background:#fff6f8}.item strong{font-size:11px;color:var(--n)}.meta{font-size:9px;color:var(--mut);margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;font-weight:900;margin-right:5px}.pending{background:#fff4e8;color:#b65c00}.published{background:#e8f8f2;color:#08704f}.rejected{background:#ffeded;color:#ad2638}.draft{background:#eef2ff;color:#4655a6}.editor{padding:14px}.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.msg{padding:9px;border-radius:9px;margin:8px 0;font-size:10px}.ok{background:#eaf8f2;color:#08704f}.err{background:#fff0f2;color:#a51e2d}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:900;color:var(--n)}input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fbfcfe;font:inherit}textarea{min-height:150px;resize:vertical}.box{margin-top:12px;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fcfdff}.box h3{margin:0 0 5px;font-size:12px;color:var(--n)}.ref{display:grid;grid-template-columns:1.3fr .5fr 1fr auto;gap:6px;margin-top:6px}.analysis{margin-top:7px;padding:10px;background:#fbfaff;border:1px dashed #d7cbff;border-radius:11px;font-size:10px}.versions{display:grid;gap:6px}.version{padding:8px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:9px}.preview{display:none;margin-top:14px}.article{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.hero{padding:42px 18px;text-align:center;background:linear-gradient(135deg,#fff,#f7f9fc)}.hero h1{color:var(--n);font-size:clamp(28px,4vw,46px);margin:7px 0}.hero p{max-width:780px;margin:auto;color:var(--mut);line-height:2}.body{padding:22px}.toc{background:#fbfcff;border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:15px}.toc a{display:block;padding:5px;color:var(--mut);font-size:10px}.sec{scroll-margin-top:90px}.sec h2{border-right:4px solid var(--r);padding-right:10px;color:var(--n);margin-top:28px}.sec p{line-height:2;font-size:12px}.call{padding:12px;border-radius:12px;margin:12px 0}.warn{background:#fff7ed}.good{background:#ecfdf5}.compare{width:100%;border-collapse:collapse;font-size:10px}.compare th{background:var(--n);color:#fff;padding:8px;text-align:right}.compare td{padding:8px;border-bottom:1px solid var(--line)}@media(max-width:950px){.grid{grid-template-columns:1fr}.list{max-height:300px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.ref{grid-template-columns:1fr}}
</style></head><body><header class="top"><div class="nav"><a href="/admin/"><img class="logo" src="/logo.PNG" alt="MedLife"></a><div style="display:flex;gap:6px"><a class="btn soft" href="/admin/">لوحة الإدارة</a><a class="btn soft" href="/articles.html">المقالات</a><button id="logout" class="btn danger">خروج</button></div></div></header><main class="page"><div class="title"><div><h1>MedLife Editorial Studio V4</h1><p>إدارة حية للمقالات مع تحديث فوري وتحرير ومراجعة ونشر من مكان واحد.</p></div><button id="refresh" class="btn primary">🔄 تحديث المقالات</button></div><div class="stats"><div class="stat"><small>الإجمالي</small><b id="total">0</b></div><div class="stat"><small>قيد المراجعة</small><b id="pending">0</b></div><div class="stat"><small>مسودات</small><b id="draft">0</b></div><div class="stat"><small>منشور</small><b id="published">0</b></div><div class="stat"><small>مرفوض</small><b id="rejected">0</b></div></div><div class="sync"><span id="syncState">🔄 جارٍ الاتصال…</span><button id="new" class="btn green">➕ إضافة مقال</button></div><div class="grid"><section class="card"><div class="head"><h2>📚 المقالات</h2><input id="search" placeholder="بحث" style="width:130px"></div><div id="list" class="list"></div></section><section class="card"><div class="editor"><div class="tools"><button id="save" class="btn primary">💾 حفظ</button><button id="publishBtn" class="btn green">✅ نشر</button><button id="review" class="btn purple">🧠 تدقيق طبي</button><button id="language" class="btn purple">✍️ تدقيق لغوي</button><button id="diacritics" class="btn orange">🔤 تشكيل</button><button id="format" class="btn purple">✨ تنسيق</button><button id="previewBtn" class="btn soft">👁️ معاينة</button></div><div id="msg"></div><div id="empty" style="padding:25px;text-align:center;color:var(--mut);font-size:10px">اختر مقالًا أو اضغط إضافة مقال.</div><div id="editorArea" style="display:none"><div class="form"><div class="field"><label>العنوان العربي *</label><input id="title"></div><div class="field"><label>العنوان الإنكليزي</label><input id="titleEn"></div><div class="field"><label>التصنيف</label><select id="category"><option>General Medicine</option><option>Obstetrics & Gynecology</option><option>Pediatrics</option><option>Public Health</option><option>Medical Education</option><option>Health Awareness</option></select></div><div class="field"><label>الكاتب *</label><input id="author"></div><div class="field"><label>بريد الكاتب</label><input id="email"></div><div class="field"><label>صورة الغلاف</label><input id="image"></div><div class="field full"><label>الملخص</label><textarea id="excerpt"></textarea></div><div class="field full"><label>المحتوى العربي *</label><textarea id="content" style="min-height:320px"></textarea></div></div><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><h3>📚 المراجع المعتمدة</h3><button id="addRef" class="btn soft">+ مرجع</button></div><div id="refs"></div></div><div class="box"><h3>🧠 تقرير التدقيق الطبي</h3><div id="analysis" class="analysis" style="display:none"></div></div><div class="box"><h3>🕘 سجل النسخ</h3><div id="versions" class="versions">لا توجد نسخ.</div></div><div class="box"><div class="tools"><select id="status" class="btn soft"><option value="draft">مسودة</option><option value="pending">قيد المراجعة</option><option value="published">منشور</option><option value="rejected">مرفوض</option></select><input id="rejectReason" placeholder="سبب الرفض" style="flex:1"></div></div></div></div></section></div><div id="preview" class="preview"></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),labels={pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'};let articles=[],selected=null,isNew=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const val=id=>($(id)?.value||'').trim();async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:'include',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||('HTTP '+r.status));return d}function message(t,good=true){$('msg').className='msg '+(good?'ok':'err');$('msg').textContent=t}function refs(){return [...document.querySelectorAll('.ref')].map(x=>({title:x.querySelector('.rt').value.trim(),year:x.querySelector('.ry').value,organization:x.querySelector('.ro').value.trim(),url:x.querySelector('.ru').value.trim()})).filter(x=>x.title)}function addRef(r={}){const n=document.createElement('div');n.className='ref';n.innerHTML='<input class="rt" placeholder="عنوان المرجع" value="'+esc(r.title||'')+'"><input class="ry" placeholder="السنة" value="'+esc(r.year||'')+'"><input class="ro" placeholder="الجهة" value="'+esc(r.organization||'')+'"><input class="ru" placeholder="الرابط" value="'+esc(r.url||'')+'"><button class="btn danger" type="button">حذف</button>';n.querySelector('button').onclick=()=>n.remove();$('refs').appendChild(n)}async function load(){try{$('syncState').textContent='⏳ جارٍ التحديث…';const d=await api('/api/articles?admin=1');articles=d.articles||[];const s=d.summary||{};$('total').textContent=s.total??articles.length;$('pending').textContent=s.pending??0;$('draft').textContent=s.draft??0;$('published').textContent=s.published??0;$('rejected').textContent=s.rejected??0;render();$('syncState').textContent='🟢 آخر تحديث: '+new Date().toLocaleTimeString('ar-SY')}catch(e){$('syncState').textContent='🔴 فشل التحديث: '+e.message;message('تعذر تحميل المقالات: '+e.message,false)}}function render(){const q=val('search').toLowerCase();const list=articles.filter(a=>!q||String(a.title_ar||'').toLowerCase().includes(q)||String(a.author_name||'').toLowerCase().includes(q));$('list').innerHTML=list.length?list.map(a=>'<div class="item '+(selected&&selected.id===a.id?'active':'')+'" data-id="'+a.id+'"><strong>'+esc(a.title_ar||'بدون عنوان')+'</strong><div class="meta">'+esc(a.author_name||'')+' <span class="badge '+esc(a.status)+'">'+esc(labels[a.status]||a.status)+'</span></div></div>').join(''):'<div style="padding:25px;text-align:center;color:var(--mut);font-size:10px">لا توجد مقالات.</div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>open(Number(x.dataset.id)))}function fill(a){$('empty').style.display='none';$('editorArea').style.display='block';$('title').value=a.title_ar||'';$('titleEn').value=a.title_en||'';$('category').value=a.category||'General Medicine';$('author').value=a.author_name||'';$('email').value=a.author_email||'';$('image').value=a.image_url||'';$('excerpt').value=a.excerpt_ar||'';$('content').value=a.content_ar||'';$('status').value=a.status||'draft';$('rejectReason').value=a.rejection_reason||'';$('refs').innerHTML='';$('analysis').style.display='none';$('versions').textContent='لا توجد نسخ.';$('preview').style.display='none'}async function open(id){selected=articles.find(a=>Number(a.id)===id);isNew=false;if(!selected)return;fill(selected);render();try{const [r,v]=await Promise.all([api('/api/article-editorial?action=references&article_id='+id),api('/api/article-editorial?action=revisions&article_id='+id)]);(r.references||[]).forEach(addRef);$('versions').innerHTML=(v.revisions||[]).map(x=>'<div class="version"><b>'+esc(x.revision_type||'manual')+'</b><br>'+esc(x.change_summary||'نسخة')+'</div>').join('')||'لا توجد نسخ.'}catch(e){message('تم فتح المقال، لكن تعذر تحميل المراجع/النسخ: '+e.message,false)}}function clearNew(){selected=null;isNew=true;fill({});$('status').value='pending';message('📝 أضف المقال ثم اضغط حفظ.')}async function revision(type,summary){if(!selected)return;await api('/api/article-editorial?action=revision',{method:'POST',body:JSON.stringify({article_id:selected.id,revision_type:type,title_ar:val('title'),excerpt_ar:val('excerpt'),content_ar:val('content'),change_summary:summary})})}async function save(publish=false){const body={title_ar:val('title'),title_en:val('titleEn'),excerpt_ar:val('excerpt'),content_ar:val('content'),author_name:val('author'),author_email:val('email'),category:val('category'),image_url:val('image'),status:publish?'published':val('status'),rejection_reason:val('rejectReason'),references:refs()};if(!body.title_ar||!body.content_ar||!body.author_name)throw Error('العنوان والمحتوى والكاتب حقول مطلوبة.');if(isNew){const d=await api('/api/articles',{method:'POST',body:JSON.stringify({...body,status:publish?'published':'pending'})});await load();selected=articles.find(a=>Number(a.id)===Number(d.id));isNew=false;if(selected)await open(selected.id);message('✅ تم إنشاء المقال وربطه باللوحة.');return}await revision(publish?'pre_publish':'manual',publish?'نسخة قبل النشر':'حفظ التعديلات');await api('/api/articles',{method:'PUT',body:JSON.stringify({...body,id:selected.id})});await load();await open(selected.id);message(publish?'✅ تم النشر وتحديث القائمة.':'✅ تم الحفظ وتحديث القائمة.')}async function busy(btn,fn){btn.disabled=true;const t=btn.textContent;btn.textContent='⏳ جاري…';try{await fn()}catch(e){message(e.message,false)}finally{btn.disabled=false;btn.textContent=t}}function renderPreview(){const c=val('content');const blocks=c.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);const sec=[];let intro=[];let cur=null;blocks.forEach(b=>{const m=b.match(/^(?:#{1,4}\s*|(?:\d{1,2}|[٠-٩]{1,2})\s*[.)ـ:-]\s*)(.+)$/);if(m){cur={h:m[1].trim(),b:[]};sec.push(cur)}else if(cur)cur.b.push(b);else intro.push(b)});const toc=sec.map((s,i)=>'<a href="#vsec'+i+'">'+String(i+1).padStart(2,'0')+' · '+esc(s.h)+'</a>').join('');const html=sec.map((s,i)=>'<section class="sec" id="vsec'+i+'"><h2>'+String(i+1)+'. '+esc(s.h)+'</h2>'+s.b.map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')+'</section>').join('');$('preview').innerHTML='<article class="article"><div class="hero"><small style="color:var(--r);font-weight:900">♥ MedLife Knowledge · توعية صحية</small><h1>'+esc(val('title')||'عنوان المقال')+'</h1><p>'+esc(val('excerpt'))+'</p><div style="margin-top:10px;font-size:9px;color:var(--mut)">✍ '+esc(val('author'))+' · ⚕️ '+esc(val('category'))+'</div></div><div class="body"><div class="toc"><b style="color:var(--r)">فهرس المقال</b>'+toc+'</div>'+ (intro.length?'<div class="call" style="background:#eef4ff"><b>مقدمة</b><p>'+esc(intro.join('\n\n')).replace(/\n/g,'<br>')+'</p></div>':'')+html+'<div class="call" style="background:#f8fafc">هذا المحتوى تثقيفي ولا يغني عن التقييم الطبي المباشر.</div></div></article>';$('preview').style.display='block';$('preview').scrollIntoView({behavior:'smooth'})}async function review(){if(!selected)throw Error('اختر مقالًا أولًا.');const d=await api('/api/article-editorial?action=review',{method:'POST',body:JSON.stringify({article_id:selected.id,references:refs()})});const r=d.review||{};$('analysis').style.display='block';$('analysis').innerHTML='<b>النتيجة: '+esc(r.overall_score??0)+'/100</b><br><br>'+['unsupported_claims','reference_gaps','safety_flags','contradictions','language_issues','recommended_actions'].map(k=>'<div><b>'+esc(k)+'</b>: '+esc((r[k]||[]).map(x=>typeof x==='string'?x:x.reason||x.claim||JSON.stringify(x)).join(' · ')||'لا توجد ملاحظات')+'</div>').join('');message('✅ اكتملت المراجعة. الاعتماد النهائي بشري.')}async function aiText(mode){if(!selected)throw Error('اختر مقالًا أولًا.');await revision('before_'+mode,'نسخة قبل '+mode);const d=await api('/api/article-language',{method:'POST',body:JSON.stringify({mode,content:val('content')})});if(d.content)$('content').value=d.content;await revision(mode,'تطبيق '+mode);renderPreview();message('✅ تم التنفيذ مع حفظ نسخة سابقة.')}async function format(){if(!selected)throw Error('اختر مقالًا أولًا.');await revision('before_format','نسخة قبل التنسيق');const d=await api('/api/article-format-fast',{method:'POST',body:JSON.stringify({article:{title:val('title'),category:val('category'),excerpt:val('excerpt'),author_name:val('author'),content:val('content')},instruction:'رتب المقال بأسلوب MedLife. حافظ على العنوان والقيمة العلمية والمعنى. استخدم العناوين الحقيقية الموجودة، ولا تنشئ عناوين عامة مثل القسم 1، ولا تضف مراجع أو معلومات.'})});const a=d.article||{};if(a.title)$('title').value=a.title;if(a.excerpt)$('excerpt').value=a.excerpt;if(a.introduction||a.sections){const p=[];if(a.introduction)p.push(a.introduction);(a.sections||[]).forEach((s,i)=>{if(s.heading)p.push((i+1)+'. '+s.heading+'\n\n'+(s.content||''))});if(a.conclusion)p.push('الخلاصة\n\n'+a.conclusion);$('content').value=p.join('\n\n')}renderPreview();message('✅ تم تطبيق تنسيق MedLife.')}$('refresh').onclick=()=>busy($('refresh'),load);$('new').onclick=clearNew;$('save').onclick=()=>busy($('save'),()=>save(false));$('publishBtn').onclick=()=>busy($('publishBtn'),()=>save(true));$('review').onclick=()=>busy($('review'),review);$('language').onclick=()=>busy($('language'),()=>aiText('proofread'));$('diacritics').onclick=()=>busy($('diacritics'),()=>aiText('diacritize'));$('format').onclick=()=>busy($('format'),format);$('previewBtn').onclick=renderPreview;$('addRef').onclick=()=>addRef();$('search').oninput=render;$('logout').onclick=async()=>{try{await api('/api/article-admin-session?action=logout',{method:'POST'})}finally{location.href='/admin-login.html'}};setInterval(()=>{if(!document.hidden&&!isNew)load()},45000);load()})()</script></body></html>
