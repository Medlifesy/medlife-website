<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MedLife Editorial Studio V5</title>
<link rel="icon" href="/logo.PNG">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--red:#ff2a54;--navy:#151d36;--muted:#64748b;--bg:#f6f8fb;--line:#e2e8f0;--green:#059669;--purple:#6d4aff;--orange:#ea580c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial,sans-serif;color:#1e293b}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}.nav,.page{width:min(1400px,calc(100% - 28px));margin:auto}.nav{min-height:70px;display:flex;justify-content:space-between;align-items:center}.logo{height:44px}.actions,.toolbar{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 12px;font:800 11px Cairo;cursor:pointer}.btn:disabled{opacity:.55}.soft{background:#eef2f7;color:var(--navy)}.primary{background:var(--red);color:#fff}.green{background:#e8f8f2;color:var(--green)}.purple{background:#f0ebff;color:#4b2cb6}.orange{background:#fff2e8;color:#b55a00}.danger{background:#ffecef;color:#a51e2d}.page{padding:25px 0 60px}.title{display:flex;justify-content:space-between;align-items:end;gap:12px}.title h1{margin:0;color:var(--navy);font-size:31px}.title p{margin:4px 0;color:var(--muted);font-size:10px}.sync{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:14px 0;font-size:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{font-size:23px;color:var(--red)}.layout{display:grid;grid-template-columns:340px 1fr;gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}.head h2{margin:0;font-size:14px;color:var(--navy)}.list{max-height:calc(100vh - 280px);overflow:auto}.item{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.active{background:#fff6f8}.item strong{font-size:11px;color:var(--navy)}.meta{font-size:9px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;font-weight:900;margin-right:5px}.pending{background:#fff4e8;color:#b65c00}.published{background:#e8f8f2;color:#08704f}.rejected{background:#ffeded;color:#ad2638}.draft{background:#eef2ff;color:#4655a6}.editor{padding:14px}.msg{padding:9px;border-radius:9px;margin:8px 0;font-size:10px}.ok{background:#eaf8f2;color:#08704f}.err{background:#fff0f2;color:#a51e2d}.empty{padding:30px;text-align:center;color:var(--muted);font-size:10px}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.full{grid-column:1/-1}.field label{font-size:10px;font-weight:900;color:var(--navy)}input,textarea,select{border:1px solid var(--line);border-radius:9px;padding:9px;background:#fbfcfe;font:inherit}textarea{min-height:150px;resize:vertical}.box{margin-top:12px;border:1px solid var(--line);border-radius:13px;padding:11px;background:#fcfdff}.box h3{margin:0 0 6px;font-size:12px;color:var(--navy)}.ref{display:grid;grid-template-columns:1.3fr .5fr 1fr 1.3fr auto;gap:6px;margin-top:7px}.analysis{padding:10px;background:#fbfaff;border:1px dashed #d7cbff;border-radius:11px;font-size:10px}.preview{display:none;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.hero{padding:42px 18px;text-align:center;background:linear-gradient(135deg,#fff,#f7f9fc)}.hero h1{color:var(--navy);font-size:clamp(28px,4vw,46px);margin:7px 0}.hero p{max-width:800px;margin:auto;color:var(--muted);line-height:2}.body{padding:22px}.toc{background:#fbfcff;border:1px solid var(--line);padding:12px;border-radius:14px;margin-bottom:15px}.toc a{display:block;padding:5px;color:var(--muted);font-size:10px}.sec h2{border-right:4px solid var(--red);padding-right:10px;color:var(--navy);margin-top:28px}.sec p{line-height:2;font-size:12px}.call{padding:12px;border-radius:12px;margin:12px 0}.warn{background:#fff7ed}.good{background:#ecfdf5}.compare{width:100%;border-collapse:collapse;font-size:10px}.compare th{background:var(--navy);color:#fff;padding:8px;text-align:right}.compare td{padding:8px;border-bottom:1px solid var(--line)}@media(max-width:950px){.layout{grid-template-columns:1fr}.list{max-height:300px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.form{grid-template-columns:1fr}.field.full{grid-column:auto}.ref{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="nav"><a href="/admin/"><img class="logo" src="/logo.PNG" alt="MedLife"></a><div class="actions"><a class="btn soft" href="/admin/">لوحة الإدارة</a><a class="btn soft" href="/articles.html">المقالات</a><button id="logout" class="btn danger">خروج</button></div></div></header>
<main class="page">
  <div class="title"><div><h1>MedLife Editorial Studio V5</h1><p>إدارة حية للمقالات مع مزامنة مباشرة وتحرير ومراجعة ونشر.</p></div><button id="refreshBtn" class="btn primary">🔄 تحديث المقالات</button></div>
  <div class="sync"><span id="syncState">🔄 جارٍ الاتصال...</span><button id="newBtn" class="btn green">➕ إضافة مقال</button></div>
  <section class="stats">
    <div class="stat"><small>الإجمالي</small><b id="sTotal">0</b></div><div class="stat"><small>قيد المراجعة</small><b id="sPending">0</b></div><div class="stat"><small>مسودات</small><b id="sDraft">0</b></div><div class="stat"><small>منشور</small><b id="sPublished">0</b></div><div class="stat"><small>مرفوض</small><b id="sRejected">0</b></div>
  </section>
  <div class="layout">
    <section class="card"><div class="head"><h2>📚 المقالات</h2><input id="search" placeholder="بحث" style="width:130px"></div><div id="list" class="list"></div></section>
    <section class="card"><div class="editor">
      <div class="toolbar"><button id="saveBtn" class="btn primary">💾 حفظ</button><button id="publishBtn" class="btn green">✅ نشر</button><button id="reviewBtn" class="btn purple">🧠 تدقيق طبي</button><button id="languageBtn" class="btn purple">✍️ تدقيق لغوي</button><button id="diacriticsBtn" class="btn orange">🔤 تشكيل</button><button id="formatBtn" class="btn purple">✨ تنسيق</button><button id="previewBtn" class="btn soft">👁️ معاينة</button></div>
      <div id="msg"></div><div id="empty" class="empty">اختر مقالًا أو اضغط إضافة مقال.</div>
      <div id="editorArea" style="display:none">
        <div class="form">
          <div class="field"><label>العنوان العربي *</label><input id="titleAr"></div><div class="field"><label>العنوان الإنكليزي</label><input id="titleEn"></div>
          <div class="field"><label>التصنيف</label><select id="category"><option>General Medicine</option><option>Obstetrics & Gynecology</option><option>Pediatrics</option><option>Public Health</option><option>Medical Education</option><option>Health Awareness</option></select></div><div class="field"><label>الكاتب *</label><input id="author"></div>
          <div class="field"><label>بريد الكاتب</label><input id="email"></div><div class="field"><label>صورة الغلاف</label><input id="image"></div>
          <div class="field full"><label>الملخص</label><textarea id="excerpt"></textarea></div><div class="field full"><label>المحتوى العربي *</label><textarea id="content" style="min-height:320px"></textarea></div>
        </div>
        <div class="box"><div class="toolbar"><h3 style="margin:0">📚 المراجع المعتمدة</h3><button id="addRefBtn" class="btn soft">+ مرجع</button></div><div id="refs"></div></div>
        <div class="box"><h3>🧠 تقرير التدقيق الطبي</h3><div id="analysis" class="analysis" style="display:none"></div></div>
        <div class="box"><h3>🕘 سجل النسخ</h3><div id="versions">لا توجد نسخ.</div></div>
        <div class="box"><div class="toolbar"><select id="status"><option value="draft">مسودة</option><option value="pending">قيد المراجعة</option><option value="published">منشور</option><option value="rejected">مرفوض</option></select><input id="rejectReason" placeholder="سبب الرفض" style="flex:1"></div></div>
      </div>
    </div></section>
  </div>
  <div id="preview" class="preview"></div>
</main>
<script>
(function(){
  'use strict';
  var state={articles:[],selected:null,isNew:false,loading:false};
  var $=function(id){return document.getElementById(id);};
  var value=function(id){var e=$(id);return e?String(e.value||'').trim():'';};
  var esc=function(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c];});};
  var labels={pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'};
  function msg(text,ok){$('msg').className='msg '+(ok===false?'err':'ok');$('msg').textContent=text;}
  async function api(url,opt){opt=opt||{};var headers={'Accept':'application/json'};if(opt.body)headers['Content-Type']='application/json';var res=await fetch(url,{method:opt.method||'GET',body:opt.body,credentials:'include',headers:headers,cache:'no-store'});var data=await res.json().catch(function(){return {};});if(!res.ok||!data.success)throw new Error(data.error||('HTTP '+res.status));return data;}
  async function verifySession(){return api('/api/article-admin-session?action=me');}
  async function loadArticles(){
    if(state.loading)return;
    state.loading=true;$('refreshBtn').disabled=true;$('syncState').textContent='⏳ جارٍ تحديث المقالات...';
    try{
      var data=await api('/api/articles?admin=1');
      state.articles=Array.isArray(data.articles)?data.articles:[];
      var s=data.summary||{};
      $('sTotal').textContent=s.total!=null?s.total:state.articles.length;$('sPending').textContent=s.pending||0;$('sDraft').textContent=s.draft||0;$('sPublished').textContent=s.published||0;$('sRejected').textContent=s.rejected||0;
      renderList();
      $('syncState').textContent='🟢 آخر تحديث: '+new Date().toLocaleTimeString('ar-SY');
      return true;
    }catch(e){$('syncState').textContent='🔴 فشل التحديث';msg('تعذر تحميل المقالات: '+e.message,false);return false;}
    finally{state.loading=false;$('refreshBtn').disabled=false;}
  }
  function renderList(){var q=value('search').toLowerCase();var arr=state.articles.filter(function(a){return !q||String(a.title_ar||'').toLowerCase().includes(q)||String(a.author_name||'').toLowerCase().includes(q);});$('list').innerHTML=arr.length?arr.map(function(a){return '<div class="item '+(state.selected&&Number(state.selected.id)===Number(a.id)?'active':'')+'" data-id="'+a.id+'"><strong>'+esc(a.title_ar||'بدون عنوان')+'</strong><div class="meta">'+esc(a.author_name||'')+' <span class="badge '+esc(a.status)+'">'+esc(labels[a.status]||a.status)+'</span></div></div>';}).join(''):'<div class="empty">لا توجد مقالات.</div>';Array.prototype.forEach.call(document.querySelectorAll('.item'),function(el){el.onclick=function(){openArticle(Number(el.getAttribute('data-id')));};});}
  function fill(a){$('empty').style.display='none';$('editorArea').style.display='block';$('titleAr').value=a.title_ar||'';$('titleEn').value=a.title_en||'';$('category').value=a.category||'General Medicine';$('author').value=a.author_name||'';$('email').value=a.author_email||'';$('image').value=a.image_url||'';$('excerpt').value=a.excerpt_ar||'';$('content').value=a.content_ar||'';$('status').value=a.status||'draft';$('rejectReason').value=a.rejection_reason||'';$('refs').innerHTML='';$('analysis').style.display='none';$('versions').innerHTML='لا توجد نسخ.';$('preview').style.display='none';}
  function clearForm(){state.selected=null;state.isNew=true;$('empty').style.display='none';$('editorArea').style.display='block';['titleAr','titleEn','author','email','image','excerpt','content','rejectReason'].forEach(function(id){$(id).value='';});$('category').value='General Medicine';$('status').value='draft';$('refs').innerHTML='';$('analysis').style.display='none';$('versions').innerHTML='لا توجد نسخ.';$('preview').style.display='none';renderList();}
  async function openArticle(id){state.selected=state.articles.find(function(a){return Number(a.id)===Number(id);})||null;state.isNew=false;if(!state.selected)return;fill(state.selected);renderList();try{var results=await Promise.all([api('/api/article-editorial?action=references&article_id='+id),api('/api/article-editorial?action=revisions&article_id='+id)]);(results[0].references||[]).forEach(addRef);$('versions').innerHTML=(results[1].revisions||[]).map(function(v){return '<div class="version"><b>'+esc(v.revision_type||'manual')+'</b><br>'+esc(v.change_summary||'نسخة')+'</div>';}).join('')||'لا توجد نسخ.';}catch(e){msg('تعذر تحميل بيانات التحرير: '+e.message,false);}}
  function addRef(r){r=r||{};var row=document.createElement('div');row.className='ref';row.innerHTML='<input class="rt" placeholder="عنوان المرجع" value="'+esc(r.title||'')+'"><input class="ry" placeholder="السنة" value="'+esc(r.year||'')+'"><input class="ro" placeholder="الجهة" value="'+esc(r.organization||'')+'"><input class="ru" placeholder="الرابط" value="'+esc(r.url||'')+'"><button class="btn danger" type="button">حذف</button>';row.querySelector('button').onclick=function(){row.remove();};$('refs').appendChild(row);}
  function collectRefs(){return Array.prototype.map.call(document.querySelectorAll('.ref'),function(row){return {title:row.querySelector('.rt').value.trim(),year:row.querySelector('.ry').value,organization:row.querySelector('.ro').value.trim(),url:row.querySelector('.ru').value.trim()};}).filter(function(r){return r.title;});}
  async function saveRevision(type,summary){if(!state.selected)return;await api('/api/article-editorial?action=revision',{method:'POST',body:JSON.stringify({article_id:state.selected.id,revision_type:type,title_ar:value('titleAr'),title_en:value('titleEn'),excerpt_ar:value('excerpt'),content_ar:value('content'),content_en:'',change_summary:summary})});}
  async function saveRefs(){if(!state.selected)return;await api('/api/article-editorial?action=references',{method:'POST',body:JSON.stringify({article_id:state.selected.id,references:collectRefs()})});}
  async function saveArticle(status){
    var body={title_ar:value('titleAr'),title_en:value('titleEn'),excerpt_ar:value('excerpt'),content_ar:value('content'),author_name:value('author'),author_email:value('email'),category:value('category'),image_url:value('image'),status:status||value('status'),rejection_reason:value('rejectReason')};
    if(!body.title_ar||!body.content_ar||!body.author_name)throw new Error('العنوان والمحتوى والكاتب حقول مطلوبة.');
    if(state.isNew){var created=await api('/api/articles',{method:'POST',body:JSON.stringify(Object.assign({},body,{status:'pending',author_member_id:null,references:collectRefs()}))});state.isNew=false;await loadArticles();state.selected=state.articles.find(function(a){return Number(a.id)===Number(created.id);})||null;if(state.selected){await saveRefs();fill(state.selected);renderList();}msg('✅ تم إنشاء المقال وإرساله للمراجعة.');return;}
    if(!state.selected)throw new Error('اختر مقالًا أولًا.');
    await saveRevision(status==='published'?'pre_publish':'manual',status==='published'?'نسخة قبل النشر':'حفظ التعديلات');await saveRefs();await api('/api/articles',{method:'PUT',body:JSON.stringify(Object.assign({},body,{id:state.selected.id}))});await loadArticles();state.selected=state.articles.find(function(a){return Number(a.id)===Number(state.selected.id);})||null;if(state.selected){fill(state.selected);await Promise.all([openArticle(state.selected.id),loadArticles()]);}msg(status==='published'?'✅ تم نشر المقال.':'✅ تم حفظ المقال.');
  }
  function sections(content){var blocks=String(content||'').replace(/\r/g,'').split(/\n\s*\n+/).map(function(x){return x.trim();}).filter(Boolean);var out=[];var intro=[];var cur=null;blocks.forEach(function(b){var m=b.match(/^(?:#{1,4}\s*|(?:\d{1,2}|[٠-٩]{1,2})\s*[.)ـ:-]\s*)(.+)$/);if(m){cur={h:m[1].trim(),b:[]};out.push(cur);}else if(cur)cur.b.push(b);else intro.push(b);});return {intro:intro.join('\n\n'),sections:out};}
  function preview(){var p=sections(value('content'));var toc=p.sections.map(function(s,i){return '<a href="#s'+i+'">'+String(i+1).padStart(2,'0')+' · '+esc(s.h)+'</a>';}).join('');var body=p.sections.map(function(s,i){var text=s.b.join('\n\n');var klass=/خطر|حالات|موانع|إسعاف|طوارئ/.test(s.h)?'call warn':/كلمة ميدلايف|الخلاصة/.test(s.h)?'call good':'';var html=text.split(/\n\s*\n+/).map(function(x){return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>';}).join('');return '<section id="s'+i+'" class="sec"><h2>'+String(i+1)+'. '+esc(s.h)+'</h2>'+(klass?'<div class="'+klass+'">'+html+'</div>':html)+'</section>';}).join('');$('preview').innerHTML='<div class="hero"><div style="color:var(--red);font-weight:900">♥ MedLife Knowledge</div><h1>'+esc(value('titleAr'))+'</h1><p>'+esc(value('excerpt'))+'</p></div><div class="body"><div class="toc"><b>📚 فهرس المقال</b>'+toc+'</div>'+(p.intro?'<div class="call" style="background:#eef4ff"><b>مقدمة</b><br>'+esc(p.intro).replace(/\n/g,'<br>')+'</div>':'')+body+'</div>';$('preview').style.display='block';$('preview').scrollIntoView({behavior:'smooth'});}
  async function run(btn,work){btn.disabled=true;var old=btn.textContent;btn.textContent='⏳ جاري التنفيذ...';try{await work();}catch(e){msg(e.message,false);}finally{btn.disabled=false;btn.textContent=old;}}
  $('refreshBtn').onclick=function(){run($('refreshBtn'),loadArticles);};$('newBtn').onclick=function(){clearForm();};$('search').oninput=renderList;$('addRefBtn').onclick=function(){addRef({});};$('previewBtn').onclick=preview;
  $('saveBtn').onclick=function(){run($('saveBtn'),function(){return saveArticle(value('status'));});};$('publishBtn').onclick=function(){run($('publishBtn'),function(){return saveArticle('published');});};
  $('reviewBtn').onclick=function(){run($('reviewBtn'),async function(){if(!state.selected)throw new Error('اختر مقالًا أولًا.');var d=await api('/api/article-editorial?action=review',{method:'POST',body:JSON.stringify({article_id:state.selected.id,references:collectRefs()})});var r=d.review||{};$('analysis').style.display='block';$('analysis').innerHTML='<strong>النتيجة: '+esc(r.overall_score||0)+'/100</strong><br><b>'+esc(r.readiness||'needs_revision')+'</b><hr>'+['language_issues','structure_issues','unsupported_claims','reference_gaps','safety_flags','contradictions','recommended_actions'].map(function(k){var a=Array.isArray(r[k])?r[k]:[];return '<div><b>'+esc(k)+'</b><ul>'+a.map(function(x){return '<li>'+esc(typeof x==='string'?x:(x.reason||x.claim||JSON.stringify(x)))+'</li>';}).join('')+'</ul></div>';}).join('');msg('✅ اكتملت المراجعة الطبية.');});};
  $('languageBtn').onclick=function(){run($('languageBtn'),async function(){if(!state.selected)throw new Error('اختر مقالًا أولًا.');await saveRevision('before_language','نسخة قبل التدقيق اللغوي');var d=await api('/api/article-language',{method:'POST',body:JSON.stringify({mode:'proofread',content:value('content')})});$('content').value=d.content||value('content');await saveRevision('language','تطبيق التدقيق اللغوي');preview();msg('✅ تم التدقيق اللغوي.');});};
  $('diacriticsBtn').onclick=function(){run($('diacriticsBtn'),async function(){if(!state.selected)throw new Error('اختر مقالًا أولًا.');await saveRevision('before_diacritics','نسخة قبل التشكيل');var d=await api('/api/article-language',{method:'POST',body:JSON.stringify({mode:'diacritize',content:value('content')})});$('content').value=d.content||value('content');await saveRevision('diacritize','تطبيق التشكيل العربي');preview();msg('✅ تم التشكيل العربي.');});};
  $('formatBtn').onclick=function(){run($('formatBtn'),async function(){if(!state.selected)throw new Error('اختر مقالًا أولًا.');await saveRevision('before_format','نسخة قبل التنسيق');var d=await api('/api/article-format-fast',{method:'POST',body:JSON.stringify({article:{title:value('titleAr'),category:value('category'),excerpt:value('excerpt'),author_name:value('author'),content:value('content')},instruction:'نسّق المقال بأسلوب MedLife. استخدم العناوين الحقيقية من النص، وحافظ على المعنى، ولا تخترع معلومات أو مراجع.'})});var a=d.article||{};if(a.title)$('titleAr').value=a.title;if(a.excerpt)$('excerpt').value=a.excerpt;if(Array.isArray(a.sections)){var parts=[];if(a.introduction)parts.push(a.introduction);a.sections.forEach(function(s,i){if(s.heading)parts.push((i+1)+'. '+s.heading+'\n\n'+(s.content||''));});if(a.conclusion)parts.push('الخلاصة\n\n'+a.conclusion);if(parts.length)$('content').value=parts.join('\n\n');}preview();msg('✅ تم تنسيق المقال.');});};
  $('logout').onclick=async function(){try{await api('/api/article-admin-session?action=logout',{method:'POST'});}finally{location.href='/admin-login.html';}};
  (async function init(){try{await verifySession();await loadArticles();}catch(e){msg('🔐 جلسة الإدارة غير صالحة: '+e.message,false);$('syncState').textContent='🔴 غير متصل';}})();
  setInterval(function(){if(document.visibilityState==='visible')loadArticles();},45000);
})();
</script>
</body>
</html>
