<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife Editorial Studio V6</title><link rel="icon" href="/logo.PNG"><style>body{margin:0;background:#f6f8fb;color:#1e293b;font-family:Cairo,Arial,sans-serif}.page{max-width:1400px;margin:auto;padding:24px}.top{background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 24px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:44px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.primary{background:#ff2a54;color:#fff}.green{background:#059669;color:#fff}.soft{background:#eef2f7;color:#151d36}.danger{background:#ffecef;color:#a51e2d}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:350px 1fr;gap:14px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;overflow:hidden}.head{padding:12px 14px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.list{max-height:70vh;overflow:auto}.item{padding:13px;border-bottom:1px solid #e2e8f0;cursor:pointer}.item.active{background:#fff4f6}.badge{float:left;padding:3px 7px;border-radius:999px;font-size:11px;background:#fff4e8}.editor{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;margin-bottom:4px}input,textarea,select{width:100%;box-sizing:border-box;border:1px solid #e2e8f0;border-radius:9px;padding:9px;font:inherit}textarea{min-height:220px}.state{padding:9px 11px;border-radius:10px;margin:10px 0;font-size:12px}.ok{background:#eaf8f2;color:#08704f}.err{background:#fff0f2;color:#a51e2d}.info{background:#eef4ff;color:#274c9b}.idbox{background:#151d36;color:#fff;border-radius:12px;padding:10px;margin:10px 0;font-size:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header class="top"><div class="nav"><a href="/admin/"><img class="logo" src="/logo.PNG" alt="MedLife"></a><div class="toolbar"><button id="refresh" class="btn soft">🔄 تحديث</button><button id="new" class="btn primary">➕ إضافة مقال</button></div></div></header><main class="page"><h1>MedLife Editorial Studio V6</h1><p>مسار نشر آمن: كل عملية مرتبطة بمعرّف المقال المفتوح فقط.</p><div id="state" class="state info">جارٍ تحميل المقالات...</div><div class="layout"><section class="card"><div class="head"><b>📚 المقالات</b><input id="search" placeholder="بحث" style="width:130px"></div><div id="list" class="list"></div></section><section class="card"><div class="editor"><div class="idbox">المقال المحدد: <b id="selectedId">—</b><br><span id="selectedTitle">لم يتم اختيار مقال</span></div><div class="toolbar"><button id="save" class="btn soft">💾 حفظ</button><button id="publish" class="btn green">✅ نشر</button><button id="review" class="btn soft">🧠 تدقيق طبي</button><button id="language" class="btn soft">✍️ تدقيق لغوي</button><button id="format" class="btn soft">✨ تنسيق</button></div><div id="empty">اختر مقالًا من القائمة.</div><div id="form" style="display:none"><div class="grid"><div class="field"><label>العنوان العربي</label><input id="title"></div><div class="field"><label>التصنيف</label><input id="category"></div><div class="field"><label>الكاتب</label><input id="author"></div><div class="field"><label>البريد</label><input id="email"></div><div class="field full"><label>الملخص</label><textarea id="excerpt"></textarea></div><div class="field full"><label>المحتوى العربي</label><textarea id="content"></textarea></div></div></div></div></section></div></main><script>(function(){const $=id=>document.getElementById(id);const state={articles:[],selectedId:null,isNew:false,busy:false};const labels={pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'};const val=id=>($(id)?.value||'').trim();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function status(t,kind='info'){$('state').className='state '+kind;$('state').textContent=t}async function api(url,opt={}){const r=await fetch(url,{...opt,credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||('HTTP '+r.status));return d}function render(){const q=val('search').toLowerCase();const arr=state.articles.filter(a=>!q||String(a.title_ar||'').toLowerCase().includes(q)||String(a.author_name||'').toLowerCase().includes(q));$('list').innerHTML=arr.map(a=>`<div class="item ${Number(a.id)===Number(state.selectedId)?'active':''}" data-id="${a.id}"><b>${esc(a.title_ar||'بدون عنوان')}</b><br><small>${esc(a.author_name||'')} <span class="badge">${esc(labels[a.status]||a.status)}</span></small></div>`).join('')||'<div style="padding:20px">لا توجد مقالات.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>open(Number(el.dataset.id)))}function fill(a){$('empty').style.display='none';$('form').style.display='block';$('selectedId').textContent=a.id;$('selectedTitle').textContent=a.title_ar||'';$('title').value=a.title_ar||'';$('category').value=a.category||'';$('author').value=a.author_name||'';$('email').value=a.author_email||'';$('excerpt').value=a.excerpt_ar||'';$('content').value=a.content_ar||''}async function load(){try{status('⏳ جارٍ تحديث المقالات...');const d=await api('/api/articles?admin=1');state.articles=d.articles||[];render();status('🟢 تم التحديث '+new Date().toLocaleTimeString('ar-SY'),'ok')}catch(e){status('🔴 '+e.message,'err')}}async function open(id){const found=state.articles.find(a=>Number(a.id)===Number(id));if(!found)return;state.selectedId=Number(found.id);state.isNew=false;fill(found);render()}function body(statusValue){return {id:state.selectedId,title_ar:val('title'),category:val('category'),author_name:val('author'),author_email:val('email'),excerpt_ar:val('excerpt'),content_ar:val('content'),status:statusValue}}async function save(statusValue){const targetId=Number(state.selectedId);if(!targetId)return status('اختر مقالًا أولًا','err');if(state.busy)return;state.busy=true;try{const titleBefore=val('title');if(!titleBefore||!val('content')||!val('author'))throw Error('العنوان والمحتوى والكاتب مطلوبة.');if(statusValue==='published'&&!confirm('تأكيد نشر المقال:\n\n'+titleBefore+'\n\nمعرّف المقال: '+targetId))return;status(statusValue==='published'?'⏳ جارٍ نشر المقال المحدد...':'⏳ جارٍ الحفظ...');await api('/api/articles',{method:'PUT',body:JSON.stringify(body(statusValue))});await load();const same=state.articles.find(a=>Number(a.id)===targetId);if(!same)throw Error('تم الحفظ لكن تعذر العثور على المقال نفسه بعد التحديث.');state.selectedId=targetId;fill(same);render();status(statusValue==='published'?'✅ تم نشر المقال الصحيح #'+targetId:'✅ تم حفظ المقال #'+targetId,'ok')}catch(e){status('🔴 '+e.message,'err')}finally{state.busy=false}}$('refresh').onclick=load;$('search').oninput=render;$('new').onclick=()=>status('أضف مقالًا من المسار الحالي بعد اختيار قالب جديد.','info');$('save').onclick=()=>save('draft');$('publish').onclick=()=>save('published');$('review').onclick=async()=>{if(!state.selectedId)return status('اختر مقالًا أولًا','err');try{status('⏳ جارٍ التدقيق الطبي...');const d=await api('/api/article-editorial?action=review',{method:'POST',body:JSON.stringify({article_id:state.selectedId,references:[]})});status('✅ اكتملت المراجعة: '+(d.review?.overall_score??0)+'/100','ok')}catch(e){status('🔴 '+e.message,'err')}};$('language').onclick=async()=>{if(!state.selectedId)return status('اختر مقالًا أولًا','err');try{status('⏳ جارٍ التدقيق اللغوي...');const d=await api('/api/article-language',{method:'POST',body:JSON.stringify({mode:'proofread',content:val('content')})});$('content').value=d.content||val('content');status('✅ تم التدقيق اللغوي. اضغط حفظ لتطبيقه.','ok')}catch(e){status('🔴 '+e.message,'err')}};$('format').onclick=async()=>{if(!state.selectedId)return status('اختر مقالًا أولًا','err');try{status('⏳ جارٍ التنسيق...');const d=await api('/api/article-format-fast',{method:'POST',body:JSON.stringify({article:{title:val('title'),category:val('category'),excerpt:val('excerpt'),author_name:val('author'),content:val('content')},instruction:'نسّق بأسلوب MedLife وحافظ على المعنى.'})});const a=d.article||{};if(a.title)$('title').value=a.title;if(a.excerpt)$('excerpt').value=a.excerpt;if(Array.isArray(a.sections))$('content').value=a.sections.map((s,i)=>(i+1)+'. '+s.heading+'\n\n'+(s.content||'')).join('\n\n');status('✅ تم التنسيق. اضغط حفظ لتطبيقه.','ok')}catch(e){status('🔴 '+e.message,'err')}};load();setInterval(()=>{if(document.visibilityState==='visible'&&!state.busy)load()},45000)})();</script></body></html>
