<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو المركز الإعلامي | MedLife</title><link rel="icon" href="/logo.PNG"><style>body{font-family:Arial,sans-serif;background:#f5f7fa;color:#12203a;margin:0}.wrap{width:min(1200px,calc(100% - 28px));margin:auto;padding:28px 0}.top{background:#12203a;color:white}.card{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.list{max-height:650px;overflow:auto}.item{padding:12px;border-bottom:1px solid #eee;cursor:pointer}.item:hover{background:#fafafa}.item b{display:block}.meta{font-size:12px;color:#6d7888;margin-top:4px}.field{margin:10px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;border:1px solid #d9e0e8;border-radius:9px;padding:10px;font:inherit}.field textarea{min-height:240px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#eef2f6}.red{background:#e92850;color:#fff}.green{background:#087f5b;color:#fff}.actions{display:flex;gap:7px;flex-wrap:wrap}.msg{font-size:13px;margin-top:8px}.ok{color:#087f5b}.err{color:#b4233d}.hidden{display:none!important}.image-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;margin:7px 0}@media(max-width:800px){.grid,.two{grid-template-columns:1fr}.image-row{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><strong>MedLife — استوديو المركز الإعلامي</strong></div></header><main class="wrap"><div class="actions"><a class="btn" href="/media-center.html">عرض المركز الإعلامي</a><button class="btn red" id="new">+ مادة جديدة</button><button class="btn" id="logout">خروج</button></div><div class="grid"><aside class="card"><h3>الأرشيف <small id="count"></small></h3><div id="list"></div></aside><section class="card"><div id="login"><h2>دخول الإدارة</h2><div class="field"><label>اسم المستخدم</label><input id="identifier"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button class="btn red" id="loginBtn">دخول</button><div id="loginMsg" class="msg"></div></div><div id="editor" class="hidden"><h2 id="formTitle">مادة جديدة</h2><div class="two"><div class="field"><label>العنوان *</label><input id="title"></div><div class="field"><label>التصنيف</label><select id="category"><option>نشاط ميداني</option><option>حملة توعوية</option><option>تقرير</option><option>شراكة</option><option>إعلان مؤسسي</option><option>خبر</option></select></div><div class="field"><label>التاريخ</label><input id="date" type="date"></div><div class="field"><label>الموقع</label><input id="location"></div><div class="field"><label>الكاتب / الجهة</label><input id="author" value="مؤسسة ميدلايف الطبية الخيرية التطوعية"></div><div class="field"><label>رابط الصورة الرئيسية</label><input id="cover"></div></div><div class="field"><label>الملخص</label><textarea id="summary" style="min-height:90px"></textarea></div><div class="field"><label>نص التقرير</label><textarea id="content"></textarea></div><div class="field"><label>الصور</label><div id="images"></div><button class="btn" id="addImage">+ إضافة صورة</button></div><div class="field"><label>الحالة</label><select id="status"><option value="draft">مسودة</option><option value="published">منشور</option><option value="archived">أرشيف</option></select></div><div class="actions"><button class="btn" id="save">حفظ المسودة</button><button class="btn green" id="publish">نشر رسمياً</button><button class="btn" id="delete">حذف</button></div><div id="msg" class="msg"></div></div></section></div></main><script>const $=x=>document.getElementById(x);let posts=[],current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function api(u,o={}){const r=await fetch(u,{credentials:'same-origin',...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'تعذر تنفيذ العملية');return d}function message(t,ok=false){$('msg').textContent=t;$('msg').className='msg '+(ok?'ok':'err')}async function load(){const d=await api('/api/media-center-admin');posts=d.posts||[];$('count').textContent=posts.length?'('+posts.length+')':'';renderList()}function renderList(){$('list').innerHTML=posts.length?posts.map(p=>`<div class="item" data-id="${p.id}"><b>${esc(p.title)}</b><div class="meta">${esc(p.archive_code)} · ${esc(p.activity_date||'—')} · ${p.status==='published'?'منشور':'مسودة'}</div></div>`).join(''):'<p class="meta">لا توجد مواد بعد.</p>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>edit(+x.dataset.id))}function blank(){current={id:0,title:'',category:'نشاط ميداني',activity_date:new Date().toISOString().slice(0,10),location:'',author_name:'مؤسسة ميدلايف الطبية الخيرية التطوعية',summary:'',content_html:'',cover_image_url:'',status:'draft',images:[]};fill()}function edit(id){current=posts.find(p=>p.id===id);if(current)fill()}function fill(){$('login').classList.add('hidden');$('editor').classList.remove('hidden');for(const [id,k] of [['title','title'],['category','category'],['date','activity_date'],['location','location'],['author','author_name'],['cover','cover_image_url'],['summary','summary'],['content','content_html'],['status','status']])$(id).value=current[k]||'';renderImages();message('')}function renderImages(){$('images').innerHTML=(current.images||[]).map((x,i)=>`<div class="image-row"><input data-i="${i}" data-k="image_url" value="${esc(x.image_url)}" placeholder="رابط الصورة"><input data-i="${i}" data-k="caption" value="${esc(x.caption||'')}" placeholder="وصف الصورة"><button class="btn" data-r="${i}">×</button></div>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{current.images.splice(+b.dataset.r,1);renderImages()});document.querySelectorAll('[data-i]').forEach(e=>e.oninput=ev=>current.images[+ev.target.dataset.i][ev.target.dataset.k]=ev.target.value)}function collect(){for(const [id,k] of [['title','title'],['category','category'],['date','activity_date'],['location','location'],['author','author_name'],['cover','cover_image_url'],['summary','summary'],['content','content_html'],['status','status']])current[k]=$(id).value.trim();return current}async function save(st){try{const b=collect();b.status=st;const d=await api('/api/media-center'+(b.id?'?id='+b.id:''),{method:b.id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});current=d.post;await load();fill();message(st==='published'?'تم النشر رسمياً.':'تم حفظ المسودة.',true)}catch(e){message(e.message)}}async function start(){try{await api('/api/article-admin-session?action=me');$('login').classList.add('hidden');$('editor').classList.remove('hidden');blank();await load()}catch{}}$('loginBtn').onclick=async()=>{try{const d=await api('/api/article-admin-session?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({identifier:$('identifier').value,password:$('password').value})});if(d.success){blank();await load()}else $('loginMsg').textContent=d.error||'فشل الدخول'}catch(e){$('loginMsg').textContent=e.message}};$('new').onclick=blank;$('addImage').onclick=()=>{current.images.push({image_url:'',caption:''});renderImages()};$('save').onclick=()=>save('draft');$('publish').onclick=()=>save('published');$('delete').onclick=async()=>{if(!current?.id||!confirm('حذف المادة؟'))return;await api('/api/media-center?id='+current.id,{method:'DELETE'});blank();await load()};$('logout').onclick=async()=>{await api('/api/article-admin-session?action=logout',{method:'POST'});location.reload()};start();</script></body></html>
