<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="/logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>:root{--red:#FF2A54;--navy:#151D36;--bg:#F7F9FC;--text:#263247;--muted:#6B778C;--border:#E4E9F0;--shadow:0 14px 34px rgba(21,29,54,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.9}.container{width:min(1180px,calc(100% - 30px));margin:auto}a{text-decoration:none;color:inherit}.back{color:var(--red);font-weight:800}.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;background:#fff}.logo{height:47px}header{background:#fff;border-bottom:1px solid var(--border)}.hero{padding:60px 0 46px;background:linear-gradient(135deg,#fff,#FAFBFD);text-align:center}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.3;color:var(--navy);margin:12px 0;font-weight:900}.excerpt{max-width:820px;margin:auto;color:var(--muted);font-size:16px}.meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px;color:#7B8794;font-size:12px}.card{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:clamp(24px,5vw,62px);margin:28px 0}.card h2{color:var(--navy);font-size:27px;margin:34px 0 14px;padding-right:12px;border-right:4px solid var(--red)}.card p{font-size:16px;line-height:2.1}.card ul,.card ol{padding-right:26px}.state{text-align:center;padding:70px 20px;color:var(--muted)}.error{background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:18px;color:#991B1B}.article-image{display:block;width:min(100%,920px);max-height:430px;object-fit:cover;border-radius:18px;margin:24px auto;border:1px solid var(--border)}footer{margin-top:55px;background:#0D1222;color:#fff;text-align:center;padding:30px 18px;font-size:12px}</style>
</head>
<body>
<header><div class="container nav"><a class="back" href="/articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="/index.html"><img class="logo" src="/logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" style="display:none"></div><article id="article" class="card" style="display:none"></article></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we med.life</footer>
<script>
(()=>{'use strict';
const pathParts=location.pathname.split('/').filter(Boolean);const rawSlug=pathParts[0]==='articles'?decodeURIComponent(pathParts[pathParts.length-1]||''):'';const slug=rawSlug&&!rawSlug.endsWith('.html')?rawSlug:'';const params=new URLSearchParams(location.search);const id=params.get('id');
const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const slugify=v=>String(v||'').normalize('NFKC').toLowerCase().trim().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ـ/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,90);
const staticFiles={'tension-headache':'/articles/tension-headache.html','endometriosis-endosure':'/articles/endometriosis-endosure.html'};const legacyIds={'family-planning':'3'};
async function json(url){const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error((d&&d.error)||('HTTP '+r.status));return d}
async function loadApiArticle(target){
 const targetId=legacyIds[target]||id;
 if(targetId){try{const direct=await json('/api/article-public?id='+encodeURIComponent(targetId));if(direct&&direct.success&&direct.article)return direct.article}catch(e){}}
 const direct=await json('/api/articles');const list=Array.isArray(direct.articles)?direct.articles.filter(a=>String(a.status||'').toLowerCase()==='published'):[];
 if(targetId){const a=list.find(x=>String(x.id)===String(targetId));if(a)return a}
 if(target){const a=list.find(x=>slugify(x.title_ar||x.title_en||x.id)===slugify(target));if(a)return a}
 throw Error('المقال غير موجود أو غير منشور.');
}
async function loadStatic(file){const r=await fetch(file,{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل المقال الثابت.');const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const title=doc.querySelector('title')?.textContent?.replace(/\s*\|.*$/,'').trim()||'';const main=doc.querySelector('main')||doc.querySelector('article')||doc.body;return {title,html:main.innerHTML,description:doc.querySelector('meta[name="description"]')?.content||''};}
function renderApi(a){const title=a.title_ar||a.title_en||'مقال MedLife';const excerpt=a.excerpt_ar||a.excerpt_en||'';const content=a.content_ar||a.content_en||'';document.title=title+' | MedLife Syria';$('metaDescription').content=excerpt.slice(0,160);$('hero').innerHTML='<span class="back">♥ MedLife Knowledge</span><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(excerpt)+'</p><div class="meta"><span>✍️ '+esc(a.author_name||'MedLife')+'</span><span>📚 '+esc(a.category||'Medical Knowledge')+'</span></div>'+(a.image_url?'<img class="article-image" src="'+esc(a.image_url)+'" alt="'+esc(title)+'">':'');$('article').innerHTML=(excerpt?'<p><strong>مقدمة:</strong> '+esc(excerpt)+'</p>':'')+content.split(/\n\s*\n+/).filter(Boolean).map(x=>'<p>'+esc(x.trim())+'</p>').join('');$('loading').style.display='none';$('article').style.display='block'}
function renderStatic(a){document.title=(a.title||'المقال')+' | MedLife Syria';$('metaDescription').content=a.description;$('hero').innerHTML='<span class="back">♥ MedLife Knowledge</span><h1>'+esc(a.title)+'</h1>';$('article').innerHTML=a.html;$('loading').style.display='none';$('article').style.display='block'}
async function load(){try{if(!slug&&!id)throw Error('لم يتم تحديد المقال.');if(slug&&staticFiles[slug]){renderStatic(await loadStatic(staticFiles[slug]));history.replaceState({},'', '/articles/'+slug);return}const a=await loadApiArticle(slug||id);renderApi(a);history.replaceState({},'', '/articles/'+slugify(a.title_ar||a.title_en||a.id));}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<div class="error"><h2 style="color:#151D36">تعذر تحميل المقال</h2><p>'+esc(e.message||'حدث خطأ أثناء تحميل المقال.')+'</p><p><a class="back" href="/articles.html">العودة إلى المقالات</a></p></div>'}}load();
})();
</script>
</body>
</html>
