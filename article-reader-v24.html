<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#ff2a54;--navy:#151d36;--navy2:#202944;--bg:#f7f9fc;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--soft:#fff0f3;--blue:#eef4ff;--green:#ecfdf5;--shadow:0 18px 45px rgba(21,29,54,.09)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:2}a{color:inherit}.progress{position:fixed;inset:0 0 auto 0;height:3px;background:var(--red);transform:scaleX(0);transform-origin:right;z-index:9999}.container{width:min(1160px,calc(100% - 28px));margin:auto}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px}.logo{height:48px}.back{color:var(--red);font-weight:800;font-size:13px;text-decoration:none}
.hero{padding:60px 0 45px;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.12),transparent 32%),linear-gradient(135deg,#fff,#f7f9fc)}.hero-inner{max-width:900px;margin:auto;text-align:center}.tag{color:var(--red);font-size:12px;font-weight:900}.hero h1{margin:12px 0 16px;color:var(--navy);font-size:clamp(30px,5vw,56px);line-height:1.35}.excerpt{margin:auto;color:var(--muted);font-size:16px;max-width:820px}.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:14px;margin-top:18px;color:#7c8a99;font-size:11px}.meta span{display:inline-flex;gap:6px;align-items:center}.meta i{color:var(--red)}.cover{display:block;width:min(100%,920px);max-height:500px;object-fit:cover;margin:28px auto 0;border-radius:22px;border:1px solid var(--border);box-shadow:var(--shadow)}
.shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start;margin:24px auto 70px}.sidebar{position:sticky;top:94px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 12px 35px rgba(21,29,54,.06)}.sidebar-kicker{font-size:10px;color:var(--red);font-weight:900}.sidebar h2{font-size:18px;color:var(--navy);margin:5px 0 12px}.toc{list-style:none;padding:0;margin:0}.toc li{margin:3px 0}.toc a{display:block;padding:8px 9px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:800;text-decoration:none;transition:.2s}.toc a:hover,.toc a.active{background:var(--soft);color:var(--red)}.toc .sub{padding-right:20px;font-weight:700;font-size:10px}.author{margin-top:16px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.author strong{display:block;font-size:13px}.author small{display:block;color:#cbd5e1;font-size:10px}
.article{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.article-top{padding:15px 22px;border-bottom:1px solid var(--border);color:var(--muted);font-size:11px}.article-body{padding:clamp(24px,5vw,64px)}.article-body>*:first-child{margin-top:0}.article-body h2{color:var(--navy);font-size:clamp(23px,3vw,30px);line-height:1.5;margin:45px 0 18px;padding-right:14px;border-right:4px solid var(--red);scroll-margin-top:100px}.article-body h3{color:var(--navy);font-size:21px;line-height:1.6;margin:32px 0 12px;scroll-margin-top:100px}.article-body p{font-size:17px;line-height:2.2;margin:0 0 20px}.article-body ul,.article-body ol{padding-right:28px;margin:8px 0 25px}.article-body li{margin-bottom:8px}.article-body blockquote{margin:28px 0;padding:18px 20px;border-right:4px solid var(--red);background:var(--soft);border-radius:14px}.article-body img{display:block;max-width:100%;height:auto;margin:26px auto;border-radius:16px;object-fit:contain}.article-body figure{margin:28px 0;text-align:center}.article-body figcaption{color:var(--muted);font-size:11px;margin-top:7px}.table-wrap{width:100%;overflow-x:auto;margin:28px 0;border:1px solid var(--border);border-radius:15px}.article-body table{width:100%;min-width:620px;border-collapse:collapse;font-size:13px}.article-body th{background:var(--navy);color:#fff;padding:12px;text-align:right}.article-body td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}.article-body tr:nth-child(even) td{background:#fbfcfe}.article-body a{color:#2563eb;text-decoration:underline}.callout{padding:18px 20px;margin:25px 0;border-radius:16px;background:var(--blue);border:1px solid #d9e5ff}.refs{padding:0 clamp(24px,5vw,64px) 45px}.refs h2{color:var(--navy);border-right:4px solid var(--red);padding-right:14px}.state{text-align:center;padding:80px 20px;color:var(--muted)}.state i{font-size:34px;color:var(--red)}.error{margin:30px auto;padding:18px;border-radius:15px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}footer{background:#0d1222;color:#fff;text-align:center;padding:35px 20px;font-size:11px}.empty{display:none}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:relative;top:auto}.toc{display:grid;grid-template-columns:1fr 1fr;gap:3px}.toc .sub{padding-right:9px}.article-body p{font-size:16px}.cover{max-height:360px}}
@media(max-width:600px){.container{width:calc(100% - 20px)}.nav{min-height:64px}.logo{height:42px}.hero{padding:42px 0 34px}.hero h1{font-size:30px}.excerpt{font-size:14px}.shell{margin-top:14px}.sidebar{border-radius:16px}.toc{grid-template-columns:1fr}.article{border-radius:18px}.article-body{padding:24px 16px}.article-body h2{font-size:23px;margin-top:35px}.article-body h3{font-size:19px}.article-body p{font-size:15.5px;line-height:2.05}.article-body img{border-radius:12px;margin:20px auto}.article-body table{min-width:560px}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container hero-inner" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container" id="main"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" class="error" style="display:none"></div><div id="shell" class="shell" style="display:none"><aside class="sidebar"><div class="sidebar-kicker">MEDLIFE KNOWLEDGE</div><h2>📚 فهرس المقال</h2><ul id="toc" class="toc"></ul><div id="author" class="author" style="display:none"></div></aside><article class="article"><div id="articleTop" class="article-top"></div><div id="body" class="article-body"></div><div id="refs" class="refs" style="display:none"></div></article></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we med.life</footer>
<script>
(()=>{'use strict';
const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function pick(o,...keys){for(const k of keys){if(o&&o[k]!=null&&String(o[k]).trim()!=='')return o[k]}return ''}
function looksLikeHtml(s){return /<(article|section|h[1-6]|p|div|span|strong|em|ul|ol|li|table|thead|tbody|tr|td|th|img|figure|blockquote|a)\b/i.test(String(s||''))}
function sanitize(html){const t=document.createElement('template');t.innerHTML=html;const bad=t.content.querySelectorAll('script,style,iframe,object,embed,form,link,meta');bad.forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||n==='srcdoc'||((n==='href'||n==='src'||n==='xlink:href')&&v.startsWith('javascript:')))el.removeAttribute(a.name)});if(el.tagName==='IMG'){el.setAttribute('loading','lazy');el.setAttribute('decoding','async')}});t.content.querySelectorAll('table').forEach(table=>{if(table.parentElement?.classList.contains('table-wrap'))return;const w=document.createElement('div');w.className='table-wrap';table.parentNode.insertBefore(w,table);w.appendChild(table)});return t.innerHTML}
function textToHtml(raw){return String(raw||'').replace(/\r/g,'').split(/\n\s*\n+/).map(b=>{const x=b.trim();if(!x)return'';const m=x.match(/^(?:#{2,4}\s*|\d+[.)ـ:-]\s+)(.+)$/);if(m)return '<h2>'+esc(m[1])+'</h2>';if(/^[-*•]\s+/.test(x))return '<ul>'+x.split('\n').map(y=>'<li>'+esc(y.replace(/^[-*•]\s+/,''))+'</li>').join('')+'</ul>';return x.split('\n').map(y=>'<p>'+esc(y)+'</p>').join('')}).join('')}
function splitRefsFromHtml(html){const holder=document.createElement('div');holder.innerHTML=html;let heading=[...holder.querySelectorAll('h2,h3')].find(h=>/المصادر|المراجع|المصادر العلمية|المراجع العلمية/i.test(h.textContent));if(!heading)return{main:html,refs:''};const ref=document.createElement('div');let n=heading;while(n){const next=n.nextSibling;ref.appendChild(n);if(!next)break;n=next}return{main:holder.innerHTML,refs:ref.innerHTML}}
function buildToc(){const body=$('body');const hs=[...body.querySelectorAll('h2,h3')].filter(h=>h.textContent.trim()&&!/المصادر|المراجع/i.test(h.textContent));const toc=$('toc');toc.innerHTML='';hs.forEach((h,i)=>{if(!h.id)h.id='section-'+(i+1);const li=document.createElement('li');const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent.trim();if(h.tagName==='H3')a.className='sub';li.appendChild(a);toc.appendChild(li)});if(!hs.length){const li=document.createElement('li');li.textContent='لا يوجد فهرس لهذا المقال';li.style.color='var(--muted)';li.style.fontSize='11px';toc.appendChild(li);return}const links=[...toc.querySelectorAll('a')];const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id))}}),{rootMargin:'-25% 0px -60% 0px'});hs.forEach(h=>io.observe(h))}
async function getArticle(){if(!id)throw new Error('رقم المقال غير موجود');const urls=['/api/article-public?id='+encodeURIComponent(id),'/api/articles'];let first='';for(const url of urls){try{const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});const d=await r.json();if(url.includes('article-public')&&r.ok&&d.success&&d.article)return d.article;if(url.includes('/api/articles')&&r.ok&&d.success){const a=(d.articles||[]).find(x=>String(x.id)===String(id)&&String(x.status||'').toLowerCase()==='published');if(a)return a}if(!first)first=d.error||('HTTP '+r.status)}catch(e){if(!first)first=e.message}}throw new Error(first||'تعذر تحميل المقال')}
function render(a){const title=pick(a,'title','name')||'مقال MedLife';const excerpt=pick(a,'excerpt','summary','description');const body=pick(a,'body','content','article_body','html_content','article_content','text')||'';const author=pick(a,'author_name','author','writer_name','writer');const category=pick(a,'category_name','category','type');const published=pick(a,'published_at','publishedAt','created_at','createdAt');const cover=pick(a,'cover_image','coverImage','featured_image','image','image_url');document.title=title+' | MedLife Syria';$('metaDescription').setAttribute('content',String(excerpt||title).slice(0,160));$('hero').innerHTML='<div class="tag"><i class="fa-solid fa-book-medical"></i> '+esc(category||'محتوى تثقيفي طبي')+'</div><h1>'+esc(title)+'</h1>'+(excerpt?'<div class="excerpt">'+esc(excerpt)+'</div>':'')+'<div class="meta">'+(author?'<span><i class="fa-solid fa-user-doctor"></i>'+esc(author)+'</span>':'')+(published?'<span><i class="fa-regular fa-calendar"></i>'+esc(new Date(published).toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'}))+'</span>':'')+'</div>'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(title)+'" loading="eager">':'');const html=looksLikeHtml(body)?sanitize(body):textToHtml(body);const split=splitRefsFromHtml(html);$('body').innerHTML=split.main;$('refs').innerHTML=split.refs;$('refs').style.display=split.refs?'block':'none';if(split.refs)$('refs').insertAdjacentHTML('afterbegin','<h2>المصادر العلمية</h2>');if(author){$('author').innerHTML='<strong>'+esc(author)+'</strong><small>كاتب/مراجع المقال</small>';$('author').style.display='block'}buildToc();$('articleTop').textContent='محتوى طبي تثقيفي — يعرض النص المحفوظ دون اختصار أو إعادة صياغة';$('loading').style.display='none';$('shell').style.display='grid';}
window.addEventListener('scroll',()=>{const d=document.documentElement;const max=d.scrollHeight-d.clientHeight;$('progress').style.transform='scaleX('+(max>0?d.scrollTop/max:0)+')'});getArticle().then(render).catch(e=>{$('loading').style.display='none';$('error').style.display='block';$('error').textContent='تعذر تحميل المقال: '+e.message})
})();
</script>
</body>
</html>
