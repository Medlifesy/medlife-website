<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--red-dark:#E51E46;--red-soft:#FFF0F3;--navy:#151D36;--navy2:#202944;--light:#F7F9FC;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;--blue-soft:#EEF4FF;--green-soft:#ECFDF5;--orange-soft:#FFF7ED;--shadow:0 18px 45px rgba(21,29,54,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--light);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.95}.reading-progress{position:fixed;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--red),#ff9bb0);transform-origin:right;transform:scaleX(0);z-index:2000}.container{width:min(1180px,calc(100% - 32px));margin:auto}a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{height:52px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--red);font-size:13px;font-weight:800}
.hero{padding:72px 0 56px;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.13),transparent 30%),linear-gradient(135deg,#fff,#F7F9FC)}.hero-inner{max-width:920px;margin:auto;text-align:center}.tag{display:inline-flex;align-items:center;gap:7px;color:var(--red);font-size:12px;font-weight:900}.hero h1{color:var(--navy);font-size:clamp(34px,5vw,58px);line-height:1.3;margin:12px 0 18px;font-weight:900}.excerpt{max-width:840px;margin:auto;color:var(--muted);font-size:17px}.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:20px;color:#7C8A99;font-size:12px}.meta span{display:inline-flex;align-items:center;gap:6px}.meta i{color:var(--red)}.hero-image{display:block;width:min(100%,920px);max-height:430px;object-fit:cover;margin:28px auto 0;border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow)}
.toolbar{margin:24px 0 18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--muted);font-size:11px;font-weight:800}.chip i{color:var(--red)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;align-items:start}.sidebar{position:sticky;top:100px;background:#fff;border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 12px 35px rgba(21,29,54,.07)}.sidebar-kicker{color:var(--red);font-size:10px;font-weight:900;margin-bottom:6px}.sidebar h3{margin:0 0 14px;color:var(--navy);font-size:19px}.toc{list-style:none;margin:0;padding:0}.toc li+li{margin-top:4px}.toc a{display:block;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:800;transition:.2s}.toc a:hover,.toc a.active{background:var(--red-soft);color:var(--red);transform:translateX(-2px)}.author{margin-top:18px;padding:16px;border-radius:17px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.author strong{display:block;font-size:14px}.author small{display:block;color:#CBD5E1;font-size:10px;line-height:1.8;margin-top:4px}
.article{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.article-top{padding:18px 25px;border-bottom:1px solid var(--border);background:linear-gradient(90deg,#fff,#FBFCFF);font-size:11px;color:var(--muted)}.article-body{padding:clamp(26px,5vw,68px)}.intro{padding:20px 22px;border-radius:18px;background:var(--blue-soft);border:1px solid #D9E5FF;margin-bottom:30px}.section{scroll-margin-top:105px;opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}.section.revealed{opacity:1;transform:none}.article-body h2{color:var(--navy);font-size:28px;line-height:1.45;margin:44px 0 18px;padding-right:16px;border-right:4px solid var(--red)}.article-body h3{color:var(--navy);font-size:21px;margin:30px 0 12px}.article-body p{font-size:17px;line-height:2.15;margin:0 0 20px}.article-body ul,.article-body ol{padding-right:28px;margin:8px 0 24px}.article-body li{margin-bottom:9px}.callout{padding:19px 20px;border-radius:17px;margin:28px 0;border:1px solid var(--border)}.warning{background:var(--orange-soft);border-color:#FED7AA}.good{background:var(--green-soft);border-color:#BBF7D0}.comparison{overflow:auto;margin:26px 0;border:1px solid var(--border);border-radius:16px}.comparison table{width:100%;min-width:650px;border-collapse:collapse;font-size:13px}.comparison th{background:var(--navy);color:#fff;padding:13px;text-align:right}.comparison td{padding:13px;border-bottom:1px solid var(--border);vertical-align:top}.comparison tr:nth-child(even) td{background:#FBFCFE}.refs{margin-top:48px;padding-top:28px;border-top:1px solid var(--border)}.refs h2{margin-top:0}.refs li{margin-bottom:12px}.refs a{color:#2563EB;word-break:break-word}.disclaimer{margin-top:30px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:11px}.state{text-align:center;padding:80px 20px;color:var(--muted)}.state i{font-size:38px;color:var(--red);margin-bottom:12px}.error{color:#991B1B;background:#FEF2F2;border:1px solid #FECACA;border-radius:16px;padding:18px;margin:30px 0}
footer{margin-top:70px;background:#0D1222;color:#fff;text-align:center;padding:36px 20px;font-size:12px}footer p{margin:4px;opacity:.82}@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto}.toc{display:grid;grid-template-columns:1fr 1fr;gap:4px}.article-body p{font-size:16px}}@media(max-width:600px){.container{width:calc(100% - 24px)}.logo{height:45px}.hero{padding:52px 0 44px}.hero h1{font-size:34px}.toc{grid-template-columns:1fr}.article-body{padding:26px 18px}.article-body h2{font-size:24px}}
</style></head>
<body>
<div class="reading-progress" id="readingProgress"></div>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container hero-inner" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" style="display:none"></div><div id="shell" style="display:none"><div class="toolbar"><span class="chip"><i class="fa-solid fa-book-medical"></i> محتوى تثقيفي طبي</span><span class="chip"><i class="fa-regular fa-clock"></i> <b id="readTime">—</b> قراءة</span><span class="chip"><i class="fa-solid fa-shield-heart"></i> مراجعة بشرية قبل النشر</span></div><div class="layout"><aside class="sidebar"><div class="sidebar-kicker">MEDLIFE KNOWLEDGE</div><h3>📚 فهرس المقال</h3><ul id="toc" class="toc"></ul><div id="author" class="author" style="display:none"></div></aside><article class="article"><div id="articleTop" class="article-top"></div><div id="body" class="article-body"></div><div id="refs" class="refs" style="display:none"></div></article></div></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br><p>We save life, we med.life</p></footer>
<script>
(()=>{'use strict';
const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const inline=v=>esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const date=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'})};const words=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;const mins=t=>Math.max(1,Math.round(words(t)/180));
function splitRefs(raw){const m=String(raw||'').match(/(?:^|\n)\s*(?:\d+[.)]\s*)?(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*\n([\s\S]*)$/i);if(!m)return{main:String(raw||''),refs:[]};return{main:String(raw||'').slice(0,m.index).trim(),refs:m[1].split(/\n(?=\s*(?:\d+|[٠-٩]+)[.)])/).map(x=>x.trim()).filter(Boolean)}}
function table(block){const rows=block.split('\n').map(x=>x.replace(/^\||\|$/g,'').split('|').map(c=>c.trim())).filter(r=>r.length>=2);if(rows.length<2)return null;return'<div class="comparison"><table><thead><tr>'+rows[0].map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+rows[0].map((_,i)=>'<td>'+inline(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function render(raw){const p=splitRefs(raw),blocks=p.main.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let html='',heads=[],n=0;for(const block of blocks){const lines=block.split('\n').map(x=>x.trim()).filter(Boolean),first=lines[0]||'',m=first.match(/^#{1,4}\s*(.+)$/)||first.match(/^(\d{1,2}|[٠-٩]{1,2})[.)ـ:-]\s*(.+)$/);if(m){const title=m[2]||m[1],sid='sec-'+n++;heads.push({id:sid,title});html+='<section class="section" id="'+sid+'"><h2>'+inline(title)+'</h2>'+bodyLines(lines.slice(1))+'</section>'}else html+=bodyLines(lines)}return{html,heads,refs:p.refs}}
function bodyLines(lines){if(!lines.length)return'';const t=lines.length>1&&lines.every(x=>x.includes('|'))?table(lines.join('\n')):null;if(t)return t;let out='',ul=false,ol=false;const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};for(const line of lines){let m=line.match(/^[-*•]\s+(.+)$/);if(m){if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(m[1])+'</li>';continue}m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(ul){out+='</ul>';ul=false}if(!ol){out+='<ol>';ol=true}out+='<li>'+inline(m[1])+'</li>';continue}close();if(/^(⚠️|تحذير|ملاحظة مهمة|علامات الخطر)/.test(line))out+='<div class="callout warning">'+inline(line.replace(/^⚠️\s*/,''))+'</div>';else if(/^(💗|كلمة ميدلايف|الخلاصة)/.test(line))out+='<div class="callout good">'+inline(line.replace(/^💗\s*/,''))+'</div>';else out+='<p>'+inline(line)+'</p>'}close();return out}
function fetchJ(url){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);return fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))}
async function getArticle(){let e1='';try{const r=await fetchJ('/api/article-public?id='+encodeURIComponent(id)),d=await r.json();if(r.ok&&d.success&&d.article)return d.article;e1=d.error||('HTTP '+r.status)}catch(e){e1=e.name==='AbortError'?'انتهت مهلة الاتصال بالخادم.':e.message}try{const r=await fetchJ('/api/articles'),d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));const a=(d.articles||[]).find(x=>String(x.id)===String(id)&&String(x.status||'').toLowerCase()==='published');if(a)return a;throw new Error('المقال غير موجود أو غير منشور')}catch(e){throw new Error(e1?e1+' — وتعذر المسار الاحتياطي أيضًا.':e.message)}}
function scrollUX(heads){const sec=heads.map(x=>document.getElementById(x.id)).filter(Boolean),links=[...document.querySelectorAll('#toc a')];const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){const i=sec.indexOf(e.target);links.forEach((a,k)=>a.classList.toggle('active',k===i));e.target.classList.add('revealed')}}),{rootMargin:'-18% 0px -62% 0px',threshold:.01});sec.forEach(s=>io.observe(s));const progress=()=>{const max=document.documentElement.scrollHeight-innerHeight;$("readingProgress").style.transform='scaleX('+(max>0?scrollY/max:0)+')'};addEventListener('scroll',progress,{passive:true});progress()}
async function load(){if(!id){location.replace('articles/tension-headache.html');return}try{const a=await getArticle(),title=a.title_ar||a.title_en||'مقال MedLife',content=a.content_ar||a.content_en||'',out=render(content),minutes=mins(title+' '+(a.excerpt_ar||'')+' '+content);document.title=title+' | MedLife Syria';$('metaDescription').content=(a.excerpt_ar||a.excerpt_en||'').slice(0,160);$('hero').innerHTML='<span class="tag">♥ MedLife Knowledge · توعية صحية</span><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(a.excerpt_ar||a.excerpt_en||'')+'</p><div class="meta"><span>✍️ '+esc(a.author_name||'MedLife')+'</span><span>📅 '+esc(date(a.published_at||a.created_at))+'</span><span>⏱️ '+minutes+' دقائق قراءة</span><span>📚 '+esc(a.category||'Medical Knowledge')+'</span></div>'+(a.image_url?'<img class="hero-image" src="'+esc(a.image_url)+'" alt="'+esc(title)+'">':'');$('readTime').textContent=minutes+' دقائق';$('articleTop').textContent='مقالة طبية تثقيفية · '+(a.category||'Medical Knowledge');$('body').innerHTML=(a.excerpt_ar?'<div class="intro"><strong>مقدمة:</strong> '+inline(a.excerpt_ar)+'</div>':'')+out.html+'<div class="disclaimer">هذا المحتوى تثقيفي ولا يغني عن التقييم الطبي المباشر.</div>';if(out.refs.length){$('refs').innerHTML='<h2>📚 المراجع</h2><ol>'+out.refs.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';$('refs').style.display='block'}$('toc').innerHTML=out.heads.length?out.heads.map((h,i)=>'<li><a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a></li>').join(''):'<li>لا توجد أقسام معنونة.</li>';if(a.author_name){$('author').innerHTML='<strong>✍️ '+esc(a.author_name)+'</strong><small>مقالة تثقيفية منشورة عبر MedLife Knowledge.</small>';$('author').style.display='block'}$('loading').style.display='none';$('shell').style.display='block';scrollUX(out.heads)}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<div class="error"><strong>تعذر تحميل المقال</strong><br>'+esc(e.message||'حدث خطأ أثناء جلب المقال.')+'</div>'}}
load();})();
</script></body></html>
