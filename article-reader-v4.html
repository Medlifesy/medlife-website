<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--red2:#E51E46;--pink:#FFF0F3;--navy:#151D36;--navy2:#202944;--bg:#F7F9FC;--text:#263247;--muted:#6B778C;--border:#E4E9F0;--blue:#EEF4FF;--green:#ECFDF5;--orange:#FFF7ED;--shadow:0 16px 40px rgba(21,29,54,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.95}.container{width:min(1180px,calc(100% - 30px));margin:auto}a{text-decoration:none;color:inherit}
.progress{position:fixed;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--red),#ff9eb1);transform-origin:right;transform:scaleX(0);z-index:3000}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:74px;display:flex;justify-content:space-between;align-items:center}.logo{height:48px}.back{display:inline-flex;gap:8px;align-items:center;color:var(--red);font-size:13px;font-weight:800}
.hero{padding:64px 0 48px;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.10),transparent 30%),linear-gradient(135deg,#fff,#FAFBFD)}.hero-inner{text-align:center;max-width:930px}.tag{color:var(--red);font-weight:900;font-size:12px;display:inline-flex;gap:7px;align-items:center}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.32;color:var(--navy);margin:12px 0 16px;font-weight:900;animation:heroIn .7s ease both}.excerpt{max-width:820px;margin:auto;color:var(--muted);font-size:16px;animation:fadeIn .9s .1s ease both}.meta{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:18px;color:#7B8794;font-size:12px;animation:fadeIn .9s .18s ease both}.meta span{display:inline-flex;align-items:center;gap:6px}.meta i{color:var(--red)}
.hero-image{display:block;width:min(100%,920px);max-height:430px;object-fit:cover;margin:25px auto 0;border-radius:20px;border:1px solid var(--border);box-shadow:var(--shadow);animation:heroImage .9s .2s ease both}
.toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.chip{font-size:11px;color:var(--muted);border:1px solid var(--border);background:#fff;padding:8px 11px;border-radius:11px}.chip i{color:var(--red);margin-left:5px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}.side{position:sticky;top:92px;background:#fff;border:1px solid var(--border);border-radius:17px;padding:17px;box-shadow:0 12px 30px rgba(21,29,54,.05)}.side-kicker{font-size:10px;color:var(--red);font-weight:900;margin-bottom:6px}.side h3{margin:0 0 12px;color:var(--navy);font-size:18px}.toc{list-style:none;padding:0;margin:0}.toc li+li{margin-top:3px}.toc a{display:block;padding:8px 9px;border-radius:9px;color:var(--muted);font-size:11px;font-weight:700;transition:background .25s,color .25s,transform .25s}.toc a:hover,.toc a.active{background:var(--pink);color:var(--red);transform:translateX(-3px)}.author{margin-top:15px;padding:14px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff}.author strong{display:block;font-size:13px}.author small{display:block;color:#CBD5E1;font-size:10px;line-height:1.75;margin-top:4px}
.article{background:#fff;border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}.article-head{padding:14px 20px;background:#FCFDFF;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted)}.article-body{padding:clamp(24px,5vw,64px)}.intro{background:var(--blue);border:1px solid #D8E6FF;border-radius:16px;padding:18px 20px;margin-bottom:28px}.intro strong{color:var(--navy)}
.section{opacity:0;transform:translateY(22px);transition:opacity .65s ease,transform .65s ease;scroll-margin-top:100px}.section.reveal{opacity:1;transform:none}.article-body h2{color:var(--navy);font-size:27px;line-height:1.5;margin:42px 0 17px;padding-right:13px;border-right:4px solid var(--red)}.article-body h3{color:var(--navy);font-size:20px;margin:28px 0 12px}.article-body p{font-size:16px;line-height:2.15;margin:0 0 18px}.article-body ul,.article-body ol{padding-right:26px;margin:8px 0 23px}.article-body li{margin-bottom:8px}.callout{padding:17px 18px;border-radius:14px;margin:24px 0;border:1px solid var(--border);animation:softUp .55s ease both}.warning{background:var(--orange);border-color:#FED7AA}.good{background:var(--green);border-color:#BBF7D0}.comparison{overflow:auto;margin:24px 0;border:1px solid var(--border);border-radius:14px}.comparison table{width:100%;min-width:650px;border-collapse:collapse;font-size:13px}.comparison th{background:var(--navy);color:#fff;padding:12px;text-align:right}.comparison td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}.comparison tr:nth-child(even) td{background:#FBFCFE}
.context-image{margin:26px 0;border:1px solid var(--border);border-radius:18px;overflow:hidden;background:#FBFCFE;box-shadow:0 10px 28px rgba(21,29,54,.05);opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}.context-image.reveal{opacity:1;transform:none}.context-image img{display:block;width:100%;max-height:460px;object-fit:contain;background:#fff}.caption{padding:9px 13px;text-align:center;font-size:10px;color:var(--muted);line-height:1.7}.caption a{color:#2563EB}
.refs{margin-top:44px;padding-top:26px;border-top:1px solid var(--border)}.refs h2{margin-top:0}.refs li{margin-bottom:11px}.refs a{color:#2563EB;word-break:break-word}.disclaimer{margin-top:26px;padding-top:17px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.state{text-align:center;padding:75px 20px;color:var(--muted)}.state i{font-size:34px;color:var(--red);margin-bottom:10px}.error{background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:18px;color:#991B1B;margin:28px 0}
footer{margin-top:60px;background:#0D1222;color:#fff;text-align:center;padding:32px 18px;font-size:12px}footer p{opacity:.82;margin:4px}
@keyframes heroIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes heroImage{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}@keyframes softUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.section,.context-image{opacity:1!important;transform:none!important}}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.toc{display:grid;grid-template-columns:1fr 1fr;gap:4px}.toc li+li{margin-top:0}.article-body p{font-size:15.5px}}@media(max-width:600px){.container{width:calc(100% - 24px)}.hero{padding:48px 0 38px}.hero h1{font-size:32px}.toc{grid-template-columns:1fr}.article-body{padding:22px 17px}.article-body h2{font-size:23px}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container hero-inner" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" style="display:none"></div><div id="shell" style="display:none"><div class="toolbar"><span class="chip">📖 محتوى تثقيفي طبي</span><span class="chip">⏱️ <b id="readTime">—</b> قراءة</span><span class="chip">⚕️ مراجعة بشرية قبل النشر</span></div><div class="layout"><aside class="side"><div class="side-kicker">MEDLIFE KNOWLEDGE</div><h3>📚 فهرس المقال</h3><ul id="toc" class="toc"></ul><div id="author" class="author" style="display:none"></div></aside><article class="article"><div id="articleHead" class="article-head"></div><div id="body" class="article-body"></div><div id="refs" class="refs" style="display:none"></div></article></div></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br><p>We save life, we med.life</p></footer>
<script>
(()=>{'use strict';
const id=new URLSearchParams(location.search).get('id'),$=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const inline=v=>esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const date=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'})};
const countWords=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;const readingMinutes=t=>Math.max(1,Math.round(countWords(t)/180));
function splitRefs(raw){const m=String(raw||'').match(/(?:^|\n)\s*(?:\d+[.)]\s*)?(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*\n([\s\S]*)$/i);if(!m)return{main:String(raw||''),refs:[]};return{main:String(raw||'').slice(0,m.index).trim(),refs:m[1].split(/\n(?=\s*(?:\d+|[٠-٩]+)[.)])/).map(x=>x.trim()).filter(Boolean)}}
function renderTable(block){const rows=block.split('\n').map(x=>x.replace(/^\||\|$/g,'').split('|').map(c=>c.trim())).filter(r=>r.length>=2);if(rows.length<2)return null;return'<div class="comparison"><table><thead><tr>'+rows[0].map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+rows[0].map((_,i)=>'<td>'+inline(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function linesHTML(lines){if(!lines.length)return'';let out='',ul=false,ol=false;const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};const table=lines.length>1&&lines.every(x=>x.includes('|'))?renderTable(lines.join('\n')):null;if(table)return table;for(const line of lines){let m=line.match(/^[-*•]\s+(.+)$/);if(m){if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(m[1])+'</li>';continue}m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(ul){out+='</ul>';ul=false}if(!ol){out+='<ol>';ol=true}out+='<li>'+inline(m[1])+'</li>';continue}close();if(/^(⚠️|تحذير|ملاحظة مهمة|علامات الخطر)/.test(line))out+='<div class="callout warning">'+inline(line.replace(/^⚠️\s*/,''))+'</div>';else if(/^(💗|كلمة ميدلايف|الخلاصة)/.test(line))out+='<div class="callout good">'+inline(line.replace(/^💗\s*/,''))+'</div>';else out+='<p>'+inline(line)+'</p>'}close();return out}
function renderContent(raw){const p=splitRefs(raw),blocks=p.main.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let html='',heads=[],idx=0;for(const block of blocks){const lines=block.split('\n').map(x=>x.trim()).filter(Boolean),first=lines[0]||'',m=first.match(/^#{1,4}\s*(.+)$/)||first.match(/^(\d{1,2}|[٠-٩]{1,2})[.)ـ:-]\s*(.+)$/);if(m){const title=m[2]||m[1],sid='sec-'+idx++;heads.push({id:sid,title});html+='<section class="section" id="'+sid+'"><h2>'+inline(title)+'</h2>'+linesHTML(lines.slice(1))+'</section>'}else html+=linesHTML(lines)}return{html,heads,refs:p.refs}}
function withTimeout(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))}
async function getArticle(){let e1='';try{const r=await withTimeout('/api/article-public?id='+encodeURIComponent(id),8000),d=await r.json();if(r.ok&&d.success&&d.article)return d.article;e1=d.error||('HTTP '+r.status)}catch(e){e1=e.name==='AbortError'?'انتهت مهلة الاتصال بالخادم.':e.message}try{const r=await withTimeout('/api/articles',8000),d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));const a=(d.articles||[]).find(x=>String(x.id)===String(id)&&String(x.status||'').toLowerCase()==='published');if(a)return a;throw new Error('المقال غير موجود أو غير منشور')}catch(e){throw new Error(e1?e1+' — وتعذر المسار الاحتياطي أيضًا.':e.message)}}
function imageCard(src,caption,url){return '<figure class="context-image"><img loading="lazy" src="'+src+'" alt="'+esc(caption)+'"><figcaption class="caption">'+esc(caption)+' · <a href="'+url+'" target="_blank" rel="noopener noreferrer">المصدر والترخيص</a></figcaption></figure>'}
function addContextImages(article){const title=(article.title_ar||'').toLowerCase();const body=(article.content_ar||'').toLowerCase();if(!(title.includes('تنظيم الأسرة')||title.includes('منع الحمل')||body.includes('اللولب')))return;const contraceptionImg=imageCard('https://commons.wikimedia.org/wiki/Special:Redirect/file/Iuddiagram.jpg','رسم توضيحي للولب النحاسي داخل الرحم','https://commons.wikimedia.org/wiki/File:Iuddiagram.jpg');const sections=[...document.querySelectorAll('.section')];const target=sections.find(s=>/تصنيفات وسائل تنظيم الأسرة|كيف تختارين|وسائل تنظيم الأسرة/.test(s.innerText));if(target&&!target.querySelector('.context-image')){target.insertAdjacentHTML('beforeend',contraceptionImg)}else if(sections[2])sections[2].insertAdjacentHTML('beforeend',contraceptionImg)}
function animate(){const sections=[...document.querySelectorAll('.section')],imgs=[...document.querySelectorAll('.context-image')],links=[...document.querySelectorAll('#toc a')];const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting)e.target.classList.add('reveal')}),{threshold:.12,rootMargin:'0px 0px -70px 0px'});[...sections,...imgs].forEach(x=>io.observe(x));const map=new Map(sections.map((s,i)=>[s.id,links[i]]));const active=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.remove('active'));const l=map.get(e.target.id);if(l)l.classList.add('active')}}),{rootMargin:'-25% 0px -65% 0px',threshold:0});sections.forEach(s=>active.observe(s));window.addEventListener('scroll',()=>{const doc=document.documentElement;const p=doc.scrollTop/(doc.scrollHeight-doc.clientHeight||1);$('progress').style.transform='scaleX('+Math.min(1,Math.max(0,p))+')'},{passive:true})}
async function load(){if(!id){location.replace('articles/tension-headache.html');return}try{const a=await getArticle(),title=a.title_ar||a.title_en||'مقال MedLife',content=a.content_ar||a.content_en||'',out=renderContent(content);document.title=title+' | MedLife Syria';$('metaDescription').content=(a.excerpt_ar||a.excerpt_en||'').slice(0,160);$('hero').innerHTML='<span class="tag"><i class="fa-solid fa-heart-pulse"></i> MedLife Knowledge · توعية صحية</span><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(a.excerpt_ar||a.excerpt_en||'')+'</p><div class="meta"><span><i class="fa-solid fa-user"></i>'+esc(a.author_name||'MedLife')+'</span><span><i class="fa-regular fa-calendar"></i>'+esc(date(a.published_at||a.created_at))+'</span><span><i class="fa-regular fa-clock"></i>'+readingMinutes(content)+' دقائق قراءة</span><span><i class="fa-solid fa-layer-group"></i>'+esc(a.category||'Medical Knowledge')+'</span></div>'+(a.image_url?'<img class="hero-image" src="'+esc(a.image_url)+'" alt="'+esc(title)+'">':'');$('articleHead').textContent='مقالة طبية تثقيفية · '+(a.category||'Medical Knowledge');$('body').innerHTML=(a.excerpt_ar?'<div class="intro"><strong>مقدمة:</strong> '+inline(a.excerpt_ar)+'</div>':'')+out.html+'<div class="disclaimer">هذا المحتوى تثقيفي ولا يغني عن التقييم الطبي المباشر.</div>';if(out.refs.length){$('refs').innerHTML='<h2>📚 المراجع</h2><ol>'+out.refs.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';$('refs').style.display='block'}$('toc').innerHTML=out.heads.length?out.heads.map((h,i)=>'<li><a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a></li>').join(''):'<li>لا توجد أقسام معنونة.</li>';if(a.author_name){$('author').innerHTML='<strong>✍️ '+esc(a.author_name)+'</strong><small>مقالة تثقيفية منشورة عبر MedLife Knowledge.</small>';$('author').style.display='block'}addContextImages(a);$('loading').style.display='none';$('shell').style.display='block';animate()}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').className='error';$('error').innerHTML='<h2>تعذر تحميل المقال</h2><p>'+esc(e.message||'حدث خطأ أثناء جلب المقال.')+'</p><p><a class="back" href="articles.html">العودة إلى المقالات</a></p>'}}
load();
})();
</script>
</body>
</html>
