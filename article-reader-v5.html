<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--red-dark:#E51E46;--pink:#FFF0F3;--navy:#151D36;--bg:#F7F9FC;--text:#263247;--muted:#6B778C;--border:#E4E9F0;--blue:#EEF4FF;--green:#ECFDF5;--orange:#FFF7ED;--shadow:0 14px 34px rgba(21,29,54,.07)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.9}.container{width:min(1180px,calc(100% - 30px));margin:auto}a{text-decoration:none;color:inherit}
.progress{position:fixed;top:0;right:0;left:0;height:3px;background:linear-gradient(90deg,var(--red),#ff9eb1);transform-origin:right;transform:scaleX(0);z-index:3000}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center}.logo{height:47px}.back{display:inline-flex;gap:8px;align-items:center;color:var(--red);font-size:13px;font-weight:800}
.hero{padding:60px 0 46px;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.10),transparent 30%),linear-gradient(135deg,#fff,#FAFBFD)}.hero-inner{text-align:center;max-width:930px}.tag{color:var(--red);font-size:12px;font-weight:900;display:inline-flex;gap:7px;align-items:center}.hero h1{font-size:clamp(32px,5vw,56px);line-height:1.32;color:var(--navy);margin:11px 0 15px;font-weight:900;animation:heroIn .4s ease both}.excerpt{max-width:820px;margin:auto;color:var(--muted);font-size:16px;animation:fadeIn .45s .05s ease both}.meta{display:flex;justify-content:center;gap:13px;flex-wrap:wrap;margin-top:17px;color:#7B8794;font-size:12px;animation:fadeIn .45s .1s ease both}.meta span{display:inline-flex;align-items:center;gap:6px}.meta i{color:var(--red)}.hero-image{display:block;width:min(100%,920px);max-height:420px;object-fit:cover;margin:24px auto 0;border-radius:18px;border:1px solid var(--border);box-shadow:var(--shadow);animation:heroImage .5s .12s ease both}
.toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:20px 0 15px}.chip{font-size:11px;color:var(--muted);border:1px solid var(--border);background:#fff;padding:8px 11px;border-radius:11px}.chip i{color:var(--red);margin-left:5px}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}.side{position:sticky;top:90px;background:#fff;border:1px solid var(--border);border-radius:17px;padding:16px;box-shadow:0 10px 25px rgba(21,29,54,.05)}.side-kicker{font-size:10px;color:var(--red);font-weight:900;margin-bottom:5px}.side h3{margin:0 0 11px;color:var(--navy);font-size:18px}.toc{list-style:none;padding:0;margin:0}.toc li+li{margin-top:2px}.toc a{display:block;padding:8px 9px;border-radius:9px;color:var(--muted);font-size:11px;font-weight:700;transition:background .16s ease,color .16s ease,transform .16s ease}.toc a:hover,.toc a.active{background:var(--pink);color:var(--red);transform:translateX(-2px)}.author{margin-top:14px;padding:13px;border-radius:14px;background:linear-gradient(135deg,var(--navy),#222D4C);color:#fff}.author strong{display:block;font-size:13px}.author small{display:block;color:#CBD5E1;font-size:10px;line-height:1.75;margin-top:4px}
.article{background:#fff;border:1px solid var(--border);border-radius:21px;overflow:hidden;box-shadow:var(--shadow)}.article-head{padding:13px 19px;background:#FCFDFF;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted)}.article-body{padding:clamp(24px,5vw,62px)}.intro{background:var(--blue);border:1px solid #D8E6FF;border-radius:15px;padding:18px 19px;margin-bottom:27px}.section{scroll-margin-top:95px;opacity:0;transform:translateY(12px);transition:opacity .34s ease,transform .34s ease}.section.reveal{opacity:1;transform:none}.article-body h2{color:var(--navy);font-size:27px;line-height:1.45;margin:40px 0 16px;padding-right:12px;border-right:4px solid var(--red)}.article-body h3{color:var(--navy);font-size:20px;margin:26px 0 11px}.article-body p{font-size:16px;line-height:2.12;margin:0 0 17px}.article-body ul,.article-body ol{padding-right:25px;margin:7px 0 22px}.article-body li{margin-bottom:7px}.callout{padding:16px 17px;border-radius:13px;margin:22px 0;border:1px solid var(--border);animation:softIn .32s ease both}.warning{background:var(--orange);border-color:#FED7AA}.good{background:var(--green);border-color:#BBF7D0}.comparison{overflow:auto;margin:23px 0;border:1px solid var(--border);border-radius:13px}.comparison table{width:100%;min-width:650px;border-collapse:collapse;font-size:13px}.comparison th{background:var(--navy);color:#fff;padding:11px;text-align:right}.comparison td{padding:11px;border-bottom:1px solid var(--border);vertical-align:top}.comparison tr:nth-child(even) td{background:#FBFCFE}.context-image{margin:24px 0;border:1px solid var(--border);border-radius:17px;overflow:hidden;background:#FBFCFE;opacity:0;transform:translateY(12px);transition:opacity .42s ease,transform .42s ease}.context-image.reveal{opacity:1;transform:none}.context-image img{display:block;width:100%;max-height:440px;object-fit:contain;background:#fff}.caption{text-align:center;padding:8px 12px;font-size:10px;color:var(--muted);line-height:1.7}.caption a{color:#2563EB}.refs{margin-top:42px;padding-top:25px;border-top:1px solid var(--border)}.refs h2{margin-top:0}.refs li{margin-bottom:10px}.refs a{color:#2563EB;word-break:break-word}.disclaimer{margin-top:25px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}.state{text-align:center;padding:70px 20px;color:var(--muted)}.state i{font-size:34px;color:var(--red);margin-bottom:10px}.error{background:#FEF2F2;border:1px solid #FECACA;border-radius:13px;padding:17px;color:#991B1B;margin:25px 0}
footer{margin-top:58px;background:#0D1222;color:#fff;text-align:center;padding:30px 18px;font-size:12px}footer p{opacity:.82;margin:4px}
@keyframes heroIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes heroImage{from{opacity:0;transform:scale(.992)}to{opacity:1;transform:none}}@keyframes softIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}.section,.context-image{opacity:1!important;transform:none!important}}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.toc{display:grid;grid-template-columns:1fr 1fr;gap:3px}.article-body p{font-size:15.5px}}@media(max-width:600px){.container{width:calc(100% - 24px)}.hero{padding:47px 0 37px}.hero h1{font-size:32px}.toc{grid-template-columns:1fr}.article-body{padding:22px 17px}.article-body h2{font-size:23px}}
</style>
</head>
<body>
<div class="progress" id="progress"></div>
<header><div class="container nav"><a class="back" href="/articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="/index.html"><img class="logo" src="/logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container hero-inner" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" style="display:none"></div><div id="shell" style="display:none"><div class="toolbar"><span class="chip">📖 محتوى تثقيفي طبي</span><span class="chip">⏱️ <b id="readTime">—</b> قراءة</span><span class="chip">⚕️ مراجعة بشرية قبل النشر</span></div><div class="layout"><aside class="side"><div class="side-kicker">MEDLIFE KNOWLEDGE</div><h3>📚 فهرس المقال</h3><ul id="toc" class="toc"></ul><div id="author" class="author" style="display:none"></div></aside><article class="article"><div id="articleHead" class="article-head"></div><div id="body" class="article-body"></div><div id="refs" class="refs" style="display:none"></div></article></div></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br><p>We save life, we med.life</p></footer>
<script>
(()=>{'use strict';
const params=new URLSearchParams(location.search);const id=params.get('id');let slug=params.get('slug');const pathSlug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');if(!slug&&pathSlug&&pathSlug!=='article-reader-v5.html'&&!pathSlug.endsWith('.html'))slug=pathSlug;const $=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const inline=v=>esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');const words=t=>String(t||'').trim().split(/\s+/).filter(Boolean).length;const mins=t=>Math.max(1,Math.round(words(t)/180));const date=v=>{if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'})};
function slugify(v){return String(v||'').normalize('NFKC').toLowerCase().trim().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/[ى]/g,'ي').replace(/[ؤ]/g,'و').replace(/[ئ]/g,'ي').replace(/[ـ]/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,90)}
function splitRefs(raw){const m=String(raw||'').match(/(?:^|\n)\s*(?:\d+[.)]\s*)?(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*\n([\s\S]*)$/i);if(!m)return{main:String(raw||''),refs:[]};return{main:String(raw||'').slice(0,m.index).trim(),refs:m[1].split(/\n(?=\s*(?:\d+|[٠-٩]+)[.)])/).map(x=>x.trim()).filter(Boolean)}}
function table(block){const rows=block.split('\n').map(x=>x.replace(/^\||\|$/g,'').split('|').map(c=>c.trim())).filter(r=>r.length>=2);if(rows.length<2)return null;return'<div class="comparison"><table><thead><tr>'+rows[0].map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+rows[0].map((_,i)=>'<td>'+inline(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function linesHTML(lines){if(!lines.length)return'';let out='',ul=false,ol=false;const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};const t=lines.length>1&&lines.every(x=>x.includes('|'))?table(lines.join('\n')):null;if(t)return t;for(const line of lines){let m=line.match(/^[-*•]\s+(.+)$/);if(m){if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(m[1])+'</li>';continue}m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(ul){out+='</ul>';ul=false}if(!ol){out+='<ol>';ol=true}out+='<li>'+inline(m[1])+'</li>';continue}close();if(/^(⚠️|تحذير|ملاحظة مهمة|علامات الخطر)/.test(line))out+='<div class="callout warning">'+inline(line.replace(/^⚠️\s*/,''))+'</div>';else if(/^(💗|كلمة ميدلايف|الخلاصة)/.test(line))out+='<div class="callout good">'+inline(line.replace(/^💗\s*/,''))+'</div>';else out+='<p>'+inline(line)+'</p>'}close();return out}
function renderContent(raw){const p=splitRefs(raw),blocks=p.main.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let html='',heads=[],idx=0;for(const block of blocks){const lines=block.split('\n').map(x=>x.trim()).filter(Boolean),first=lines[0]||'',m=first.match(/^#{1,4}\s*(.+)$/)||first.match(/^(\d{1,2}|[٠-٩]{1,2})[.)ـ:-]\s*(.+)$/);if(m){const title=m[2]||m[1],sid='sec-'+idx++;heads.push({id:sid,title});html+='<section class="section" id="'+sid+'"><h2>'+inline(title)+'</h2>'+linesHTML(lines.slice(1))+'</section>'}else html+=linesHTML(lines)}return{html,heads,refs:p.refs}}
function withTimeout(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);return fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t))}
async function getArticle(){if(id){try{const r=await withTimeout('/api/article-public?id='+encodeURIComponent(id),8000),d=await r.json();if(r.ok&&d.success&&d.article)return d.article}catch(e){}}const r=await withTimeout('/api/articles',8000),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||('HTTP '+r.status));const list=(d.articles||[]).filter(a=>String(a.status||'').toLowerCase()==='published');if(slug){const found=list.find(a=>slugify(a.title_ar||a.title_en)===slug);if(found)return found}if(id){const found=list.find(a=>String(a.id)===String(id));if(found)return found}throw Error('المقال غير موجود أو غير منشور.')}
function setupUX(heads){const sections=heads.map(x=>document.getElementById(x.id)).filter(Boolean),links=[...document.querySelectorAll('#toc a')];const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');const i=sections.indexOf(e.target);links.forEach((a,k)=>a.classList.toggle('active',k===i));}}),{threshold:.08,rootMargin:'-8% 0px -65% 0px'});sections.forEach(s=>io.observe(s));const onScroll=()=>{const h=document.documentElement.scrollHeight-innerHeight,p=Math.max(0,Math.min(1,scrollY/h));$('progress').style.transform='scaleX('+p+')'};addEventListener('scroll',onScroll,{passive:true});onScroll()}
async function load(){if(!id&&!slug){location.replace('/articles/tension-headache.html');return}try{const a=await getArticle(),title=a.title_ar||a.title_en||'مقال MedLife',content=a.content_ar||a.content_en||'',out=renderContent(content);document.title=title+' | MedLife Syria';$('metaDescription').content=(a.excerpt_ar||a.excerpt_en||'').slice(0,160);$('hero').innerHTML='<span class="tag">♥ MedLife Knowledge · توعية صحية</span><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(a.excerpt_ar||a.excerpt_en||'')+'</p><div class="meta"><span>✍️ '+esc(a.author_name||'MedLife')+'</span><span>📅 '+esc(date(a.published_at||a.created_at))+'</span><span>📚 '+esc(a.category||'Medical Knowledge')+'</span></div>'+(a.image_url?'<img class="hero-image" src="'+esc(a.image_url)+'" alt="'+esc(title)+'">':'');$('readTime').textContent=mins(content)+' دقائق';$('articleHead').textContent='مقالة طبية تثقيفية · '+(a.category||'Medical Knowledge');$('body').innerHTML=(a.excerpt_ar?'<div class="intro"><strong>مقدمة:</strong> '+inline(a.excerpt_ar)+'</div>':'')+out.html+'<div class="disclaimer">هذا المحتوى تثقيفي ولا يغني عن التقييم الطبي المباشر.</div>';if(out.refs.length){$('refs').innerHTML='<h2>📚 المراجع</h2><ol>'+out.refs.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';$('refs').style.display='block'}$('toc').innerHTML=out.heads.length?out.heads.map((h,i)=>'<li><a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a></li>').join(''):'<li>لا توجد أقسام معنونة.</li>';if(a.author_name){$('author').innerHTML='<strong>✍️ '+esc(a.author_name)+'</strong><small>مقالة تثقيفية منشورة عبر MedLife Knowledge.</small>';$('author').style.display='block'}$('loading').style.display='none';$('shell').style.display='block';setupUX(out.heads);// Canonical URL is owned by the /articles/[slug] route; the reader never rewrites it.}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<h2 style="color:#151D36">تعذر تحميل المقال</h2><p>'+esc(e.message||'حدث خطأ أثناء جلب المقال.')+'</p><p><a class="back" href="/articles.html">العودة إلى المقالات</a></p>'}}
load();
})();
</script>
</body>
</html>
