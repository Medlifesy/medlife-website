<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="مقال طبي تثقيفي من MedLife Syria"><link rel="icon" href="/logo.PNG">
<style>body{font-family:Cairo,Arial,sans-serif;margin:0;background:#F7F9FC;color:#263247;line-height:1.9}.container{width:min(1100px,calc(100% - 30px));margin:auto}.nav{min-height:72px;display:flex;justify-content:space-between;align-items:center;background:#fff}.logo{height:47px}.back{color:#FF2A54;font-weight:800;text-decoration:none}.hero{padding:55px 0 40px;text-align:center;background:#fff}.hero h1{color:#151D36;font-size:clamp(32px,5vw,54px);margin:10px 0}.excerpt{max-width:800px;margin:auto;color:#6B778C}.card{background:#fff;border:1px solid #E4E9F0;border-radius:22px;padding:clamp(24px,5vw,60px);margin:28px 0}.card h2{color:#151D36;border-right:4px solid #FF2A54;padding-right:12px}.state{text-align:center;padding:65px 20px;color:#6B778C}.error{background:#FEF2F2;border:1px solid #FECACA;border-radius:14px;padding:18px;color:#991B1B}p{font-size:16px;line-height:2.1}</style>
</head><body>
<header><div class="container nav"><a class="back" href="/articles.html">← العودة إلى المقالات</a><a href="/index.html"><img class="logo" src="/logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container" id="hero"><div class="state">جاري تحميل المقال…</div></div></section>
<main class="container"><div id="loading" class="state">جاري تحميل المحتوى…</div><div id="error" style="display:none"></div><article id="article" class="card" style="display:none"></article></main>
<script>
(()=>{
const params=new URLSearchParams(location.search);const requestedSlug=(params.get('slug')||'').trim();const requestedId=params.get('id');
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const slugify=v=>String(v||'').normalize('NFKC').toLowerCase().trim().replace(/[\u064B-\u065F\u0670]/g,'').replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/ـ/g,'').replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-+|-+$/g,'').slice(0,90);
const staticFiles={'tension-headache':'/articles/tension-headache.html','endometriosis-endotest-endosure':'/articles/endometriosis-endosure.html'};
async function json(url){const r=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'});let d=null;try{d=await r.json()}catch{}if(!r.ok)throw Error((d&&d.error)||('HTTP '+r.status));return d}
async function staticArticle(slug){const r=await fetch(staticFiles[slug],{cache:'no-store'});if(!r.ok)throw Error('تعذر تحميل المقال الثابت.');const html=await r.text();const doc=new DOMParser().parseFromString(html,'text/html');const main=doc.querySelector('main')||doc.querySelector('article')||doc.body;return {title:doc.querySelector('h1')?.textContent?.trim()||doc.title.replace(/\s*\|.*$/,'').trim(),description:doc.querySelector('meta[name="description"]')?.content||'',html:main.innerHTML}}
async function apiArticle(){if(requestedId){try{const d=await json('/api/article-public?id='+encodeURIComponent(requestedId));if(d?.success&&d.article)return d.article}catch{}}const d=await json('/api/articles');const list=Array.isArray(d.articles)?d.articles.filter(a=>String(a.status||'').toLowerCase()==='published'):[];if(requestedSlug){const a=list.find(x=>slugify(x.title_ar||x.title_en||x.id)===slugify(requestedSlug));if(a)return a}throw Error('المقال غير موجود أو غير منشور.')}
function renderStatic(a){document.title=a.title+' | MedLife Syria';$('metaDescription').content=a.description;$('hero').innerHTML='<h1>'+esc(a.title)+'</h1>';$('article').innerHTML=a.html;$('loading').style.display='none';$('article').style.display='block'}
function renderApi(a){const title=a.title_ar||a.title_en||'مقال MedLife',excerpt=a.excerpt_ar||a.excerpt_en||'',content=a.content_ar||a.content_en||'';document.title=title+' | MedLife Syria';$('metaDescription').content=excerpt.slice(0,160);$('hero').innerHTML='<h1>'+esc(title)+'</h1><p class="excerpt">'+esc(excerpt)+'</p>';$('article').innerHTML=(excerpt?'<p><strong>مقدمة:</strong> '+esc(excerpt)+'</p>':'')+content.split(/\n\s*\n+/).filter(Boolean).map(x=>'<p>'+esc(x.trim())+'</p>').join('');$('loading').style.display='none';$('article').style.display='block'}
async function load(){try{if(!requestedSlug&&!requestedId)throw Error('لم يتم تحديد المقال.');if(requestedSlug&&staticFiles[slugify(requestedSlug)]){renderStatic(await staticArticle(slugify(requestedSlug)));return}renderApi(await apiArticle())}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<div class="error"><h2>تعذر تحميل المقال</h2><p>'+esc(e.message)+'</p><p><a class="back" href="/articles.html">العودة إلى المقالات</a></p></div>'}}load();
})();</script>
</body></html>
