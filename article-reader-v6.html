<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المقال | MedLife</title>
<link rel="icon" href="/logo.PNG">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#151d36;--red:#a7193b;--bg:#f7f8fb;--card:#fff;--line:#e1e5ec;--muted:#697386;--soft:#f2f4f7;--shadow:0 12px 35px rgba(21,29,54,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font-family:Cairo,Arial,sans-serif;line-height:1.9}.wrap{width:min(980px,calc(100% - 30px));margin:auto}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center}.topin{width:min(1180px,calc(100% - 30px));margin:auto;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px}.brand strong{font-size:15px}.back{font-size:12px;font-weight:800;color:var(--red);text-decoration:none}.article{padding:46px 0 60px}.category{font-size:12px;font-weight:800;color:var(--red);margin-bottom:8px}.article h1{font-size:clamp(30px,5vw,48px);line-height:1.35;margin:0 0 12px}.lead{font-size:17px;color:#526071;max-width:850px;margin:0 0 20px}.cover{width:100%;max-height:500px;object-fit:cover;border-radius:18px;background:var(--soft);display:block;margin:24px 0}.info{display:grid;grid-template-columns:1.8fr repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:var(--shadow);margin:24px 0 34px}.infoItem{background:#fff;padding:14px}.infoItem .k{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.infoItem .v{display:block;font-size:12px;font-weight:800;line-height:1.6}.summary{background:#f9fafb;border:1px solid var(--line);border-right:4px solid var(--red);padding:17px 18px;border-radius:12px;margin-bottom:30px}.summary h2{font-size:15px;margin:0 0 4px}.summary p{margin:0;color:#4b5563;font-size:13px}.body{background:#fff;border:1px solid var(--line);border-radius:18px;padding:35px;box-shadow:var(--shadow);font-size:17px}.body p{margin:0 0 1.2em}.body h2{font-size:24px;line-height:1.5;margin:1.6em 0 .6em;padding-right:12px;border-right:4px solid var(--red)}.body h3{font-size:19px;margin:1.5em 0 .5em}.body ul,.body ol{padding-right:25px}.body li{margin:.35em 0}.body blockquote{margin:1.4em 0;padding:13px 17px;background:var(--soft);border-right:4px solid #9aa4b2;border-radius:10px}.body table{width:100%;border-collapse:collapse;margin:1.4em 0;font-size:14px}.body th,.body td{border:1px solid #d5dae2;padding:9px;text-align:right}.body th{background:var(--navy);color:#fff}.body img{max-width:100%;height:auto;display:block;margin:22px auto;border-radius:12px}.body a{color:#8e1634;text-decoration:underline}.sourceTitle{margin:35px 0 10px;font-size:18px}.related{margin-top:22px}.related a{display:block;padding:11px 0;border-bottom:1px solid var(--line);color:#253044}.loading{text-align:center;padding:80px 20px;color:var(--muted)}.notfound{text-align:center;padding:80px 20px}.notfound h1{font-size:28px}.notfound a{color:var(--red);font-weight:800}.foot{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 40px}@media(max-width:800px){.info{grid-template-columns:repeat(2,1fr)}.infoItem:first-child{grid-column:1/-1}.body{padding:20px;font-size:16px}}@media(max-width:520px){.info{grid-template-columns:1fr 1fr}.article{padding-top:30px}.body{border-radius:13px;padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="topin"><a class="brand" href="/articles.html"><img src="/logo.PNG" alt="MedLife"><strong>المقالات الطبية</strong></a><a class="back" href="/articles.html">العودة إلى المقالات</a></div></header>
<main class="wrap" id="app"><div class="loading">جارٍ تحميل المقال</div></main>
<footer class="foot">MedLife — مكتبة المقالات الطبية</footer>
<script>
(() => {
 const a=window.__MEDLIFE_ARTICLE__||null; const $=id=>document.getElementById(id);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const strip=s=>String(s??'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
 const words=s=>strip(s).split(/\s+/).filter(Boolean).length;
 const read=Math.max(1,Math.ceil(words(a?.content_ar||'')/220));
 const date=v=>{if(!v)return '—';try{return new Intl.DateTimeFormat('ar-SY',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v))}catch{return v}};
 if(!a){$('app').innerHTML='<section class="notfound"><h1>المقال غير موجود</h1><p>لم نتمكن من العثور على المقال المطلوب.</p><a href="/articles.html">العودة إلى المقالات</a></section>';return}
 document.title=(a.title_ar||'المقال')+' | MedLife';
 const content=a.content_ar||'<p>لا يوجد محتوى منشور لهذا المقال.</p>';
 $('app').innerHTML=`<article class="article"><div class="category">${esc(a.category||'محتوى طبي')}</div><h1>${esc(a.title_ar||a.title_en)}</h1><p class="lead">${esc(a.excerpt_ar||strip(content).slice(0,420))}</p>${a.image_url?`<img class="cover" src="${esc(a.image_url)}" alt="${esc(a.title_ar||'صورة المقال')}">`:''}<section class="info"><div class="infoItem"><span class="k">ملخص المقال</span><span class="v">${esc(a.excerpt_ar||strip(content).slice(0,180))}</span></div><div class="infoItem"><span class="k">الكاتب</span><span class="v">${esc(a.author_name||'MedLife')}</span></div><div class="infoItem"><span class="k">التصنيف</span><span class="v">${esc(a.category||'محتوى طبي')}</span></div><div class="infoItem"><span class="k">تاريخ النشر</span><span class="v">${date(a.created_at)}</span></div><div class="infoItem"><span class="k">آخر تحديث</span><span class="v">${date(a.updated_at||a.created_at)}</span></div><div class="infoItem"><span class="k">وقت القراءة</span><span class="v">${read} دقائق تقريباً</span></div></section><section class="body">${content}</section></article>`;
 })();
</script>
</body>
</html>
