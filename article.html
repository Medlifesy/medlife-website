<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta name="description" content="مقال طبي تثقيفي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--navy:#151D36;--light:#F7F9FC;--text:#273247;--muted:#6B778C;--border:#E4E9F0;--blue:#EEF4FF;--orange:#FFF7ED;--green:#ECFDF5}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--light);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.9}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 30px));margin:auto}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:74px;display:flex;justify-content:space-between;align-items:center}.logo{height:48px}.back{color:var(--red);font-weight:800;font-size:13px}
.hero{padding:60px 0 45px;background:linear-gradient(135deg,#fff,#fafbfd)}.hero-inner{text-align:center;max-width:920px}.tag{color:var(--red);font-size:12px;font-weight:900}.hero h1{color:var(--navy);font-size:clamp(32px,5vw,54px);line-height:1.35;margin:10px 0 16px}.excerpt{max-width:820px;margin:auto;color:var(--muted);font-size:16px}.meta{margin-top:18px;color:#7b8794;font-size:12px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.hero-image{display:block;width:min(100%,920px);max-height:430px;object-fit:cover;margin:24px auto 0;border-radius:18px;border:1px solid var(--border)}
.toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:22px 0 16px}.chip{font-size:11px;color:var(--muted);border:1px solid var(--border);background:#fff;padding:7px 10px;border-radius:10px}.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}.side{position:sticky;top:92px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px}.side h3{margin:0 0 12px;color:var(--navy);font-size:18px}.toc{list-style:none;padding:0;margin:0}.toc a{display:block;padding:7px 8px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:700}.toc a:hover{background:#FFF1F4;color:var(--red)}.author{margin-top:15px;padding:13px;border-radius:13px;background:var(--navy);color:#fff;font-size:12px}.author small{display:block;color:#cbd5e1;margin-top:4px;line-height:1.7}
.article{background:#fff;border:1px solid var(--border);border-radius:20px;overflow:hidden}.article-head{padding:14px 20px;border-bottom:1px solid var(--border);font-size:11px;color:var(--muted);background:#fcfdff}.article-body{padding:clamp(22px,5vw,62px)}.intro{background:var(--blue);border:1px solid #dbe7ff;border-radius:15px;padding:18px 20px;margin-bottom:26px}.article-body h2{color:var(--navy);font-size:27px;line-height:1.5;margin:40px 0 16px;padding-right:13px;border-right:4px solid var(--red);scroll-margin-top:95px}.article-body h3{color:var(--navy);font-size:20px;margin:28px 0 12px}.article-body p{font-size:16px;line-height:2.15;margin:0 0 18px}.article-body ul,.article-body ol{padding-right:26px;margin:8px 0 23px}.article-body li{margin-bottom:8px}.callout{padding:17px 18px;border-radius:14px;margin:24px 0;border:1px solid var(--border)}.callout.warning{background:var(--orange);border-color:#fed7aa}.callout.good{background:var(--green);border-color:#bbf7d0}.table-wrap{overflow:auto;margin:24px 0;border:1px solid var(--border);border-radius:13px}.table-wrap table{width:100%;min-width:650px;border-collapse:collapse;font-size:13px}.table-wrap th{background:var(--navy);color:#fff;padding:11px;text-align:right}.table-wrap td{padding:11px;border-bottom:1px solid var(--border);vertical-align:top}.table-wrap tr:nth-child(even) td{background:#fbfcfe}.refs{margin-top:42px;padding-top:25px;border-top:1px solid var(--border)}.refs h2{margin-top:0}.refs li{margin-bottom:10px}.refs a{color:#2563eb;word-break:break-word}.state{text-align:center;padding:75px 20px;color:var(--muted)}.state i{font-size:34px;color:var(--red);margin-bottom:10px}.error{color:#b42318}.disclaimer{margin-top:28px;padding-top:17px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}footer{margin-top:60px;background:#0d1222;color:#fff;text-align:center;padding:32px 18px;font-size:12px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static}.article-body p{font-size:15.5px}}@media(max-width:600px){.hero{padding:46px 0 36px}.hero h1{font-size:32px}.article-body{padding:22px 17px}.article-body h2{font-size:23px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container hero-inner" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" class="state error" style="display:none"></div><div id="shell" style="display:none"><div class="toolbar"><span class="chip">📖 محتوى تثقيفي طبي</span><span class="chip">⚕️ لا يغني عن التقييم الطبي المباشر</span></div><div class="layout"><aside class="side"><h3>📚 فهرس المقال</h3><ul id="toc" class="toc"></ul><div id="author" class="author" style="display:none"></div></aside><article class="article"><div id="articleHead" class="article-head"></div><div id="body" class="article-body"></div><div id="refs" class="refs" style="display:none"></div></article></div></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we med.life</footer>
<script>
(()=>{
'use strict';
const id=new URLSearchParams(location.search).get('id');
const $=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const inline=v=>esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const date=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'});};
function parseRefs(raw){const m=String(raw||'').match(/(?:^|\n)\s*(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*\n([\s\S]*)$/i);if(!m)return{main:String(raw||''),items:[]};return{main:String(raw||'').slice(0,m.index).trim(),items:m[1].split(/\n(?=\s*\d+[.)])/).map(x=>x.trim()).filter(Boolean)};}
function render(raw){const p=parseRefs(raw),blocks=p.main.replace(/\r/g,'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let html='',heads=[],idx=0;for(const block of blocks){const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);const first=lines[0]||'';const m=first.match(/^#{1,4}\s*(.+)$/)||first.match(/^(\d{1,2}|[٠-٩]{1,2})[.)ـ:-]\s*(.+)$/);if(m){const title=m[2]||m[1],sid='sec-'+idx++;heads.push({id:sid,title});html+='<section id="'+sid+'"><h2>'+inline(title)+'</h2>'+renderLines(lines.slice(1))+'</section>';}else html+=renderLines(lines);}return{html,heads,refs:p.items};}
function renderLines(lines){if(!lines.length)return'';let out='',ul=false,ol=false;const close=()=>{if(ul){out+='</ul>';ul=false}if(ol){out+='</ol>';ol=false}};const allTable=lines.length>1&&lines.every(x=>x.includes('|'));if(allTable){const rows=lines.map(x=>x.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));return '<div class="table-wrap"><table><thead><tr>'+rows[0].map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+rows[0].map((_,i)=>'<td>'+inline(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}for(const line of lines){let m=line.match(/^[-*•]\s+(.+)$/);if(m){if(ol){out+='</ol>';ol=false}if(!ul){out+='<ul>';ul=true}out+='<li>'+inline(m[1])+'</li>';continue}m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(ul){out+='</ul>';ul=false}if(!ol){out+='<ol>';ol=true}out+='<li>'+inline(m[1])+'</li>';continue}close();if(/^(⚠️|تحذير|ملاحظة مهمة|علامات الخطر)/.test(line))out+='<div class="callout warning">'+inline(line.replace(/^⚠️\s*/,''))+'</div>';else if(/^(💗|كلمة ميدلايف|الخلاصة)/.test(line))out+='<div class="callout good">'+inline(line.replace(/^💗\s*/,''))+'</div>';else out+='<p>'+inline(line)+'</p>';}close();return out;}
function withTimeout(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{headers:{Accept:'application/json'},cache:'no-store',signal:c.signal}).finally(()=>clearTimeout(t));}
async function getArticle(){
let firstError='';
try{const r=await withTimeout('/api/article-public?id='+encodeURIComponent(id),8000);const d=await r.json();if(r.ok&&d.success&&d.article)return d.article;firstError=d.error||('HTTP '+r.status);}catch(e){firstError=e.name==='AbortError'?'انتهت مهلة الاتصال بالخادم.':e.message;}
try{const r=await withTimeout('/api/articles',8000);const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||('HTTP '+r.status));const a=(d.articles||[]).find(x=>String(x.id)===String(id)&&String(x.status||'').toLowerCase()==='published');if(a)return a;throw new Error('المقال غير موجود أو غير منشور.');}catch(e){throw new Error(firstError?firstError+' — وتعذر أيضًا استخدام المسار الاحتياطي.':e.message);}
}
async function load(){if(!id){location.replace('articles/tension-headache.html');return;}try{const a=await getArticle();const title=a.title_ar||a.title_en||'مقال MedLife';document.title=title+' | MedLife Syria';document.querySelector('meta[name="description"]').content=(a.excerpt_ar||a.excerpt_en||'').slice(0,160);$('hero').innerHTML='<span class="tag">♥ MedLife Knowledge · توعية صحية</span><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(a.excerpt_ar||a.excerpt_en||'')+'</p><div class="meta"><span>✍️ '+esc(a.author_name||'MedLife')+'</span><span>📅 '+esc(date(a.published_at||a.created_at))+'</span><span>📚 '+esc(a.category||'Medical Knowledge')+'</span></div>'+(a.image_url?'<img class="hero-image" src="'+esc(a.image_url)+'" alt="'+esc(title)+'">':'');const out=render(a.content_ar||a.content_en||'');$('articleHead').textContent='مقالة طبية تثقيفية · '+(a.category||'Medical Knowledge');$('body').innerHTML=(a.excerpt_ar?'<div class="intro"><strong>مقدمة:</strong> '+inline(a.excerpt_ar)+'</div>':'')+out.html+'<div class="disclaimer">هذا المحتوى تثقيفي ولا يغني عن التقييم الطبي المباشر.</div>';if(out.refs.length){$('refs').innerHTML='<h2>📚 المراجع</h2><ol>'+out.refs.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>';$('refs').style.display='block';}$('toc').innerHTML=out.heads.length?out.heads.map((h,i)=>'<li><a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a></li>').join(''):'<li>لا توجد أقسام معنونة.</li>';if(a.author_name){$('author').innerHTML='<strong>✍️ '+esc(a.author_name)+'</strong><small>مقالة تثقيفية منشورة عبر MedLife Knowledge.</small>';$('author').style.display='block';}$('loading').style.display='none';$('shell').style.display='block';}catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<h2 style="color:#151D36">تعذر تحميل المقال</h2><p>'+esc(e.message||'حدث خطأ أثناء جلب المقال.')+'</p><p><a class="back" href="articles.html">العودة إلى المقالات</a></p>';}}
load();
})();
</script>
</body>
</html>
