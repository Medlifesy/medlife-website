<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta name="description" content="مقال طبي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--navy:#151D36;--white:#fff;--light:#F7F9FC;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;--green:#08704f;--shadow:0 18px 45px rgba(21,29,54,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--light);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:2}a{color:inherit;text-decoration:none}.container{width:min(1100px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:18px}.logo{height:52px}.back{color:var(--red);font-weight:800}.hero{padding:72px 0 55px;text-align:center;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.11),transparent 30%),linear-gradient(135deg,#fff,#F7F9FC)}.tag{color:var(--red);font-weight:900;font-size:13px}.hero h1{font-size:clamp(32px,5vw,54px);line-height:1.35;color:var(--navy);margin:12px 0 18px}.excerpt{max-width:820px;margin:auto;color:var(--muted);font-size:16px;line-height:2}.meta{margin-top:20px;color:#7C8A99;font-size:12px}.article{background:#fff;margin:38px auto 75px;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:clamp(25px,5vw,68px)}.intro{background:#EEF4FF;border:1px solid #D8E4FF;border-radius:18px;padding:20px;margin-bottom:28px}.article h2{color:var(--navy);font-size:28px;line-height:1.55;margin:42px 0 18px;padding-right:14px;border-right:4px solid var(--red);scroll-margin-top:100px}.article h3{color:var(--navy);font-size:21px;margin:30px 0 12px}.article p{font-size:16px;line-height:2.15;margin:0 0 20px}.article ul,.article ol{padding-right:28px;margin:10px 0 25px}.article li{margin-bottom:9px}.warning{background:#FFF6F7;border:1px solid #FFD6DE;border-radius:16px;padding:18px 20px;margin:22px 0}.good{background:#ECFDF5;border:1px solid #BFE9D6;border-radius:16px;padding:18px 20px;margin:22px 0}.toc{background:#FBFCFF;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:28px}.toc strong{display:block;color:var(--navy);margin-bottom:7px}.toc a{display:block;color:var(--muted);padding:5px 0;font-size:13px}.references{border-top:1px solid var(--border);padding-top:28px;margin-top:42px}.references li{margin-bottom:12px}.references a{color:#2563EB;word-break:break-word}.state{padding:70px 20px;text-align:center;color:var(--muted)}.state i{font-size:34px;color:var(--red);margin-bottom:12px}footer{background:#0D1222;color:#fff;text-align:center;padding:32px 20px;font-size:12px}
@media(max-width:700px){.article p{font-size:15.5px}.article h2{font-size:24px}.logo{height:46px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container" id="heroContent"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><article class="article" id="articleBody"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div></article></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we are med.life</footer>
<script>
(function(){
'use strict';
const params=new URLSearchParams(location.search);
const requestedId=params.get('id');
const hero=document.getElementById('heroContent');
const body=document.getElementById('articleBody');
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const attr=(v)=>esc(v).replace(/\n/g,' ');
function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'});}
function parseReferences(text){
 const m=String(text||'').match(/(?:^|\n)\s*(?:المصادر(?: العلمية)?|المراجع(?: العلمية)?|المصادر والمراجع)\s*\n([\s\S]*)$/i);
 if(!m)return {main:String(text||''),refs:[]};
 const refs=m[1].split(/\n(?=\s*\d+[.)])/).map(x=>x.trim()).filter(Boolean);
 return {main:String(text||'').slice(0,m.index).trim(),refs};
}
function renderContent(raw){
 const parsed=parseReferences(raw);
 let text=parsed.main.replace(/\r/g,'').trim();
 const blocks=text.split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);
 const headings=[];let html='';
 blocks.forEach((block)=>{
   const lines=block.split('\n').map(x=>x.trim()).filter(Boolean);
   let first=lines[0]||'';
   const heading=first.match(/^(?:#{1,4}\s*|(?:\d{1,2}|[٠-٩]{1,2})\s*[.)ـ:-]\s*)(.+)$/);
   if(heading){
     const title=heading[1].trim();
     const id='sec-'+headings.length;headings.push({id,title});
     const rest=lines.slice(1);
     html+='<section><h2 id="'+id+'">'+esc(title)+'</h2>'+blocksToHtml(rest.join('\n\n'),title)+'</section>';
   }else html+=blocksToHtml(block,'');
 });
 let toc='';if(headings.length){toc='<nav class="toc"><strong>📚 فهرس المقال</strong>'+headings.map((h,i)=>'<a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a>').join('')+'</nav>';}
 if(parsed.refs.length){toc+='';html+='<section class="references"><h2>📚 المصادر والمراجع</h2><ol>'+parsed.refs.map(r=>{const safe=esc(r);const url=(r.match(/https?:\/\/[^\s\]]+/)||[])[0];return '<li>'+safe+(url?' — <a href="'+attr(url)+'" target="_blank" rel="noopener noreferrer">فتح المرجع</a>':'')+'</li>';}).join('')+'</ol></section>';}
 return (toc||'')+html;
}
function blocksToHtml(text,heading){
 const chunks=String(text||'').split(/\n\s*\n+/).map(x=>x.trim()).filter(Boolean);let out='';
 chunks.forEach(chunk=>{
   if(!chunk)return;
   if(/^[-*•]\s+/.test(chunk)||/^\d+[.)]\s+/.test(chunk)){
      const rows=chunk.split('\n').map(x=>x.trim()).filter(Boolean);const ordered=/^\d+[.)]\s+/.test(rows[0]);
      out+='<'+(ordered?'ol':'ul')+'>'+rows.map(x=>'<li>'+esc(x.replace(/^(?:[-*•]|\d+[.)])\s+/,'')).replace(/\*([^*]+)\*/g,'<strong>$1</strong>')+'</li>').join('')+'</'+(ordered?'ol':'ul')+'>';
   }else if(/خطر|تحذير|علامات الخطر|متى يجب طلب|حالات/.test(chunk)) out+='<div class="warning">'+chunk.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
   else if(/كلمة ميدلايف|الخلاصة|نصيحة ميدلايف/.test(heading||'')) out+='<div class="good">'+chunk.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
   else out+=chunk.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('');
 });return out;
}
async function load(){
 if(!requestedId){location.replace('articles/tension-headache.html');return;}
 try{
   const res=await fetch('/api/articles',{headers:{Accept:'application/json'},cache:'no-store'});
   const data=await res.json();if(!res.ok||!data.success)throw new Error(data.error||'تعذر تحميل المقالات');
   const articles=Array.isArray(data.articles)?data.articles:[];
   const article=articles.find(a=>String(a.id)===String(requestedId)&&String(a.status||'').toLowerCase()==='published');
   if(!article)throw new Error('المقال المطلوب غير موجود أو لم يُنشر بعد.');
   const title=article.title_ar||article.title_en||'مقال MedLife';
   const excerpt=article.excerpt_ar||article.excerpt_en||'';
   document.title=title+' | MedLife Syria';
   document.querySelector('meta[name="description"]').setAttribute('content',excerpt.slice(0,160));
   hero.innerHTML='<div class="tag">♥ MedLife Knowledge</div><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(excerpt)+'</p><div class="meta"><i class="fa-solid fa-user"></i> '+esc(article.author_name||'MedLife')+' &nbsp; • &nbsp; '+esc(formatDate(article.created_at))+'</div>';
   body.innerHTML=(article.excerpt_ar?'<div class="intro"><strong>مقدمة</strong><br>'+esc(article.excerpt_ar)+'</div>':'')+renderContent(article.content_ar||article.content_en||'')+'<div class="meta" style="margin-top:35px">ID: '+esc(article.id)+' · '+esc(article.category||'Medical Knowledge')+'</div>';
 }catch(e){hero.innerHTML='<div class="state"><i class="fa-solid fa-circle-exclamation"></i><div>'+esc(e.message)+'</div></div>';body.innerHTML='<div class="state"><a class="back" href="articles.html">العودة إلى المقالات</a></div>';}
}
load();
})();
</script>
</body>
</html>
