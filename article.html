<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta id="metaDescription" name="description" content="المعرفة الطبية والتوعوية من مؤسسة ميدلايف الطبية الخيرية التطوعية.">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#FF2A54;--red-dark:#E51E46;--navy:#151D36;--white:#fff;--light:#F7F9FC;--text:#1E293B;--muted:#64748B;--border:#E2E8F0;--green:#08704f;--shadow:0 18px 45px rgba(21,29,54,.10);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--light);color:var(--text);font-family:Cairo,Arial,sans-serif;line-height:1.9}a{text-decoration:none;color:inherit}.container{width:min(1180px,calc(100% - 32px));margin:auto}
header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-bottom:1px solid rgba(21,29,54,.08)}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{height:52px}.back{color:var(--red);font-weight:900;font-size:13px}
.hero{padding:70px 0 55px;background:radial-gradient(circle at 90% 10%,rgba(255,42,84,.12),transparent 30%),linear-gradient(135deg,#fff,#f7f9fc)}.hero-inner{text-align:center;max-width:920px;margin:auto}.tag{color:var(--red);font-weight:900;font-size:13px}.hero h1{margin:12px 0 18px;color:var(--navy);font-size:clamp(32px,5vw,56px);line-height:1.3}.excerpt{max-width:850px;margin:auto;color:var(--muted);font-size:17px}.meta{margin-top:20px;color:#7b8794;font-size:12px}.hero-image{display:block;width:min(100%,940px);max-height:430px;object-fit:cover;border-radius:24px;margin:28px auto 0;border:1px solid var(--border);box-shadow:var(--shadow)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start;margin:40px auto 80px}.article{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(24px,5vw,70px);overflow:hidden}.article .intro{background:#eef4ff;border:1px solid #d8e6ff;border-radius:18px;padding:20px 22px;margin-bottom:28px}.article h2{color:var(--navy);font-size:28px;line-height:1.5;margin:42px 0 18px;padding-right:16px;border-right:4px solid var(--red);scroll-margin-top:100px}.article h3{color:var(--navy);font-size:21px;line-height:1.5;margin:28px 0 12px}.article p{font-size:16px;line-height:2.15;margin:0 0 20px}.article ul,.article ol{padding-right:28px;margin:10px 0 25px}.article li{margin-bottom:10px;line-height:2}.article blockquote{margin:20px 0;padding:16px 20px;background:#fff6f7;border:1px solid #ffd6de;border-radius:16px}.warning{background:#fff7ed;border:1px solid #fed7aa;border-radius:18px;padding:20px;margin:24px 0}.good{background:#ecfdf5;border:1px solid #b7e4cf;border-radius:18px;padding:20px;margin:24px 0}.medlife-box{background:linear-gradient(135deg,#fff7fa,#fff);border:1px solid #ffd6e0;border-radius:18px;padding:22px;margin:26px 0}.table-wrap{overflow:auto;margin:22px 0}.article table{width:100%;border-collapse:collapse;min-width:680px;font-size:14px}.article th{background:var(--navy);color:#fff;padding:12px;text-align:right}.article td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}.article tr:nth-child(even) td{background:#fbfcfe}.refs{border-top:1px solid var(--border);margin-top:44px;padding-top:28px}.refs ol{padding-right:26px}.refs a{color:#2563eb;word-break:break-word}
.toc{position:sticky;top:95px;background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 28px rgba(21,29,54,.06);padding:16px}.toc h3{margin:0 0 10px;color:var(--navy);font-size:15px}.toc a{display:block;padding:8px 9px;border-radius:10px;color:var(--muted);font-size:11px}.toc a:hover{background:#fff4f6;color:var(--red)}.author-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:14px}.author-card strong{display:block;color:var(--navy);font-size:12px}.author-card span{color:var(--muted);font-size:10px}
.state{min-height:45vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:var(--muted)}.state i{font-size:38px;color:var(--red);margin-bottom:12px}.error-title{color:var(--navy);font-size:24px;font-weight:900;margin-bottom:8px}
footer{background:#0D1222;color:#fff;text-align:center;padding:35px 20px;font-size:12px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.toc{position:static;order:-1}.toc a{display:inline-block;margin:3px}.author-card{display:none}}@media(max-width:600px){.hero{padding:48px 0}.excerpt{font-size:15px}.article p{font-size:15px}.article h2{font-size:24px}.logo{height:46px}}
</style>
</head>
<body>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section id="hero" class="hero" style="display:none"><div class="container hero-inner"><div class="tag">♥ MedLife Knowledge</div><h1 id="title"></h1><p id="excerpt" class="excerpt"></p><div id="meta" class="meta"></div><img id="heroImage" class="hero-image" alt="" style="display:none"></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جارٍ تحميل المقال...</div></div><div id="error" class="state" style="display:none"><i class="fa-regular fa-newspaper"></i><div id="errorTitle" class="error-title">تعذر تحميل المقال</div><p id="errorText">حاول تحديث الصفحة لاحقًا.</p></div><div id="contentLayout" class="layout" style="display:none"><article class="article"><div id="articleBody"></div><div id="refs" class="refs" style="display:none"></div></article><aside><nav id="toc" class="toc"><h3>📚 فهرس المقال</h3><div id="tocLinks"></div><div id="authorCard" class="author-card" style="display:none"></div></nav></aside></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we are med.life</footer>
<script>
(() => {
  const params=new URLSearchParams(location.search);
  const id=params.get('id');
  const staticFallback='articles/tension-headache.html';
  const $=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
  const normalize=v=>String(v??'').replace(/\r/g,'').trim();
  const safeUrl=v=>{try{const u=new URL(String(v||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
  function showError(title,text){$('loading').style.display='none';$('error').style.display='flex';$('errorTitle').textContent=title;$('errorText').textContent=text}
  function formatDate(v){if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'})}
  function inline(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
  function renderTable(lines){const rows=lines.map(x=>x.split('|').map(c=>c.trim()).filter(Boolean)).filter(r=>r.length>=2);if(rows.length<2)return '';const head=rows[0];const body=rows.slice(1);return '<div class="table-wrap"><table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>'+body.map(r=>'<tr>'+head.map((_,i)=>'<td>'+inline(r[i]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
  function renderContent(raw){
    const text=normalize(raw); if(!text)return '<p>لا يوجد محتوى منشور لهذا المقال.</p>';
    const lines=text.split('\n'); let html='',toc=[],i=0;
    let inUl=false,inOl=false,table=[];
    const flushLists=()=>{if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}};
    const flushTable=()=>{if(table.length){html+=renderTable(table);table=[]}};
    for(let n=0;n<lines.length;n++){
      const line=lines[n].trim();
      if(!line){flushLists();flushTable();continue}
      if(/^\|.*\|$/.test(line)){flushLists();table.push(line.slice(1,-1));continue}
      flushTable();
      let m=line.match(/^#{1,4}\s*(.+)$/)||line.match(/^(?:([0-9٠-٩]{1,2})[.)ـ:-])\s*(.+)$/);
      if(m){flushLists();const heading=m[2]||m[1];const id='sec-'+i++;toc.push({id,text:heading});html+='<h2 id="'+id+'">'+inline(heading)+'</h2>';continue}
      m=line.match(/^(?:[-*•]\s+)(.+)$/);if(m){if(inOl){html+='</ol>';inOl=false}if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inline(m[1])+'</li>';continue}
      m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(inUl){html+='</ul>';inUl=false}if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inline(m[1])+'</li>';continue}
      const isWarning=/علامات الخطر|تحذير طبي|طوارئ|يُمنع|منع الحمل تماماً|تستدعي تقييماً طبياً عاجلاً/i.test(line);
      const isGood=/كلمة ميدلايف|الخلاصة|نصيحتنا/i.test(line);
      if(isWarning){flushLists();html+='<blockquote class="warning">'+inline(line)+'</blockquote>';continue}
      if(isGood){flushLists();html+='<div class="medlife-box">'+inline(line)+'</div>';continue}
      html+='<p>'+inline(line)+'</p>';
    }
    flushLists();flushTable();
    return {html,toc};
  }
  function renderRefsFromContent(content){
    const m=String(content||'').match(/(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*([\s\S]*)$/i); if(!m)return '';
    const items=m[1].split('\n').map(x=>x.trim()).filter(Boolean).filter(x=>/^\d+[.)]/.test(x)); if(!items.length)return '';
    return '<h3>📚 المصادر والمراجع</h3><ol>'+items.map(x=>'<li>'+inline(x.replace(/^\d+[.)]\s*/,''))+'</li>').join('')+'</ol>';
  }
  async function load(){
    if(!id){location.href=staticFallback;return}
    try{
      const r=await fetch('/api/articles',{headers:{Accept:'application/json'},cache:'no-store'});
      const d=await r.json(); if(!r.ok||!d.success)throw new Error(d.error||'API error');
      const article=(d.articles||[]).find(a=>String(a.id)===String(id)&&String(a.status).toLowerCase()==='published');
      if(!article){showError('المقال غير موجود','لم يتم العثور على مقال منشور بالمعرّف '+id+'.');return}
      $('loading').style.display='none';$('hero').style.display='block';$('contentLayout').style.display='grid';
      document.title=(article.title_ar||article.title_en||'المقال')+' | MedLife Syria';
      $('metaDescription').setAttribute('content',article.excerpt_ar||article.excerpt_en||'المعرفة الطبية من MedLife Syria.');
      $('title').textContent=article.title_ar||article.title_en||'بدون عنوان';
      $('excerpt').textContent=article.excerpt_ar||article.excerpt_en||'';
      $('meta').innerHTML='<i class="fa-solid fa-user"></i> '+esc(article.author_name||'MedLife')+' &nbsp; • &nbsp; '+esc(formatDate(article.published_at||article.created_at))+' &nbsp; • &nbsp; '+esc(article.category||'Medical Knowledge');
      const img=safeUrl(article.image_url); if(img){$('heroImage').src=img;$('heroImage').alt=article.title_ar||'';$('heroImage').style.display='block'}
      const rendered=renderContent(article.content_ar||article.content_en||'');$('articleBody').innerHTML='<div class="intro"><strong>مقدمة</strong><br>'+inline(article.excerpt_ar||article.excerpt_en||'')+'</div>'+rendered.html;
      const refs=renderRefsFromContent(article.content_ar||'');if(refs){$('refs').innerHTML=refs;$('refs').style.display='block'}
      $('tocLinks').innerHTML=rendered.toc.length?rendered.toc.map(x=>'<a href="#'+x.id+'">'+esc(x.text)+'</a>').join(''):'<span style="font-size:11px;color:#64748b">لا توجد أقسام معنونة.</span>';
      if(article.author_name){$('authorCard').innerHTML='<strong>✍️ إعداد المقال</strong><span>'+esc(article.author_name)+'</span>';$('authorCard').style.display='block'}
    }catch(e){showError('تعذر تحميل المقال','حدث خطأ أثناء جلب المقال. حاول تحديث الصفحة لاحقًا.')}
  }
  load();
})();
</script>
</body>
</html>
