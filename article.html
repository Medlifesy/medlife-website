<script>

document.addEventListener(
    "DOMContentLoaded",
    loadArticle
);


async function loadArticle() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    const id =
        params.get("id");


    if (!id) {

        showError();

        return;
    }


    try {

        const response =
            await fetch(
                `/api/articles?id=${encodeURIComponent(id)}`,
                {
                    method:
                        "GET",

                    headers: {
                        "Accept":
                            "application/json"
                    },

                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success ||
            !data.article
        ) {

            throw new Error(
                data.error ||
                "Article not found."
            );

        }


        renderArticle(
            data.article
        );


    } catch (error) {

        console.error(
            "MedLife article error:",
            error
        );


        showError();

    }

}


function renderArticle(
    article
) {

    const title =
        article.title_ar ||
        article.title_en ||
        "بدون عنوان";


    const excerpt =
        article.excerpt_ar ||
        article.excerpt_en ||
        "";


    document.title =
        `${title} | MedLife Syria`;


    document.getElementById(
        "articleTitle"
    ).textContent =
        title;


    document.getElementById(
        "articleExcerpt"
    ).textContent =
        excerpt;


    document.getElementById(
        "articleCategory"
    ).textContent =
        article.category ||
        "MedLife Knowledge";


    document.getElementById(
        "articleMeta"
    ).innerHTML = `

        <span>

            <i class="fa-solid fa-user"></i>

            ${escapeHtml(
                article.author_name ||
                "MedLife"
            )}

        </span>


        <span>

            <i class="fa-regular fa-calendar"></i>

            ${formatDate(
                article.created_at
            )}

        </span>

    `;


    renderCover(
        article.image_url
    );


    const body =
        document.getElementById(
            "articleBody"
        );


    body.innerHTML =
        formatArticleContent(
            article.content_ar ||
            article.content_en ||
            ""
        );


    document.getElementById(
        "articleLoading"
    ).style.display =
        "none";


    body.style.display =
        "block";

}


function renderCover(
    imageUrl
) {

    const cover =
        document.getElementById(
            "articleCover"
        );


    if (!imageUrl) {

        return;
    }


    const safeImage =
        escapeAttribute(
            imageUrl
        );


    cover.innerHTML = `

        <img
            src="${safeImage}"
            alt="صورة المقال"
            loading="eager">

    `;

}


function formatArticleContent(
    content
) {

    const safe =
        escapeHtml(
            String(
                content || ""
            )
        );


    const lines =
        safe.split(
            /\r?\n/
        );


    let html =
        "";


    let inList =
        false;


    for (
        const line of lines
    ) {

        const trimmed =
            line.trim();


        if (!trimmed) {

            if (inList) {

                html +=
                    "</ul>";

                inList =
                    false;

            }

            continue;
        }


        /*
         * Markdown-style H2:
         *
         * ## Heading
         */

        if (
            trimmed.startsWith("## ")
        ) {

            if (inList) {

                html +=
                    "</ul>";

                inList =
                    false;

            }


            html += `

                <h2>

                    ${trimmed
                        .replace(
                            /^## /,
                            ""
                        )}

                </h2>

            `;

            continue;
        }


        /*
         * Markdown-style bullet:
         *
         * - item
         */

        if (
            trimmed.startsWith("- ")
        ) {

            if (!inList) {

                html +=
                    "<ul>";

                inList =
                    true;

            }


            html += `

                <li>

                    ${trimmed
                        .replace(
                            /^- /,
                            ""
                        )}

                </li>

            `;

            continue;
        }


        if (inList) {

            html +=
                "</ul>";

            inList =
                false;

        }


        html += `

            <p>

                ${trimmed}

            </p>

        `;

    }


    if (inList) {

        html +=
            "</ul>";

    }


    return html;

}


function formatDate(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleDateString(
        "ar-SY",
        {
            year:
                "numeric",

            month:
                "long",

            day:
                "numeric"
        }
    );

}


function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    );

}


function showError() {

    document.getElementById(
        "articleLoading"
    ).style.display =
        "none";


    document.getElementById(
        "articleError"
    ).style.display =
        "block";

}

</script>


</body>

</html>
