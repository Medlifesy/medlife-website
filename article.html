<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>المقال | MedLife Syria</title>
<meta name="description" content="مقال طبي من MedLife Syria">
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="article-reading.css">
</head>
<body>
<header><div class="container nav"><a class="back" href="articles.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المقالات</a><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife Syria"></a></div></header>
<section class="hero"><div class="container" id="hero"><div class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المقال…</div></div></div></section>
<main class="container"><div id="loading" class="state"><i class="fa-solid fa-spinner fa-spin"></i><div>جاري تحميل المحتوى…</div></div><div id="error" class="state" style="display:none"></div><div id="layout" class="layout" style="display:none"><article class="article"><div id="body"></div><div id="refs" class="refs" style="display:none"></div></article><aside><nav class="toc"><strong>📚 فهرس المقال</strong><div id="tocLinks"></div></nav></aside></div></main>
<footer>MedLife Syria — مؤسسة ميدلايف الطبية الخيرية التطوعية<br>We save life, we are med.life</footer>
<script>
(function(){
'use strict';
const id=new URLSearchParams(location.search).get('id');
const $=x=>document.getElementById(x);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const safeUrl=v=>{try{const u=new URL(String(v||''),location.origin);return ['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}};
const date=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'});};
const inline=v=>esc(v).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
function splitRefs(text){const m=String(text||'').match(/(?:^|\n)\s*(?:المصادر والمراجع|المصادر العلمية|المراجع العلمية|المراجع)\s*\n([\s\S]*)$/i);if(!m)return {main:String(text||''),items:[]};return {main:String(text).slice(0,m.index).trim(),items:m[1].split(/\n(?=\s*\d+[.)])/).map(x=>x.trim()).filter(Boolean)};}
function render(raw){
 const p=splitRefs(raw),lines=p.main.replace(/\r/g,'').split('\n');let html='',heads=[],n=0,inUl=false,inOl=false;
 const close=()=>{if(inUl){html+='</ul>';inUl=false}if(inOl){html+='</ol>';inOl=false}};
 for(const rawLine of lines){
  const line=rawLine.trim();if(!line){close();continue;}
  let m=line.match(/^#{1,4}\s*(.+)$/)||line.match(/^(\d{1,2}|[٠-٩]{1,2})[.)ـ:-]\s*(.+)$/);
  if(m){close();const title=m[2]||m[1],hid='sec-'+n++;heads.push({id:hid,title});html+='<h2 id="'+hid+'">'+inline(title)+'</h2>';continue;}
  m=line.match(/^[-*•]\s+(.+)$/);if(m){if(inOl){html+='</ol>';inOl=false}if(!inUl){html+='<ul>';inUl=true}html+='<li>'+inline(m[1])+'</li>';continue;}
  m=line.match(/^\d+[.)]\s+(.+)$/);if(m){if(inUl){html+='</ul>';inUl=false}if(!inOl){html+='<ol>';inOl=true}html+='<li>'+inline(m[1])+'</li>';continue;}
  close();
  const warning=/علامات الخطر|تحذير طبي|تستدعي تقييماً طبياً عاجلاً|الحالات التي يمنع/.test(line);
  const good=/كلمة ميدلايف|الخلاصة|نصيحة ميدلايف/.test(line);
  if(warning) html+='<div class="warning"><p>'+inline(line)+'</p></div>';
  else if(good) html+='<div class="good"><p>'+inline(line)+'</p></div>';
  else html+='<p>'+inline(line)+'</p>';
 }
 close();
 const toc=heads.length?heads.map((h,i)=>'<a href="#'+h.id+'">'+String(i+1).padStart(2,'0')+' · '+esc(h.title)+'</a>').join(''):'<span style="font-size:12px;color:#667085">لا توجد أقسام معنونة.</span>';
 const refs=p.items.length?'<h2>📚 المصادر والمراجع</h2><ol>'+p.items.map(x=>'<li>'+inline(x)+'</li>').join('')+'</ol>':'';
 return {html,toc,refs};
}
async function load(){
 if(!id){location.replace('articles/tension-headache.html');return;}
 try{
  const r=await fetch('/api/article-public?id='+encodeURIComponent(id),{headers:{Accept:'application/json'},cache:'no-store'});
  const data=await r.json();
  if(!r.ok||!data.success||!data.article)throw new Error(data.error||'تعذر تحميل المقال');
  const a=data.article,title=a.title_ar||a.title_en||'مقال MedLife',excerpt=a.excerpt_ar||a.excerpt_en||'';
  document.title=title+' | MedLife Syria';
  document.querySelector('meta[name="description"]').setAttribute('content',excerpt.slice(0,160));
  const img=safeUrl(a.image_url);
  $('hero').innerHTML='<div class="tag">♥ MedLife Knowledge</div><h1>'+esc(title)+'</h1><p class="excerpt">'+esc(excerpt)+'</p><div class="meta"><i class="fa-solid fa-user"></i> '+esc(a.author_name||'MedLife')+' &nbsp; • &nbsp; '+esc(date(a.published_at||a.created_at))+' &nbsp; • &nbsp; '+esc(a.category||'Medical Knowledge')+'</div>'+(img?'<img class="hero-image" src="'+esc(img)+'" alt="'+esc(title)+'">':'');
  const out=render(a.content_ar||a.content_en||'');
  $('body').innerHTML=(excerpt?'<div class="intro"><strong>مقدمة</strong><br>'+esc(excerpt)+'</div>':'')+out.html+'<div class="meta" style="margin-top:35px">'+esc(a.category||'Medical Knowledge')+'</div>';
  if(out.refs){$('refs').innerHTML=out.refs;$('refs').style.display='block';}
  $('tocLinks').innerHTML=out.toc;
  $('loading').style.display='none';$('layout').style.display='grid';
 }catch(e){$('loading').style.display='none';$('error').style.display='block';$('error').innerHTML='<i class="fa-solid fa-circle-exclamation"></i><h2 style="color:#18223b">تعذر تحميل المقال</h2><p>'+esc(e.message||'حدث خطأ أثناء جلب المقال.')+'</p><p><a class="back" href="articles.html">العودة إلى المقالات</a></p>';}
}
load();
})();
</script>
</body>
</html>
