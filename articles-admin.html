<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife | إدارة المقالات</title><link rel="icon" href="logo.PNG"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--red:#e51f45;--navy:#12203a;--ink:#243047;--muted:#6b778c;--bg:#f6f8fb;--line:#e5eaf1;--green:#087f5b;--shadow:0 18px 50px rgba(18,32,58,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,sans-serif}.hidden{display:none!important}.container{width:min(1240px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.nav{height:76px;display:flex;align-items:center;justify-content:space-between}.logo{height:50px}.nav-actions{display:flex;gap:8px;align-items:center}.btn{border:0;border-radius:12px;padding:10px 15px;font:800 12px Cairo;cursor:pointer}.btn.primary{background:var(--red);color:#fff}.btn.soft{background:#eef2f7;color:var(--navy)}.btn.green{background:#e8f8f2;color:var(--green)}.btn.danger{background:#ffeded;color:#b42335}.hero{padding:34px 0 18px}.hero h1{margin:0;color:var(--navy);font-size:30px}.hero p{margin:5px 0;color:var(--muted);font-size:13px}.login-card,.panel,.editor{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}.login-card{width:min(500px,100%);margin:70px auto;padding:30px}.login-card h2{margin:0;color:var(--navy)}.sub{color:var(--muted);font-size:12px;line-height:2}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--navy);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:0;background:#fbfcfe}.field input:focus,.field textarea:focus{border-color:#ffb6c3;box-shadow:0 0 0 3px rgba(229,31,69,.06)}.msg{margin-top:12px;padding:11px;border-radius:11px;font-size:12px;line-height:1.8}.msg.error{background:#fff0f2;color:#a51e2d}.msg.ok{background:#eaf8f2;color:#08704f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;color:var(--navy);font-size:28px}.toolbar{display:grid;grid-template-columns:1fr 190px auto;gap:10px;margin:18px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;background:#fff}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:920px}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-size:12px}.table th{background:#fafbfd;color:var(--navy);font-weight:900}.title{font-weight:800;color:var(--navy)}.status{display:inline-block;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900}.pending{background:#fff4e8;color:#b65c00}.draft{background:#eef2ff;color:#4655a6}.published{background:#e8f8f2;color:#08704f}.rejected{background:#ffeded;color:#ad2638}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions .btn{padding:7px 9px;font-size:10px}.role{background:#f0f3f8;color:var(--navy);border-radius:999px;padding:5px 10px;font-size:10px;font-weight:900}.empty{text-align:center;color:var(--muted);padding:35px}.editor{margin:20px 0;padding:22px}.editor h2{margin:0;color:var(--navy)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.editor textarea{min-height:190px}.editor-footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.toolbar,.grid{grid-template-columns:1fr}.full{grid-column:auto}.nav{height:68px}.logo{height:44px}}</style></head><body><header><div class="container nav"><a href="/"><img class="logo" src="logo.PNG" alt="MedLife"></a><div class="nav-actions"><span id="userBadge" class="role hidden"></span><button id="logout" class="btn soft hidden">تسجيل الخروج</button><a href="articles.html" class="btn soft">المقالات</a></div></div></header><main class="container"><section id="loginSection" class="login-card"><h2>دخول إدارة المقالات</h2><p class="sub">استخدم حساب MedLife الذي يملك دور <b>admin</b> أو <b>editor</b> أو <b>reviewer</b>. تم إلغاء مفتاح API من واجهة الإدارة.</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" placeholder="اسم المستخدم"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور"></div><button id="login" class="btn primary" style="width:100%">تسجيل الدخول</button><div id="loginMsg"></div></section><section id="dashboard" class="hidden"><section class="hero"><h1>لوحة إدارة المقالات</h1><p>مراجعة وتحرير ونشر محتوى MedLife من مكان واحد.</p></section><div class="stats"><div class="stat"><small>الإجمالي</small><strong id="total">0</strong></div><div class="stat"><small>قيد المراجعة</small><strong id="pending">0</strong></div><div class="stat"><small>منشور</small><strong id="published">0</strong></div><div class="stat"><small>مرفوض</small><strong id="rejected">0</strong></div></div><div class="toolbar"><input id="search" placeholder="بحث بالعنوان أو الكاتب"><select id="filter"><option value="all">كل الحالات</option><option value="pending">قيد المراجعة</option><option value="draft">مسودة</option><option value="published">منشور</option><option value="rejected">مرفوض</option></select><button id="refresh" class="btn primary">تحديث</button></div><div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>العنوان</th><th>الكاتب</th><th>التصنيف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div><section id="editor" class="editor hidden"><h2 id="editorTitle">تحرير المقال</h2><p id="editorMeta" class="sub"></p><div class="grid"><div class="field"><label>العنوان العربي</label><input id="title_ar"></div><div class="field"><label>العنوان الإنجليزي</label><input id="title_en"></div><div class="field"><label>التصنيف</label><input id="category"></div><div class="field"><label>اسم الكاتب</label><input id="author_name"></div><div class="field"><label>البريد الإلكتروني للكاتب</label><input id="author_email"></div><div class="field"><label>رابط الصورة</label><input id="image_url"></div><div class="field full"><label>الملخص العربي</label><textarea id="excerpt_ar" style="min-height:110px"></textarea></div><div class="field full"><label>الملخص الإنجليزي</label><textarea id="excerpt_en" style="min-height:110px"></textarea></div><div class="field full"><label>المحتوى العربي</label><textarea id="content_ar"></textarea></div><div class="field full"><label>المحتوى الإنجليزي</label><textarea id="content_en"></textarea></div></div><div id="editMsg"></div><div class="editor-footer"><button id="save" class="btn primary">حفظ كمراجعة</button><button id="publish" class="btn green">حفظ ونشر</button><button id="draft" class="btn soft">حفظ كمسودة</button><button id="reject" class="btn danger">رفض</button><button id="close" class="btn soft">إغلاق</button></div></section></section></main><script>
const $=id=>document.getElementById(id);let me=null,articles=[],selected=null;const labels={pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'};
async function session(action='me',method='GET',body=null){const r=await fetch('/api/article-admin-session?action='+action,{method,credentials:'include',headers:{Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ العملية.');return d}
async function api(url,options={}){const r=await fetch(url,{...options,credentials:'include',headers:{Accept:'application/json',...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ العملية.');return d}
function showLogin(){$('loginSection').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('userBadge').classList.add('hidden')}
function showDashboard(){$('loginSection').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('userBadge').classList.remove('hidden');$('userBadge').textContent=(me.display_name||me.username)+' · '+me.role;if(me.role==='editor'){$('publish').classList.add('hidden');$('reject').classList.add('hidden')}if(me.role==='reviewer')$('save').classList.add('hidden')}
async function boot(){try{const d=await session();me=d.admin;showDashboard();await load()}catch{showLogin()}}
$('login').onclick=async()=>{try{$('login').disabled=true;const d=await session('login','POST',{identifier:$('username').value.trim(),password:$('password').value});me=d.admin;showDashboard();await load()}catch(e){msg($('loginMsg'),e.message,'error')}finally{$('login').disabled=false}};$('password').onkeydown=e=>{if(e.key==='Enter')$('login').click()};$('logout').onclick=async()=>{await session('logout','POST');location.reload()};$('refresh').onclick=load;$('filter').onchange=render;$('search').oninput=render;$('close').onclick=closeEditor;$('save').onclick=()=>save('pending');$('publish').onclick=()=>save('published');$('draft').onclick=()=>save('draft');$('reject').onclick=reject;
async function load(){try{const d=await api('/api/articles?admin=1');me=d.admin||me;articles=d.articles||[];$('total').textContent=d.summary?.total||0;$('pending').textContent=d.summary?.pending||0;$('published').textContent=d.summary?.published||0;$('rejected').textContent=d.summary?.rejected||0;render()}catch(e){if(e.message.includes('غير مصرح'))showLogin();else alert(e.message)}}
function render(){const q=$('search').value.trim().toLowerCase(),s=$('filter').value;const list=articles.filter(a=>(s==='all'||a.status===s)&&(!q||[a.title_ar,a.title_en,a.author_name,a.author_email].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').innerHTML=list.length?list.map(a=>`<tr><td>${date(a.created_at)}</td><td><div class="title">${esc(a.title_ar)}</div></td><td>${esc(a.author_name||'-')}</td><td>${esc(a.category||'-')}</td><td><span class="status ${esc(a.status)}">${labels[a.status]||esc(a.status)}</span></td><td><div class="actions"><button class="btn soft" onclick="editArticle(${a.id})">تحرير</button>${a.status!=='published'&&me.role!=='editor'?`<button class="btn green" onclick="quick(${a.id},'published')">نشر</button>`:''}${me.role==='admin'?`<button class="btn danger" onclick="removeArticle(${a.id})">حذف</button>`:''}</div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد مقالات مطابقة.</td></tr>'}
window.editArticle=id=>{selected=articles.find(a=>Number(a.id)===Number(id));if(!selected)return;$('editor').classList.remove('hidden');$('editorTitle').textContent=selected.title_ar||'تحرير المقال';$('editorMeta').textContent='ID '+selected.id+' · الحالة: '+(labels[selected.status]||selected.status);['title_ar','title_en','category','author_name','author_email','image_url','excerpt_ar','excerpt_en','content_ar','content_en'].forEach(k=>$(k).value=selected[k]||'');window.scrollTo({top:$('editor').offsetTop-85,behavior:'smooth'})};
async function save(status){if(!selected)return;try{const body={id:selected.id,status};['title_ar','title_en','category','author_name','author_email','image_url','excerpt_ar','excerpt_en','content_ar','content_en'].forEach(k=>body[k]=$(k).value);const d=await api('/api/articles',{method:'PUT',body:JSON.stringify(body)});msg($('editMsg'),d.message,'ok');await load()}catch(e){msg($('editMsg'),e.message,'error')}}
async function quick(id,status){const a=articles.find(x=>Number(x.id)===Number(id));if(!a)return;try{await api('/api/articles',{method:'PUT',body:JSON.stringify({id,status,title_ar:a.title_ar,title_en:a.title_en,content_ar:a.content_ar,content_en:a.content_en,excerpt_ar:a.excerpt_ar,excerpt_en:a.excerpt_en,author_name:a.author_name,author_email:a.author_email,category:a.category,image_url:a.image_url})});await load()}catch(e){alert(e.message)}}
async function reject(){if(!selected)return;const reason=prompt('اكتب سبب الرفض:');if(reason===null)return;try{const d=await api('/api/articles',{method:'PUT',body:JSON.stringify({id:selected.id,status:'rejected',rejection_reason:reason,title_ar:$('title_ar').value,title_en:$('title_en').value,content_ar:$('content_ar').value,content_en:$('content_en').value,excerpt_ar:$('excerpt_ar').value,excerpt_en:$('excerpt_en').value,author_name:$('author_name').value,author_email:$('author_email').value,category:$('category').value,image_url:$('image_url').value})});msg($('editMsg'),d.message,'ok');await load();closeEditor()}catch(e){msg($('editMsg'),e.message,'error')}}
async function removeArticle(id){if(!confirm('حذف المقال نهائيًا؟'))return;try{await api('/api/articles?id='+encodeURIComponent(id),{method:'DELETE'});await load();closeEditor()}catch(e){alert(e.message)}}function closeEditor(){selected=null;$('editor').classList.add('hidden');$('editMsg').innerHTML=''}function msg(el,t,c){el.className='msg '+c;el.textContent=t}function date(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'short',day:'numeric'})}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}boot();
</script></body></html>
