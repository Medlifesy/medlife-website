<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MedLife | إدارة المقالات</title>
<link rel="icon" href="logo.PNG">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--red:#ff2a54;--navy:#151d36;--bg:#f7f9fc;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--green:#059669;--orange:#ea580c;--shadow:0 15px 40px rgba(21,29,54,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,sans-serif}.container{width:min(1250px,calc(100% - 32px));margin:auto}header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between}.logo{height:50px}.back{color:var(--red);font-weight:800;text-decoration:none}.hero{padding:35px 0 20px}.hero h1{margin:0;color:var(--navy)}.hero p{color:var(--muted)}.login,.panel,.editor{background:#fff;border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.login{max-width:500px;margin:35px auto}.hidden{display:none!important}label{display:block;font-weight:800;margin:10px 0 7px}input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;font:inherit;outline:0}textarea{min-height:180px;resize:vertical}button{border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#eef2f7;color:var(--navy)}.success{background:#ecfdf5;color:#047857}.danger{background:#fee2e2;color:#b91c1c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:18px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:28px;color:var(--navy)}.filters{display:grid;grid-template-columns:1fr 220px auto;gap:10px;margin-bottom:18px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:18px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:13px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top}.table th{background:#fbfcfe;color:var(--navy)}.status{display:inline-block;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800}.pending{background:#fff7ed;color:#c2410c}.published{background:#ecfdf5;color:#047857}.rejected{background:#fee2e2;color:#b91c1c}.draft{background:#eef2ff;color:#4338ca}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:11px}.editor{margin-top:20px}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.notice{padding:12px;border-radius:10px;margin-top:12px}.error{background:#fee2e2;color:#991b1b}.ok{background:#ecfdf5;color:#047857}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters,.editor-grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="container nav"><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife"></a><a class="back" href="articles.html">العودة إلى المقالات <i class="fa-solid fa-arrow-left"></i></a></div></header>
<main class="container">
<section class="hero"><h1>إدارة مقالات MedLife</h1><p>مراجعة وتحرير ونشر المقالات المرسلة إلى فريق المقالات.</p></section>
<section class="login" id="loginBox"><label for="adminKey">مفتاح مشرف المقالات</label><input id="adminKey" type="password" autocomplete="current-password" placeholder="أدخل مفتاح مشرف المقالات"><button class="primary" id="loginBtn" style="width:100%;margin-top:12px">دخول</button><div id="loginMsg"></div></section>
<section id="dashboard" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0;color:var(--navy)">طلبات المقالات</h2><p style="margin:4px 0;color:var(--muted)">يمكنك تعديل المقال قبل نشره أو رفضه مع ذكر السبب.</p></div><button class="secondary" id="logout">تسجيل الخروج</button></div>
<div class="stats"><div class="stat"><small>الإجمالي</small><strong id="total">0</strong></div><div class="stat"><small>قيد المراجعة</small><strong id="pending">0</strong></div><div class="stat"><small>منشور</small><strong id="published">0</strong></div><div class="stat"><small>مرفوض</small><strong id="rejected">0</strong></div></div>
<div class="filters"><input id="search" placeholder="بحث بالعنوان أو الكاتب"><select id="status"><option value="all">كل الحالات</option><option value="pending">قيد المراجعة</option><option value="draft">مسودة</option><option value="published">منشور</option><option value="rejected">مرفوض</option></select><button class="primary" id="refresh">تحديث</button></div>
<div class="table-wrap"><table class="table"><thead><tr><th>التاريخ</th><th>العنوان</th><th>الكاتب</th><th>التصنيف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table></div>
<section class="editor hidden" id="editor"><h2 id="editorHeading" style="margin-top:0;color:var(--navy)">تحرير المقال</h2><div class="editor-grid"><div><label>العنوان العربي</label><input id="title_ar"></div><div><label>العنوان الإنجليزي</label><input id="title_en"></div><div><label>التصنيف</label><input id="category"></div><div><label>اسم الكاتب</label><input id="author_name"></div><div class="full"><label>الملخص العربي</label><textarea id="excerpt_ar" style="min-height:100px"></textarea></div><div class="full"><label>الملخص الإنجليزي</label><textarea id="excerpt_en" style="min-height:100px"></textarea></div><div class="full"><label>المحتوى العربي</label><textarea id="content_ar"></textarea></div><div class="full"><label>المحتوى الإنجليزي</label><textarea id="content_en"></textarea></div></div><div id="editMsg"></div><div class="editor-actions"><button class="primary" id="save">حفظ التعديلات</button><button class="success" id="publish">حفظ ونشر</button><button class="secondary" id="draft">حفظ كمسودة</button><button class="danger" id="reject">رفض المقال</button><button class="secondary" id="cancel">إغلاق</button></div></section>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let key=sessionStorage.getItem('medlife_articles_admin_key')||'',articles=[],selected=null;
const labels={pending:'قيد المراجعة',draft:'مسودة',published:'منشور',rejected:'مرفوض'};
$('loginBtn').onclick=login;$('adminKey').onkeydown=e=>{if(e.key==='Enter')login()};$('logout').onclick=()=>{sessionStorage.removeItem('medlife_articles_admin_key');location.reload()};$('refresh').onclick=load;$('status').onchange=render;$('search').oninput=render;$('cancel').onclick=closeEditor;$('save').onclick=()=>saveEdit('pending');$('publish').onclick=()=>saveEdit('published');$('draft').onclick=()=>saveEdit('draft');$('reject').onclick=reject;
async function api(url,options={}){const r=await fetch(url,{...options,headers:{Accept:'application/json',Authorization:`Bearer ${key}`,...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok||!d.success)throw Error(d.error||'تعذر تنفيذ العملية.');return d}
async function login(){key=$('adminKey').value.trim();if(!key)return msg($('loginMsg'),'أدخل المفتاح.','error');try{await load();sessionStorage.setItem('medlife_articles_admin_key',key);$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden')}catch(e){msg($('loginMsg'),e.message,'error')}}
async function load(){const d=await api('/api/articles?admin=1');articles=d.articles||[];$('total').textContent=d.summary?.total||0;$('pending').textContent=d.summary?.pending||0;$('published').textContent=d.summary?.published||0;$('rejected').textContent=d.summary?.rejected||0;render()}
function render(){const q=$('search').value.trim().toLowerCase(),s=$('status').value;const list=articles.filter(a=>(s==='all'||a.status===s)&&(!q||[a.title_ar,a.title_en,a.author_name].some(v=>String(v||'').toLowerCase().includes(q))));$('rows').innerHTML=list.map(a=>`<tr><td>${date(a.created_at)}</td><td><strong>${esc(a.title_ar)}</strong></td><td>${esc(a.author_name)}</td><td>${esc(a.category||'-')}</td><td><span class="status ${esc(a.status)}">${labels[a.status]||a.status}</span></td><td><div class="actions"><button class="secondary" onclick="edit(${a.id})">تحرير</button>${a.status!=='published'?`<button class="success" onclick="quick(${a.id},'published')">نشر</button>`:''}<button class="danger" onclick="removeArticle(${a.id})">حذف</button></div></td></tr>`).join('')}
window.edit=id=>{selected=articles.find(a=>Number(a.id)===Number(id));if(!selected)return;$('editor').classList.remove('hidden');$('editorHeading').textContent=selected.title_ar||'تحرير المقال';['title_ar','title_en','category','author_name','excerpt_ar','excerpt_en','content_ar','content_en'].forEach(k=>$(k).value=selected[k]||'');window.scrollTo({top:$('editor').offsetTop-90,behavior:'smooth'})};
async function saveEdit(status){if(!selected)return;try{const body={id:selected.id,status,title_ar:$('title_ar').value,title_en:$('title_en').value,category:$('category').value,author_name:$('author_name').value,excerpt_ar:$('excerpt_ar').value,excerpt_en:$('excerpt_en').value,content_ar:$('content_ar').value,content_en:$('content_en').value};await api('/api/articles',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});msg($('editMsg'),status==='published'?'تم حفظ التعديلات ونشر المقال.':'تم حفظ التعديلات.','ok');await load()}catch(e){msg($('editMsg'),e.message,'error')}}
async function quick(id,status){selected=articles.find(a=>Number(a.id)===Number(id));if(!selected)return;try{await api('/api/articles',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status})});await load()}catch(e){alert(e.message)}}
async function reject(){if(!selected)return;const reason=prompt('اكتب سبب الرفض:');if(reason===null)return;try{await api('/api/articles',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:selected.id,status:'rejected',rejection_reason:reason})});await load();closeEditor()}catch(e){alert(e.message)}}
async function removeArticle(id){if(!confirm('هل تريد حذف المقال نهائيًا؟'))return;try{await api('/api/articles?id='+encodeURIComponent(id),{method:'DELETE'});await load();closeEditor()}catch(e){alert(e.message)}}
function closeEditor(){selected=null;$('editor').classList.add('hidden');$('editMsg').innerHTML=''}function msg(el,t,c){el.className='notice '+c;el.textContent=t}function date(v){if(!v)return'';const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ar-SY',{year:'numeric',month:'long',day:'numeric'})}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
if(key){$('adminKey').value='••••••••';load().then(()=>{$('loginBox').classList.add('hidden');$('dashboard').classList.remove('hidden')}).catch(()=>{sessionStorage.removeItem('medlife_articles_admin_key');key=''})}
</script>
</body></html>
