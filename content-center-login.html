<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>MedLife | دخول مركز المحتوى</title><link rel="icon" href="./logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--navy:#12203a;--red:#e51f45;--bg:#f4f6fa;--card:#fff;--text:#12203a;--muted:#66748b;--line:#e5eaf1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}.box{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(18,32,58,.09)}.brand{text-align:center;margin-bottom:22px}.brand img{width:64px;height:64px;object-fit:contain}.brand h1{font-size:23px;margin:8px 0 3px}.brand p{font-size:10px;color:var(--muted);margin:0}.field{margin:13px 0}.field label{display:block;font-size:10px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:11px;direction:ltr;text-align:left}.btn{width:100%;border:0;border-radius:11px;padding:12px;background:var(--red);color:#fff;font:inherit;font-size:11px;font-weight:900;cursor:pointer;margin-top:7px}.btn:disabled{opacity:.6}.error{display:none;background:#fff3f1;border:1px solid #f2c3bd;color:#a4261b;padding:9px 11px;border-radius:10px;font-size:9px;margin-top:12px}.hint{margin-top:18px;text-align:center;color:var(--muted);font-size:8px;line-height:1.8}</style></head><body><main class="box"><div class="brand"><img src="./logo.PNG" alt="MedLife"><h1>دخول مركز المحتوى</h1><p>حساب خاص بمسؤول الخلية</p></div><form id="form"><div class="field"><label for="username">اسم المستخدم</label><input id="username" name="username" autocomplete="username" required></div><div class="field"><label for="password">كلمة المرور</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn" id="submit" type="submit">تسجيل الدخول</button><div class="error" id="error"></div></form><div class="hint">الحسابات تُدار مركزياً من Notion ضمن قاعدة<br>Content Center Accounts.</div></main><script>const $=id=>document.getElementById(id);async function boot(){try{const r=await fetch('/api/content-center?action=me',{credentials:'include',cache:'no-store'});if(r.ok){location.replace('/content-center');}}catch{}}$('form').addEventListener('submit',async e=>{e.preventDefault();$('error').style.display='none';$('submit').disabled=true;try{const r=await fetch('/api/content-center?action=login',{method:'POST',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر تسجيل الدخول.');location.replace('/content-center');}catch(err){$('error').textContent=err.message;$('error').style.display='block';}finally{$('submit').disabled=false;}});boot();</script></body></html>
