<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>نسيت كلمة المرور | MedLife</title>
<link rel="icon" href="logo.PNG">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:#ff2a54;--n:#151d36;--b:#e2e8f0;--m:#64748b;--bg:#f7f9fc}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff,var(--bg));color:#1e293b;font-family:Cairo,sans-serif;min-height:100vh;display:flex;flex-direction:column}.wrap{width:min(560px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--b);padding:14px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:50px}.back{color:var(--n);font-weight:800;text-decoration:none}.main{flex:1;display:flex;align-items:center;padding:50px 0}.card{width:100%;background:#fff;border:1px solid var(--b);border-radius:25px;padding:32px;box-shadow:0 22px 65px rgba(21,29,54,.11)}h1{margin:0;color:var(--n);font-size:30px;text-align:center}p{color:var(--m);line-height:1.9}.field{margin-top:20px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--b);border-radius:11px;font:inherit;outline:none}.btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:var(--r);color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.65}.msg{display:none;margin-top:14px;padding:13px;border-radius:10px;font-size:13px}.msg.show{display:block}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#991b1b}.links{text-align:center;margin-top:18px}.links a{color:var(--r);font-weight:800;text-decoration:none}.footer{padding:20px;text-align:center;color:#94a3b8;font-size:11px;background:#fff;border-top:1px solid var(--b)}
</style>
</head>
<body>
<header><div class="wrap nav"><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife"></a><a class="back" href="login.html">العودة لتسجيل الدخول</a></div></header>
<main class="main"><section class="card"><h1>نسيت كلمة المرور؟</h1><p style="text-align:center">أدخل البريد الإلكتروني المرتبط بحسابك في MedLife، وسنرسل لك رابطاً آمناً لإعادة تعيين كلمة المرور.</p><form id="form"><div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email" placeholder="example@email.com"></div><button class="btn" id="submit" type="submit">إرسال رابط إعادة التعيين</button><div id="msg" class="msg"></div></form><div class="links"><a href="login.html">العودة إلى تسجيل الدخول</a></div></section></main>
<footer class="footer">© 2026 MedLife Syria — بالعمل التطوعي نصنع الأثر.</footer>
<script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('email').value.trim();const btn=document.getElementById('submit');const msg=document.getElementById('msg');btn.disabled=true;btn.textContent='⏳ جاري إرسال الرابط...';msg.className='msg';try{const r=await fetch('/api/member-auth-v3?action=forgot',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'same-origin',body:JSON.stringify({email})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'تعذر تنفيذ الطلب حالياً.');msg.className='msg show ok';msg.textContent=j.message||'إذا كان البريد مرتبطاً بحساب MedLife، فسيصلك رابط إعادة التعيين خلال دقائق.'}catch(err){msg.className='msg show err';msg.textContent=err.message||'تعذر تنفيذ الطلب حالياً.'}finally{btn.disabled=false;btn.textContent='إرسال رابط إعادة التعيين'}});
</script>
</body>
</html>
