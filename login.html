<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#151D36"><title>دخول | MedLife</title><link rel="icon" href="logo.PNG"><style>body{margin:0;background:#f7f9fc;color:#151d36;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.card{width:min(430px,calc(100% - 36px));background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:28px;box-shadow:0 18px 50px #151d3614}h1{margin:0 0 8px;font-size:26px}p{color:#64748b;font-size:13px;line-height:1.8}.field{margin:16px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:10px;box-sizing:border-box;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:14px;background:#151d36;color:white;font:inherit;font-weight:800;cursor:pointer}.msg{margin-top:12px;padding:11px;border-radius:9px;font-size:12px;display:none}.show{display:block}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#047857}</style></head><body><main class="card"><h1>تسجيل الدخول</h1><p>سجّل الدخول، وسيحدد النظام لوحة العمل المناسبة تلقائياً حسب دور حسابك.</p><form id="form"><div class="field"><label>البريد الإلكتروني أو اسم المستخدم</label><input id="identifier" required autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="submit">تسجيل الدخول</button><div id="msg" class="msg"></div></form></main><script>const $=x=>document.getElementById(x);$('form').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').className='msg';try{const r=await fetch('/api/member-session?action=login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},credentials:'include',body:JSON.stringify({identifier:$('identifier').value.trim(),password:$('password').value})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.success)throw Error(j.error||'تعذر تسجيل الدخول حالياً.');$('msg').className='msg show ok';$('msg').textContent='تم تسجيل الدخول. يتم فتح لوحة العمل...';location.assign(j.redirect||'/members.html')}catch(e){$('msg').className='msg show err';$('msg').textContent=e.message}finally{$('submit').disabled=false}};</script></body></html>
