<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--r:#ff2a54;--n:#151d36;--b:#e2e8f0;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#1e293b;font-family:Cairo,sans-serif}.wrap{width:min(520px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--b);padding:14px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:50px}.back{color:var(--r);font-weight:800;text-decoration:none}.hero{text-align:center;padding:55px 0 25px}.hero h1{color:var(--n);font-size:36px;margin:10px 0}.hero p{color:var(--m)}.card{background:#fff;border:1px solid var(--b);border-radius:24px;padding:30px;box-shadow:0 18px 50px #151d3612;margin-bottom:45px}label{display:block;font-weight:800;color:var(--n);margin:14px 0 7px}input{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;font:inherit;background:#fbfcfe}.btn{width:100%;margin-top:22px;border:0;border-radius:13px;padding:14px;background:var(--r);color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{display:none;padding:12px;border-radius:10px;margin-top:12px}.show{display:block}.err{background:#fef2f2;color:#991b1b}.ok{background:#ecfdf5;color:#047857}.links{text-align:center;margin-top:18px;font-size:13px}</style></head><body><header><div class="wrap nav"><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife"></a><a class="back" href="join-options.html">العودة</a></div></header><section class="hero"><div class="wrap"><h1>تسجيل الدخول</h1><p>أدخل بيانات حسابك في منصة MedLife.</p></div></section><main class="wrap"><form class="card" id="form"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button class="btn" id="submit">دخول إلى الحساب</button><div id="msg" class="msg"></div><div class="links"><a class="back" href="join-options.html">ليس لديك حساب؟ سجّل عضويتك</a></div></form></main><script>const $=id=>document.getElementById(id);$('form').addEventListener('submit',async e=>{e.preventDefault();$('submit').disabled=true;const msg=$('msg');msg.className='msg';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'تعذر تسجيل الدخول');msg.className='msg show ok';msg.textContent='تم تسجيل الدخول بنجاح. سيتم تحويلك...';location.href='member-dashboard.html'}catch(err){msg.className='msg show err';msg.textContent=err.message}finally{$('submit').disabled=false}});</script></body></html>
