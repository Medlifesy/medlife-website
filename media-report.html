<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقرير الإعلامي | مؤسسة ميدلايف</title><meta name="description" content="التقرير التفصيلي لنشاط من أنشطة مؤسسة ميدلايف."><link rel="icon" href="./logo.PNG"><link rel="stylesheet" href="/homepage-redesign.css"><style>:root{--n:#12203a;--m:#687789;--l:#e3eaf0;--a:#e83255;--c:#0d668c;--s:#f6f8fb}*{box-sizing:border-box}body{margin:0;color:var(--n);font-family:Cairo,Tahoma,Arial,sans-serif;background:#fff}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.top{padding:26px 0;border-bottom:1px solid var(--l);background:#fff}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:var(--c);text-decoration:none;font-size:11px;font-weight:800}.brand{font-size:11px;font-weight:900;color:var(--m)}.hero{padding:58px 0 42px;background:linear-gradient(135deg,#f7fafc,#fff 62%,#fff5f7)}.crumb{font-size:10px;color:var(--m);margin-bottom:18px}.crumb a{color:var(--c);text-decoration:none}.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:#eef7fa;color:var(--c);font-size:10px;font-weight:900}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.45;margin:15px 0 14px}.lead{color:#5d6b7a;font-size:14px;line-height:2.15;max-width:850px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.meta span{padding:8px 11px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--m);font-size:10px}.report{padding:42px 0}.paper{border:1px solid var(--l);border-radius:22px;background:#fff;box-shadow:0 18px 50px #12203a0d;overflow:hidden}.cover{width:100%;max-height:560px;object-fit:cover;display:block}.body{padding:clamp(22px,5vw,50px)}.body h2,.body h3{line-height:1.6;margin:34px 0 13px}.body h2{font-size:25px}.body h3{font-size:20px}.body p{font-size:16px;line-height:2.45;color:#3f4d5c;margin:0 0 22px;white-space:normal}.body p+p{margin-top:4px}.body ul,.body ol{color:#3f4d5c;line-height:2.35;padding-right:27px;margin:0 0 24px}.body li{margin:5px 0}.body blockquote{margin:26px 0;padding:17px 21px;border-right:4px solid var(--a);background:#fafbfc;color:#536174;line-height:2}.body figure{margin:30px 0}.body img{display:block;max-width:100%;height:auto;margin:24px auto;border-radius:16px}.body .report-image{width:min(760px,100%);max-height:560px;object-fit:cover}.body figcaption{text-align:center;color:var(--m);font-size:11px;line-height:1.8;margin-top:8px}.body a{color:var(--c)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:38px;padding-top:28px;border-top:1px solid var(--l)}.photo{margin:0;border:1px solid var(--l);border-radius:15px;overflow:hidden;background:var(--s)}.photo img{width:100%;height:220px;object-fit:cover;display:block;margin:0}.photo figcaption{padding:10px;color:var(--m);font-size:10px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}.btn{border:0;text-decoration:none;border-radius:10px;padding:10px 14px;font:800 11px Cairo;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:#eef4f7;color:var(--c)}.status{padding:50px 20px;text-align:center;color:var(--m)}.footer{text-align:center;padding:15px 0 45px;color:#8793a2;font-size:10px}@media(max-width:700px){.gallery{grid-template-columns:1fr 1fr}.photo img{height:180px}}@media(max-width:480px){.gallery{grid-template-columns:1fr}.photo img{height:auto;max-height:350px}.topline{align-items:flex-start;flex-direction:column}}@media print{.top,.actions{display:none}.paper{border:0;box-shadow:none}.report{padding:0}.body{padding:0}.hero{padding:20px 0}.gallery{break-inside:avoid}}</style></head><body><div class="top"><div class="wrap topline"><div class="brand">مؤسسة ميدلايف الطبية الخيرية التطوعية</div><a class="back" href="/media-center.html">← العودة إلى المركز الإعلامي</a></div></div><main id="app"><div class="status">جارٍ تحميل التقرير...</div></main><div class="footer">© 2026 مؤسسة ميدلايف الطبية الخيرية التطوعية — المركز الإعلامي</div><script>const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{if(!v)return'غير محدد';try{return new Intl.DateTimeFormat('ar-SY',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v+'T00:00:00'))}catch{return v}};const safeHtml=h=>{const t=document.createElement('template');t.innerHTML=h||'';t.content.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||((n==='href'||n==='src')&&(v.startsWith('javascript:')||v.startsWith('data:'))))el.removeAttribute(a.name)});});return t.innerHTML};
function textToBlocks(text){let s=String(text||'').replace(/\r/g,'').trim();if(!s)return'';s=s.replace(/\n{3,}/g,'\n\n');const lines=s.split('\n').map(x=>x.trim()).filter(Boolean);let out=[],para=[];const flush=()=>{if(para.length){out.push('<p>'+esc(para.join(' '))+'</p>');para=[]}};for(const line of lines){if(/^#{1,3}\s+/.test(line)){flush();out.push('<h2>'+esc(line.replace(/^#{1,3}\s+/,''))+'</h2>');continue}if(/^(العنوان|مقدمة|المقدمة|الأهداف|الهدف|الأنشطة|النتائج|الخلاصة|التوصيات|الاستنتاج|تفاصيل النشاط)\s*[:：]?$/i.test(line)){flush();out.push('<h2>'+esc(line.replace(/[:：]\s*$/,''))+'</h2>');continue}if(/^[-•*]\s+/.test(line)){flush();const item=esc(line.replace(/^[-•*]\s+/,''));if(out.length&&out[out.length-1].startsWith('<ul>'))out[out.length-1]=out[out.length-1].replace('</ul>','')+'<li>'+item+'</li></ul>';else out.push('<ul><li>'+item+'</li></ul>');continue}if(/^\d+[.)]\s+/.test(line)){flush();const item=esc(line.replace(/^\d+[.)]\s+/,''));if(out.length&&out[out.length-1].startsWith('<ol>'))out[out.length-1]=out[out.length-1].replace('</ol>','')+'<li>'+item+'</li></ol>';else out.push('<ol><li>'+item+'</li></ol>');continue}para.push(line)}flush();return out.join('')}
function normalizeReport(p){let raw=safeHtml(p.content_html);if(!raw.trim())raw=textToBlocks(p.summary||'يتضمن هذا التقرير عرضاً موجزاً للنشاط الذي نفذته مؤسسة ميدلايف، وأبرز أهدافه ومخرجاته.');else if(!/<\/?(p|h2|h3|ul|ol|blockquote|figure|img)\b/i.test(raw))raw=textToBlocks(raw);else{const t=document.createElement('template');t.innerHTML=raw;const walker=document.createTreeWalker(t.content,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);nodes.forEach(n=>{if(n.parentElement&&['SCRIPT','STYLE','FIGURE','LI','H2','H3'].includes(n.parentElement.tagName))return;if(n.nodeValue.trim()&&n.parentElement&&n.parentElement.tagName==='DIV'){const p=document.createElement('p');p.textContent=n.nodeValue.trim();n.parentElement.replaceChild(p,n)}});raw=t.innerHTML}return raw}
function distributeImages(raw,p){const imgs=(p.images||[]).filter(x=>x&&x.image_url);if(imgs.length<2)return raw;const t=document.createElement('template');t.innerHTML=raw;const blocks=[...t.content.querySelectorAll(':scope > p,:scope > h2,:scope > h3,:scope > ul,:scope > ol,:scope > blockquote')];let idx=1;const step=Math.max(2,Math.ceil(blocks.length/Math.max(1,imgs.length-1)));blocks.forEach((b,i)=>{if(idx<imgs.length&&((i+1)%step===0||i===blocks.length-1)){const x=imgs[idx++],fig=document.createElement('figure');fig.innerHTML='<img class="report-image" loading="lazy" src="'+esc(x.image_url)+'" alt="'+esc(x.caption||p.title)+'"><figcaption>'+esc(x.caption||'')+'</figcaption>';b.after(fig)}});return t.innerHTML}
function makeAutoReport(p){let raw=normalizeReport(p);if(!(p.content_html||'').match(/<img\b/i))raw=distributeImages(raw,p);return raw}
async function load(){const slug=new URL(location.href).searchParams.get('slug');if(!slug){app.innerHTML='<div class="status"><h2>التقرير غير محدد</h2><p>يرجى اختيار تقرير من المركز الإعلامي.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>';return}try{const r=await fetch('/api/media-center?slug='+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.post)throw Error('not-found');const p=d.post;document.title=esc(p.title)+' | مؤسسة ميدلايف';const cover=p.cover_image_url||(p.images&&p.images[0]&&p.images[0].image_url)||'';const body=makeAutoReport(p);const gallery=(p.images||[]).slice(1).map(x=>'<figure class="photo"><img src="'+esc(x.image_url)+'" alt="'+esc(x.caption||p.title)+'" loading="lazy"><figcaption>'+esc(x.caption||'')+'</figcaption></figure>').join('');app.innerHTML='<section class="hero"><div class="wrap"><div class="crumb"><a href="/media-center.html">المركز الإعلامي</a> / التقرير التفصيلي</div><span class="badge">'+esc(p.category||'تقرير إعلامي')+'</span><h1>'+esc(p.title)+'</h1><div class="lead">'+esc(p.summary||'تقرير تفصيلي موثق حول أحد أنشطة مؤسسة ميدلايف ومبادراتها الميدانية.')+'</div><div class="meta"><span>📅 '+dt(p.activity_date)+'</span><span>📍 '+esc(p.location||'غير محدد')+'</span><span># '+esc(p.archive_code||'غير محدد')+'</span>'+(p.author_name?'<span>✎ '+esc(p.author_name)+'</span>':'')+'</div></div></section><section class="report"><div class="wrap"><article class="paper">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(p.title)+'">':'')+'<div class="body">'+body+(gallery?'<div class="gallery">'+gallery+'</div>':'')+'<div class="actions"><a class="btn primary" href="/media-center.html">المركز الإعلامي</a><button class="btn secondary" onclick="window.print()">طباعة التقرير</button></div></div></article></div></section>'}catch(e){app.innerHTML='<div class="status"><h2>تعذر العثور على التقرير</h2><p>قد يكون التقرير غير منشور أو أن الرابط غير صحيح.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>'}}load();</script></body></html>
