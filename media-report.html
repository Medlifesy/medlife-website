<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقرير الإعلامي | مؤسسة ميدلايف</title><meta name="description" content="التقرير التفصيلي لنشاط من أنشطة مؤسسة ميدلايف."><link rel="icon" href="./logo.PNG"><link rel="stylesheet" href="/homepage-redesign.css"><style>:root{--ink:#17233b;--muted:#6f7d8e;--line:#e4e9ef;--accent:#a91d3d;--blue:#176b88;--paper:#fff;--soft:#f6f8fa}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;background:#f7f8fa}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.top{padding:22px 0;background:#fff;border-bottom:1px solid var(--line)}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:900;color:#566579}.brand img{width:38px;height:38px;object-fit:contain}.back{color:var(--blue);text-decoration:none;font-size:11px;font-weight:900}.hero{position:relative;overflow:hidden;padding:70px 0 55px;background:linear-gradient(135deg,#f4f8fa 0%,#fff 58%,#fff4f6 100%)}.crumb{font-size:10px;color:var(--muted);margin-bottom:22px}.crumb a{color:var(--blue);text-decoration:none}.kicker{display:inline-flex;align-items:center;gap:8px;color:var(--accent);font-size:11px;font-weight:900}.kicker:before{content:"";width:28px;height:2px;background:var(--accent)}.hero h1{font-size:clamp(30px,5.2vw,58px);line-height:1.35;letter-spacing:-.6px;max-width:900px;margin:16px 0 18px}.lead{max-width:850px;color:#586779;font-size:15px;line-height:2.25}.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:28px}.meta span{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #dfe5eb;border-radius:999px;background:#ffffffc9;color:#637184;font-size:10px}.report{padding:34px 0 65px}.paper{background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px #17233b12;overflow:hidden}.cover{display:block;width:100%;max-height:600px;object-fit:cover}.body{padding:clamp(26px,6vw,70px)}.reading-head{display:grid;grid-template-columns:1fr 260px;gap:34px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:34px}.reading-label{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:1.5px}.reading-head h2{font-size:27px;line-height:1.6;margin:7px 0 0}.reading-side{font-size:11px;line-height:2;color:var(--muted);border-right:3px solid #e9edf1;padding-right:15px}.article-copy{max-width:820px;margin:auto}.article-copy h2,.article-copy h3{position:relative;line-height:1.55;margin:42px 0 17px;font-weight:900}.article-copy h2{font-size:25px;padding-right:16px}.article-copy h2:before{content:"";position:absolute;right:0;top:7px;width:4px;height:28px;background:var(--accent);border-radius:4px}.article-copy h3{font-size:19px;color:var(--blue)}.article-copy p{font-size:17px;line-height:2.35;color:#3f4d5c;margin:0 0 23px}.article-copy p:first-of-type:first-letter{float:right;font-size:54px;line-height:.85;padding-left:8px;padding-top:6px;color:var(--accent);font-weight:900}.article-copy ul,.article-copy ol{margin:0 0 28px;padding-right:28px;color:#3f4d5c;line-height:2.35}.article-copy li{margin:6px 0}.article-copy li::marker{color:var(--accent);font-weight:900}.article-copy blockquote{margin:34px 0;padding:24px 28px;border-right:5px solid var(--accent);background:linear-gradient(90deg,#fff7f8,#fafbfc);border-radius:14px;color:#4d5b6b;font-size:17px;line-height:2.1;font-weight:700}.article-copy figure{margin:40px 0}.article-copy img{display:block;max-width:100%;height:auto;margin:auto;border-radius:18px}.article-copy .report-image{width:min(780px,100%);max-height:570px;object-fit:cover;box-shadow:0 15px 40px #17233b16}.article-copy figcaption{text-align:center;color:#7b8796;font-size:10px;line-height:1.8;margin-top:10px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:36px 0;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}.fact{padding:12px 14px;border-right:1px solid #dfe5eb}.fact:first-child{border-right:0}.fact small{display:block;color:#8994a2;font-size:9px;margin-bottom:5px}.fact b{font-size:12px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}.photo{margin:0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#f7f8fa}.photo img{width:100%;height:230px;object-fit:cover;display:block}.photo figcaption{padding:10px 12px;color:#687587;font-size:10px;line-height:1.8}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:38px;padding-top:28px;border-top:1px solid var(--line)}.btn{border:0;text-decoration:none;border-radius:11px;padding:11px 16px;font:800 11px Cairo;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#edf4f7;color:var(--blue)}.status{padding:70px 20px;text-align:center;color:var(--muted)}.footer{text-align:center;padding:10px 0 45px;color:#8994a2;font-size:10px}@media(max-width:760px){.reading-head{grid-template-columns:1fr}.reading-side{border-right:0;border-top:1px solid var(--line);padding:12px 0 0}.facts{grid-template-columns:1fr}.fact{border-right:0;border-top:1px solid #dfe5eb}.fact:first-child{border-top:0}.gallery{grid-template-columns:1fr 1fr}.photo img{height:190px}}@media(max-width:480px){.gallery{grid-template-columns:1fr}.photo img{height:auto;max-height:360px}.topline{align-items:flex-start;flex-direction:column}.hero{padding-top:45px}.article-copy p{font-size:16px}.body{padding:24px 20px}}@media print{.top,.actions,.footer{display:none}.hero{padding:20px 0}.paper{border:0;box-shadow:none}.report{padding:0}.body{padding:0}}
</style></head><body><div class="top"><div class="wrap topline"><div class="brand"><img src="/logo.PNG" alt="شعار مؤسسة ميدلايف"><span>مؤسسة ميدلايف الطبية الخيرية التطوعية</span></div><a class="back" href="/media-center.html">← العودة إلى المركز الإعلامي</a></div></div><main id="app"><div class="status">جارٍ تحميل التقرير...</div></main><div class="footer">© 2026 مؤسسة ميدلايف الطبية الخيرية التطوعية — المركز الإعلامي</div><script>
const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{if(!v)return'غير محدد';try{return new Intl.DateTimeFormat('ar-SY',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v+'T00:00:00'))}catch{return v}};
function safeHtml(h){const t=document.createElement('template');t.innerHTML=h||'';t.content.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||((n==='href'||n==='src')&&(v.startsWith('javascript:')||v.startsWith('data:'))))el.removeAttribute(a.name)})});return t.innerHTML}
function sentenceChunks(text,max=360){const s=String(text||'').replace(/\s+/g,' ').trim();if(!s)return[];const sentences=s.match(/[^.!؟؛]+[.!؟؛]?/g)||[s];const out=[];let cur='';for(const part of sentences){const p=part.trim();if(!p)continue;if(cur&&cur.length+p.length>max){out.push(cur.trim());cur=p}else cur+=(cur?' ':'')+p}if(cur)out.push(cur.trim());return out}
function textToBlocks(text){let s=String(text||'').replace(/\r/g,'').trim();if(!s)return'';s=s.replace(/\n{3,}/g,'\n\n');const groups=s.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);const out=[];const heading=/^(العنوان|مقدمة|المقدمة|الأهداف|الهدف|الأنشطة|الأنشطة المنفذة|النتائج|الخلاصة|التوصيات|الاستنتاج|تفاصيل النشاط|نبذة عن النشاط|أهداف النشاط|مخرجات النشاط|الأثر)\s*[:：]?$/i;for(const group of groups){const lines=group.split('\n').map(x=>x.trim()).filter(Boolean);if(lines.length===1&&heading.test(lines[0])){out.push('<h2>'+esc(lines[0].replace(/[:：]\s*$/,''))+'</h2>');continue}if(lines.every(x=>/^[-•*]\s+/.test(x))){out.push('<ul>'+lines.map(x=>'<li>'+esc(x.replace(/^[-•*]\s+/,''))+'</li>').join('')+'</ul>');continue}if(lines.every(x=>/^\d+[.)]\s+/.test(x))){out.push('<ol>'+lines.map(x=>'<li>'+esc(x.replace(/^\d+[.)]\s+/,''))+'</li>').join('')+'</ol>');continue}if(lines.length>1){for(const line of lines){if(heading.test(line))out.push('<h2>'+esc(line.replace(/[:：]\s*$/,''))+'</h2>');else for(const p of sentenceChunks(line))out.push('<p>'+esc(p)+'</p>')}}else for(const p of sentenceChunks(group))out.push('<p>'+esc(p)+'</p>')}return out.join('')}
function normalizeReport(p){let raw=safeHtml(p.content_html);if(!raw.trim())return textToBlocks(p.summary||'يتضمن هذا التقرير عرضاً موجزاً للنشاط الذي نفذته مؤسسة ميدلايف، وأبرز أهدافه ومخرجاته.');if(!/<\/?(p|h2|h3|ul|ol|blockquote|figure|img)\b/i.test(raw))return textToBlocks(raw);return raw}
function distributeImages(raw,p){const imgs=(p.images||[]).filter(x=>x&&x.image_url);if(imgs.length<2)return raw;const t=document.createElement('template');t.innerHTML=raw;const blocks=[...t.content.querySelectorAll(':scope > p,:scope > h2,:scope > h3,:scope > ul,:scope > ol,:scope > blockquote')];let idx=1;const step=Math.max(3,Math.ceil(blocks.length/Math.max(1,imgs.length-1)));blocks.forEach((b,i)=>{if(idx<imgs.length&&((i+1)%step===0||i===blocks.length-1)){const x=imgs[idx++],fig=document.createElement('figure');fig.innerHTML='<img class="report-image" loading="lazy" src="'+esc(x.image_url)+'" alt="'+esc(x.caption||p.title)+'"><figcaption>'+esc(x.caption||'')+'</figcaption>';b.after(fig)}});return t.innerHTML}
function makeAutoReport(p){let raw=normalizeReport(p);if(!(p.content_html||'').match(/<img\b/i))raw=distributeImages(raw,p);return raw}
async function load(){const slug=new URL(location.href).searchParams.get('slug');if(!slug){app.innerHTML='<div class="status"><h2>التقرير غير محدد</h2><p>يرجى اختيار تقرير من المركز الإعلامي.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>';return}try{const r=await fetch('/api/media-center?slug='+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.post)throw Error('not-found');const p=d.post;document.title=p.title+' | مؤسسة ميدلايف';const cover=p.cover_image_url||(p.images&&p.images[0]&&p.images[0].image_url)||'';const body=makeAutoReport(p);const gallery=(p.images||[]).slice(1).map(x=>'<figure class="photo"><img src="'+esc(x.image_url)+'" alt="'+esc(x.caption||p.title)+'" loading="lazy"><figcaption>'+esc(x.caption||'')+'</figcaption></figure>').join('');const facts='<div class="facts"><div class="fact"><small>التصنيف</small><b>'+esc(p.category||'تقرير إعلامي')+'</b></div><div class="fact"><small>تاريخ النشاط</small><b>'+dt(p.activity_date)+'</b></div><div class="fact"><small>رقم الأرشيف</small><b>'+esc(p.archive_code||'غير محدد')+'</b></div></div>';app.innerHTML='<section class="hero"><div class="wrap"><div class="crumb"><a href="/media-center.html">المركز الإعلامي</a> / التقرير التفصيلي</div><div class="kicker">تقرير إعلامي مؤسسي</div><h1>'+esc(p.title)+'</h1><div class="lead">'+esc(p.summary||'تقرير تفصيلي موثق حول أحد أنشطة مؤسسة ميدلايف ومبادراتها الميدانية.')+'</div><div class="meta"><span>📅 '+dt(p.activity_date)+'</span><span>📍 '+esc(p.location||'غير محدد')+'</span>'+(p.author_name?'<span>✎ '+esc(p.author_name)+'</span>':'')+'</div></div></section><section class="report"><div class="wrap"><article class="paper">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(p.title)+'">':'')+'<div class="body"><div class="reading-head"><div><div class="reading-label">MEDLIFE / MEDIA CENTER</div><h2>التقرير التفصيلي للنشاط</h2></div><div class="reading-side">توثيق مؤسسي للنشاط وأهدافه ومخرجاته وأثره في الميدان.</div></div>'+facts+'<div class="article-copy">'+body+'</div>'+(gallery?'<div class="gallery">'+gallery+'</div>':'')+'<div class="actions"><a class="btn primary" href="/media-center.html">المركز الإعلامي</a><button class="btn secondary" onclick="window.print()">طباعة التقرير</button></div></div></article></div></section>'}catch(e){app.innerHTML='<div class="status"><h2>تعذر العثور على التقرير</h2><p>قد يكون التقرير غير منشور أو أن الرابط غير صحيح.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>'}}load();
</script></body></html>
