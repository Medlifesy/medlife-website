<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقرير الإعلامي | مؤسسة ميدلايف</title><meta name="description" content="التقرير التفصيلي لنشاط من أنشطة مؤسسة ميدلايف."><link rel="icon" href="./logo.PNG"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="/homepage-redesign.css"><style>:root{--n:#12203a;--m:#687789;--l:#e3eaf0;--a:#e83255;--c:#0d668c;--s:#f6f8fb}*{box-sizing:border-box}body{margin:0;color:var(--n);font-family:Cairo,sans-serif;background:#fff}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.top{padding:26px 0;border-bottom:1px solid var(--l);background:#fff}.topline{display:flex;justify-content:space-between;align-items:center;gap:15px}.back{color:var(--c);text-decoration:none;font-size:11px;font-weight:800}.brand{font-size:11px;font-weight:900;color:var(--m)}.hero{padding:58px 0 42px;background:linear-gradient(135deg,#f7fafc,#fff 62%,#fff5f7)}.crumb{font-size:10px;color:var(--m);margin-bottom:18px}.crumb a{color:var(--c);text-decoration:none}.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:#eef7fa;color:var(--c);font-size:10px;font-weight:900}.hero h1{font-size:clamp(28px,5vw,48px);line-height:1.45;margin:15px 0 14px}.lead{color:#5d6b7a;font-size:14px;line-height:2.15;max-width:850px}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.meta span{padding:8px 11px;border:1px solid var(--l);border-radius:10px;background:#fff;color:var(--m);font-size:10px}.report{padding:42px 0}.paper{border:1px solid var(--l);border-radius:22px;background:#fff;box-shadow:0 18px 50px #12203a0d;overflow:hidden}.cover{width:100%;max-height:560px;object-fit:cover;display:block}.body{padding:clamp(22px,5vw,50px)}.body h2,.body h3{line-height:1.6;margin:25px 0 10px}.body p{font-size:14px;line-height:2.25;color:#3f4d5c;margin:0 0 17px}.body ul,.body ol{color:#3f4d5c;line-height:2.2;padding-right:24px}.body a{color:var(--c)}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:35px}.photo{margin:0;border:1px solid var(--l);border-radius:15px;overflow:hidden;background:var(--s)}.photo img{width:100%;height:220px;object-fit:cover;display:block}.photo figcaption{padding:10px;color:var(--m);font-size:10px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:28px}.btn{border:0;text-decoration:none;border-radius:10px;padding:10px 14px;font:800 11px Cairo;cursor:pointer}.primary{background:var(--a);color:#fff}.secondary{background:#eef4f7;color:var(--c)}.status{padding:50px 20px;text-align:center;color:var(--m)}.footer{text-align:center;padding:15px 0 45px;color:#8793a2;font-size:10px}@media(max-width:700px){.gallery{grid-template-columns:1fr 1fr}.photo img{height:180px}}@media(max-width:480px){.gallery{grid-template-columns:1fr}.photo img{height:auto;max-height:350px}.topline{align-items:flex-start;flex-direction:column}}</style></head><body><div class="top"><div class="wrap topline"><div class="brand">مؤسسة ميدلايف الطبية الخيرية التطوعية</div><a class="back" href="/media-center.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى المركز الإعلامي</a></div></div><main id="app"><div class="status">جارٍ تحميل التقرير...</div></main><div class="footer">© 2026 مؤسسة ميدلايف الطبية الخيرية التطوعية — المركز الإعلامي</div><script src="/site-nav.js"></script><script>const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{if(!v)return'غير محدد';try{return new Intl.DateTimeFormat('ar-SY',{year:'numeric',month:'long',day:'numeric'}).format(new Date(v+'T00:00:00'))}catch{return v}};const safeHtml=h=>{const t=document.createElement('template');t.innerHTML=h||'';t.content.querySelectorAll('script,iframe,object,embed,form,style,link,meta').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(a=>{const n=a.name.toLowerCase(),v=a.value.trim().toLowerCase();if(n.startsWith('on')||((n==='href'||n==='src')&&(v.startsWith('javascript:')||v.startsWith('data:'))))el.removeAttribute(a.name)});});return t.innerHTML};const img=p=>p.cover_image_url||(p.images&&p.images[0]&&p.images[0].image_url)||'';async function load(){const slug=new URL(location.href).searchParams.get('slug');if(!slug){app.innerHTML='<div class="status"><h2>التقرير غير محدد</h2><p>يرجى اختيار تقرير من المركز الإعلامي.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>';return}try{const r=await fetch('/api/media-center?slug='+encodeURIComponent(slug),{cache:'no-store'}),d=await r.json();if(!r.ok||!d.post)throw Error('not-found');const p=d.post;document.title=esc(p.title)+' | مؤسسة ميدلايف';const cover=img(p);app.innerHTML='<section class="hero"><div class="wrap"><div class="crumb"><a href="/media-center.html">المركز الإعلامي</a> / التقرير التفصيلي</div><span class="badge">'+esc(p.category||'تقرير إعلامي')+'</span><h1>'+esc(p.title)+'</h1><div class="lead">'+esc(p.summary||'تقرير تفصيلي موثق حول أحد أنشطة مؤسسة ميدلايف ومبادراتها الميدانية.')+'</div><div class="meta"><span><i class="fa-regular fa-calendar"></i> '+dt(p.activity_date)+'</span><span><i class="fa-solid fa-location-dot"></i> '+esc(p.location||'غير محدد')+'</span><span><i class="fa-solid fa-hashtag"></i> '+esc(p.archive_code||'غير محدد')+'</span>'+(p.author_name?'<span><i class="fa-solid fa-user"></i> '+esc(p.author_name)+'</span>':'')+'</div></div></section><section class="report"><div class="wrap"><article class="paper">'+(cover?'<img class="cover" src="'+esc(cover)+'" alt="'+esc(p.title)+'">':'')+'<div class="body"><div>'+safeHtml(p.content_html)+'</div>'+((p.images||[]).length?'<div class="gallery">'+p.images.map(x=>'<figure class="photo"><img src="'+esc(x.image_url)+'" alt="'+esc(x.caption||p.title)+'" loading="lazy"><figcaption>'+esc(x.caption||'')+'</figcaption></figure>').join('')+'</div>':'')+'<div class="actions"><a class="btn primary" href="/media-center.html"><i class="fa-solid fa-newspaper"></i> المركز الإعلامي</a><button class="btn secondary" onclick="window.print()"><i class="fa-solid fa-print"></i> طباعة التقرير</button></div></div></article></div></section>'}catch(e){app.innerHTML='<div class="status"><h2>تعذر العثور على التقرير</h2><p>قد يكون التقرير غير منشور أو أن الرابط غير صحيح.</p><a class="btn primary" href="/media-center.html">العودة إلى المركز الإعلامي</a></div>'}}load();</script></body></html>
