<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حسابي | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--r:#ff2a54;--n:#151d36;--b:#e2e8f0;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#1e293b;font-family:Cairo,sans-serif}.wrap{width:min(950px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--b);padding:14px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:50px}.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--r);color:#fff;font:inherit;font-weight:900;cursor:pointer}.hero{text-align:center;padding:50px 0 25px}.hero h1{color:var(--n)}.card{background:#fff;border:1px solid var(--b);border-radius:24px;padding:30px;box-shadow:0 18px 50px #151d3612}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.item{border:1px solid var(--b);border-radius:14px;padding:15px;background:#fbfcfe}.label{font-size:12px;color:var(--m)}.value{font-weight:800;color:var(--n);margin-top:3px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><img class="logo" src="logo.PNG" alt="MedLife"><button class="btn" id="logout">تسجيل الخروج</button></div></header><section class="hero"><div class="wrap"><h1>مرحباً بك في منصة MedLife 👋</h1><p id="welcome">جارٍ تحميل بيانات حسابك...</p></div></section><main class="wrap"><section class="card"><h2 style="color:var(--n)">بيانات العضوية</h2><div class="grid" id="data"></div></section></main><script>const $=id=>document.getElementById(id);const labels={member_code:'رقم العضوية',full_name:'الاسم',email:'البريد الإلكتروني',role:'الصفة',cell:'القسم / الخلية',governorate:'المحافظة'};async function load(){const r=await fetch('/api/me',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.success){location.href='login.html';return}const u=j.user;$('welcome').textContent='تم تسجيل الدخول إلى حسابك بنجاح.';$('data').innerHTML=Object.entries({member_code:u.member_code,full_name:u.full_name,email:u.email,role:u.role,cell:u.cell,governorate:u.governorate}).map(([k,v])=>`<div class="item"><div class="label">${labels[k]}</div><div class="value">${v||'—'}</div></div>`).join('')}load();$('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='login.html'};</script></body></html>
