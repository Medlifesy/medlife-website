<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedLife | إدارة مجتمع المتطوعين</title><link rel="icon" href="logo.PNG"><style>body{margin:0;background:#f5f7fb;font-family:Arial,Tahoma,sans-serif;color:#1e293b}.wrap{max-width:1180px;margin:35px auto;padding:0 18px}header{background:#fff;border-bottom:1px solid #e2e8f0;padding:16px 20px}.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{height:48px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px rgba(21,29,54,.06)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;background:#f8fafc;border-radius:13px;text-align:center}.stat b{display:block;font-size:28px;color:#2f6bff}.key{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-top:8px}.btn{padding:10px 15px;border:0;border-radius:10px;background:#151d36;color:#fff;font-weight:800;cursor:pointer}.btn.green{background:#059669}.btn.blue{background:#2f6bff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eef2f7;text-align:right;white-space:nowrap}th{color:#64748b;font-size:12px}td{font-size:13px}.invite{background:#ecfdf5;color:#047857;padding:10px;border-radius:10px;margin-top:10px;word-break:break-all;display:none}.muted{color:#64748b;font-size:13px}.error{color:#b91c1c}.success{color:#047857}@media(max-width:760px){.grid{grid-template-columns:1fr}.head{gap:10px}.logo{height:42px}}</style></head><body><header><div class="head"><img src="logo.PNG" class="logo" alt="MedLife"><a href="members.html" class="btn">مجتمع المتطوعين</a></div></header><main class="wrap"><div class="card"><h1>إدارة حسابات المتطوعين</h1><p class="muted">اعتمد طلب المتطوع أولاً من لوحة الأعضاء، ثم أرسل له دعوة بريدية لإنشاء حسابه.</p><label>مفتاح الإدارة</label><input id="key" class="key" type="password" placeholder="MEMBERS_ADMIN_KEY"><div style="margin-top:10px"><button id="load" class="btn">تحميل المتطوعين</button></div><div id="msg" class="muted" style="margin-top:10px"></div></div><div id="stats" class="grid" style="margin-bottom:18px"></div><div class="card"><h2>المتطوعون</h2><div class="table-wrap"><table><thead><tr><th>الاسم</th><th>البريد</th><th>المجال</th><th>المحافظة</th><th>الحالة</th><th>الحساب</th><th>الدعوة</th></tr></thead><tbody id="rows"></tbody></table></div><div id="invite" class="invite"></div></div></main><script>const key=document.getElementById('key'),load=document.getElementById('load'),rows=document.getElementById('rows'),stats=document.getElementById('stats'),msg=document.getElementById('msg'),invite=document.getElementById('invite');load.onclick=loadMembers;async function loadMembers(){msg.className='muted';msg.textContent='جاري التحميل...';try{const r=await fetch('/api/member-platform-admin?action=list',{headers:{'X-Admin-Key':key.value}});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'تعذر التحميل');stats.innerHTML=`<div class="stat"><b>${d.stats.total}</b>إجمالي الطلبات</div><div class="stat"><b>${d.stats.approved}</b>أعضاء معتمدون</div><div class="stat"><b>${d.stats.accounts}</b>حسابات مفعلة</div>`;rows.innerHTML=(d.members||[]).map(m=>{const depts=Array.isArray(parseJson(m.departments))?parseJson(m.departments).join('، '):(m.departments||'');const account=m.account_status==='active'?'مفعل':'بدون حساب';const inviteState=m.invite_used_at?'تم استخدام الدعوة':(m.invite_expires_at?'دعوة موجودة':'لا توجد دعوة');const action=m.status==='approved'&&m.account_status!=='active'?`<button class="btn green" onclick="inviteMember(${m.id})">📧 إرسال الدعوة</button>`:'—';return `<tr><td>${esc(m.full_name)}</td><td>${esc(m.email||'-')}</td><td>${esc(depts)}</td><td>${esc(m.field_city||'-')}</td><td>${esc(m.status)}</td><td>${esc(account)}</td><td>${esc(inviteState)}<br>${action}</td></tr>`}).join('');msg.textContent='تم تحميل البيانات.'}catch(e){msg.className='error';msg.textContent=e.message}}async function inviteMember(id){invite.style.display='block';invite.style.background='#eef4ff';invite.style.color='#1d4ed8';invite.textContent='جاري إنشاء الدعوة وإرسال البريد...';try{const r=await fetch('/api/member-platform-admin?action=invite',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':key.value},body:JSON.stringify({member_id:id})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'تعذر إرسال الدعوة');invite.style.background='#ecfdf5';invite.style.color='#047857';invite.textContent=`تم إرسال الدعوة بنجاح إلى ${d.email}. الرمز صالح لمدة ${d.expires_in_days} أيام.`;loadMembers()}catch(e){invite.style.background='#fff1f2';invite.style.color='#b91c1c';invite.textContent=e.message}}function parseJson(v){try{return JSON.parse(v||'[]')}catch{return[]}}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;')}</script></body></html>
