<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الانضمام الجديدة | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--r:#ff2a54;--n:#151d36;--b:#e2e8f0;--m:#64748b}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;font-family:Cairo,sans-serif;color:#1e293b}.wrap{width:min(1250px,calc(100% - 30px));margin:auto}header{background:#fff;border-bottom:1px solid var(--b);padding:14px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:50px}.back{color:var(--r);font-weight:800;text-decoration:none}.card{background:#fff;border:1px solid var(--b);border-radius:22px;padding:24px;margin:25px 0;box-shadow:0 15px 40px #151d360d}input,select{padding:11px;border:1px solid var(--b);border-radius:10px;font:inherit}.login{max-width:500px;margin:60px auto}.btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:800;cursor:pointer}.primary{background:var(--r);color:#fff}.accept{background:#ecfdf5;color:#047857}.reject{background:#fef2f2;color:#b91c1c}.dashboard{display:none}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid var(--b)}.small{font-size:12px;color:var(--m)}.actions{display:flex;gap:6px;flex-wrap:wrap}.modal{display:none;position:fixed;inset:0;background:#0f172aaa;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:25px;width:min(700px,100%);max-height:90vh;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{background:#f8fafc;padding:10px;border-radius:10px}.field b{display:block;color:var(--n);font-size:12px}.field span{font-size:13px}@media(max-width:850px){.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a href="index.html"><img class="logo" src="logo.PNG"></a><a class="back" href="members-admin.html">لوحة الأعضاء ←</a></div></header><main class="wrap"><section class="card login" id="login"><h2 style="color:var(--n)">طلبات الانضمام الجديدة</h2><p class="small">أدخل ADMIN_KEY لعرض الطلبات.</p><input id="key" type="password" placeholder="ADMIN_KEY" style="width:100%"><button class="btn primary" id="loginBtn" style="width:100%;margin-top:10px">دخول</button><p id="loginMsg"></p></section><section class="dashboard" id="dash"><div class="card"><h1 style="color:var(--n)">المتقدمون الجدد</h1><p class="small">عند القبول، تحدد الصفة والخلية داخل MedLife قبل إنشاء سجل العضو.</p><button class="btn primary" id="refresh">تحديث</button></div><div class="card" id="list"></div></section></main><div class="modal" id="modal"><div class="box"><button class="btn" onclick="closeModal()">إغلاق</button><h2 id="title" style="color:var(--n)"></h2><div id="details" class="grid"></div><div id="acceptForm" style="margin-top:18px"><h3>بيانات العضوية عند القبول</h3><div class="grid"><div><label>الصفة</label><select id="role"><option value="volunteer">متطوع</option><option value="supervisor">مشرف</option><option value="general_supervisor">مشرف عام</option><option value="assistant_supervisor">مساعد مشرف</option></select></div><div><label>الخلية</label><select id="cell"><option value="plasma_cell">Plasma Cell</option><option value="neuron_cell">Neuron Cell</option><option value="astrocyte_cell">Astrocyte Cell</option><option value="leukocyte_cell">Leukocyte Cell</option><option value="heart_cell">Heart Cell</option><option value="red_blood_cell">Red Blood Cell</option><option value="blog">المدونة</option><option value="design">التصميم</option><option value="video_editing">المونتاج</option><option value="visual_media">الإعلام المرئي</option><option value="instagram">الإنستا</option><option value="telegram">التليجرام</option><option value="administration">الإدارة</option><option value="voice_over">Voice Over</option><option value="coordination">التنسيق</option><option value="university_media">إعلامي جامعات</option><option value="field">ميداني</option></select></div><div><label>تاريخ الانتساب</label><input id="join" type="date"></div><div><label>شهادة التطوع</label><select id="cert"><option value="no">لا</option><option value="yes">نعم</option></select></div><div id="fieldWrap" style="display:none"><label>الميداني</label><select id="field"><option value="damascus">دمشق</option><option value="aleppo">حلب</option><option value="tartous">طرطوس</option><option value="latakia">اللاذقية</option><option value="homs">حمص</option><option value="hasakah">الحسكة</option></select></div></div><button class="btn accept" id="accept" style="margin-top:15px">قبول وإنشاء عضو</button><button class="btn reject" id="reject" style="margin-top:15px">رفض الطلب</button></div></div></div><script>let key='',items=[],selected=null;const $=x=>document.getElementById(x);$('loginBtn').onclick=async()=>{key=$('key').value.trim();if(await load()){sessionStorage.setItem('new_members_admin_key',key);$('login').style.display='none';$('dash').style.display='block'}};$('refresh').onclick=load;async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{Authorization:`Bearer ${key}`,'Content-Type':'application/json',...(opt.headers||{})}});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'تعذر التنفيذ');return j}async function load(){try{const j=await api('/api/new-members-admin');items=j.applications||[];render();return true}catch(e){$('loginMsg').textContent=e.message;return false}}function render(){ $('list').innerHTML=items.length?items.map(x=>`<div class="row"><div><b>${esc(x.full_name)}</b><div class="small">${esc(x.academic_status)}</div></div><div>${esc(x.phone)}<br><span class="small">${esc(x.email||'')}</span></div><div>${esc(x.governorate)}<br><span class="small">${esc(x.interest)}</span></div><div><b>${esc(x.status)}</b><br><span class="small">${esc(x.created_at)}</span></div><div class="actions"><button class="btn" onclick="view(${x.id})">عرض</button>${x.status==='pending'?`<button class="btn accept" onclick="view(${x.id})">مراجعة</button>`:''}</div></div>`).join(''):'<p style="text-align:center;color:#64748b">لا توجد طلبات.</p>'}function view(id){selected=items.find(x=>x.id===id);if(!selected)return;$('title').textContent=selected.full_name;const keys=['mother_name','national_id','gender','email','phone','governorate','address','academic_status','university','faculty','study_year','graduation_year','profession','workplace','resident_specialty','residency_year','residency_hospital','interest','motivation','status'];$('details').innerHTML=keys.map(k=>`<div class="field"><b>${k}</b><span>${esc(selected[k]||'-')}</span></div>`).join('');$('modal').classList.add('open');$('acceptForm').style.display=selected.status==='pending'?'block':'none';$('join').value=new Date().toISOString().slice(0,10)}$('cell').onchange=()=>{$('fieldWrap').style.display=$('cell').value==='field'?'block':'none'};$('accept').onclick=async()=>{if(!selected)return;try{await api('/api/new-members-admin',{method:'PATCH',body:JSON.stringify({id:selected.id,status:'accepted',medlife_role:$('role').value,cell:$('cell').value,field_location:$('field').value,join_date:$('join').value,volunteer_certificate:$('cert').value})});closeModal();await load()}catch(e){alert(e.message)}};$('reject').onclick=async()=>{if(!selected)return;const reason=prompt('سبب الرفض (اختياري)')??'';try{await api('/api/new-members-admin',{method:'PATCH',body:JSON.stringify({id:selected.id,status:'rejected',rejection_reason:reason})});closeModal();await load()}catch(e){alert(e.message)}};function closeModal(){$('modal').classList.remove('open')}function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}const saved=sessionStorage.getItem('new_members_admin_key');if(saved){key=saved;load().then(ok=>{if(ok){$('login').style.display='none';$('dash').style.display='block'}})}</script></body></html>
