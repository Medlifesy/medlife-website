<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#151D36">
<title>تعيين كلمة مرور جديدة | MedLife</title>
<link rel="icon" href="logo.PNG">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--r:#ff2a54;--n:#151d36;--b:#e2e8f0;--m:#64748b;--bg:#f7f9fc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 15%,rgba(255,42,84,.1),transparent 28%),linear-gradient(135deg,#fff,var(--bg));color:#1e293b;font-family:Cairo,sans-serif;min-height:100vh;display:flex;flex-direction:column}.wrap{width:min(560px,calc(100% - 30px));margin:auto}header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--b);padding:14px 0}.nav{display:flex;justify-content:space-between;align-items:center}.logo{height:50px}.back{color:var(--n);font-weight:800;text-decoration:none}.main{flex:1;display:flex;align-items:center;padding:50px 0}.card{width:100%;background:#fff;border:1px solid var(--b);border-radius:25px;padding:32px;box-shadow:0 22px 65px rgba(21,29,54,.11)}h1{margin:0;color:var(--n);font-size:30px;text-align:center}p{color:var(--m);line-height:1.9}.field{margin-top:18px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid var(--b);border-radius:11px;font:inherit;outline:none}.btn{width:100%;margin-top:18px;border:0;border-radius:12px;padding:14px;background:var(--r);color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn:disabled{opacity:.65}.msg{display:none;margin-top:14px;padding:13px;border-radius:10px;font-size:13px}.msg.show{display:block}.ok{background:#ecfdf5;color:#047857}.err{background:#fef2f2;color:#991b1b}.footer{padding:20px;text-align:center;color:#94a3b8;font-size:11px;background:#fff;border-top:1px solid var(--b)}.invalid{display:none;text-align:center}
</style>
</head>
<body>
<header><div class="wrap nav"><a href="index.html"><img class="logo" src="logo.PNG" alt="MedLife"></a><a class="back" href="login.html">العودة لتسجيل الدخول</a></div></header>
<main class="main"><section class="card"><div id="invalid" class="invalid"><h1>الرابط غير صالح</h1><p>رابط إعادة تعيين كلمة المرور غير صالح أو منتهي الصلاحية.</p><a class="back" href="forgot-password.html">طلب رابط جديد</a></div><div id="content"><h1>تعيين كلمة مرور جديدة</h1><p style="text-align:center">اختر كلمة مرور قوية لا تقل عن 10 محارف.</p><form id="form"><div class="field"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="10" required autocomplete="new-password"></div><div class="field"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="10" required autocomplete="new-password"></div><button class="btn" id="submit" type="submit">تغيير كلمة المرور</button><div id="msg" class="msg"></div></form></div></section></main>
<footer class="footer">© 2026 MedLife Syria — بالعمل التطوعي نصنع الأثر.</footer>
<script>
const token=new URLSearchParams(location.search).get('token')||'';const invalid=document.getElementById('invalid');const content=document.getElementById('content');const msg=document.getElementById('msg');const form=document.getElementById('form');const btn=document.getElementById('submit');
async function validate(){if(!token){invalid.style.display='block';content.style.display='none';return}try{const r=await fetch('/api/member-auth?action=validate-reset&token='+encodeURIComponent(token),{headers:{Accept:'application/json'},cache:'no-store'});const j=await r.json();if(!r.ok||!j.valid){invalid.style.display='block';content.style.display='none'}}catch{invalid.style.display='block';content.style.display='none'}}
validate();
form.addEventListener('submit',async e=>{e.preventDefault();const password=document.getElementById('password').value;const confirm=document.getElementById('confirm').value;msg.className='msg';if(password.length<10){msg.className='msg show err';msg.textContent='كلمة المرور يجب أن تكون 10 محارف على الأقل.';return}if(password!==confirm){msg.className='msg show err';msg.textContent='كلمتا المرور غير متطابقتين.';return}btn.disabled=true;btn.textContent='⏳ جاري تغيير كلمة المرور...';try{const r=await fetch('/api/member-auth?action=reset',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({token,password})});const j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'تعذر تغيير كلمة المرور');msg.className='msg show ok';msg.textContent=j.message||'تم تغيير كلمة المرور بنجاح.';form.reset();setTimeout(()=>location.href='login.html',1300)}catch(err){msg.className='msg show err';msg.textContent=err.message||'حدث خطأ أثناء تغيير كلمة المرور.'}finally{btn.disabled=false;btn.textContent='تغيير كلمة المرور'}});
</script>
</body>
</html>
