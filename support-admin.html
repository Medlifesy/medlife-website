<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة صندوق الدعم | MedLife</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;background:#f6f8fc;color:#1e293b;margin:0}.wrap{max-width:1100px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 12px 35px #151d3610}h1,h2{color:#151d36}input,textarea,select{width:100%;padding:11px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;margin:5px 0 12px;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 18px;background:#ff2a54;color:#fff;font:inherit;font-weight:900;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.case{border-top:1px solid #e2e8f0;padding:16px 0}.muted{color:#64748b;font-size:13px}.danger{background:#151d36}.doc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}@media(max-width:700px){.row,.doc{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>إدارة صندوق الدعم</h1><p class="muted">لوحة الإدارة لا تعرض مفتاح الإدارة في الرابط ولا تحفظه إلا في جلسة المتصفح.</p><div class="card"><h2>مفتاح الإدارة</h2><input id="key" type="password" placeholder="ADMIN_API_KEY"><button onclick="saveKey()">حفظ المفتاح</button><button class="danger" onclick="load()">تحديث البيانات</button></div><div class="card"><h2>إضافة حالة أو مشروع</h2><div class="row"><div><label>الرمز</label><input id="code" placeholder="ML-2026-001"></div><div><label>النوع</label><select id="type"><option value="case">حالة فردية</option><option value="project">مشروع ميدلايف</option></select></div></div><label>العنوان</label><input id="title"><label>ملخص عام</label><textarea id="summary"></textarea><label>الوصف</label><textarea id="description"></textarea><div class="row"><div><label>المبلغ المطلوب</label><input id="target" type="number" min="0"></div><div><label>المحافظة</label><input id="gov"></div></div><label><input id="urgent" type="checkbox" style="width:auto"> حالة عاجلة</label><br><button onclick="createCase()">إضافة الحالة</button><p id="msg"></p></div><div class="card"><h2>الحالات الحالية</h2><div id="list">اضغط تحديث.</div></div></div><script>const K='medlife_support_admin_key';const $=id=>document.getElementById(id);$('key').value=sessionStorage.getItem(K)||'';function saveKey(){sessionStorage.setItem(K,$('key').value);alert('تم حفظ المفتاح لهذه الجلسة فقط.')}async function api(body){const r=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':sessionStorage.getItem(K)||''},body:JSON.stringify(body)});return r.json()}async function createCase(){const d=await api({action:'create',code:$('code').value,type:$('type').value,title:$('title').value,summary:$('summary').value,description:$('description').value,target_amount:Number($('target').value||0),governorate:$('gov').value,urgent:$('urgent').checked});$('msg').textContent=d.success?'تمت إضافة الحالة بنجاح.':'خطأ: '+(d.error||'تعذر التنفيذ');if(d.success)load()}async function load(){const r=await fetch('/api/support',{cache:'no-store'}),d=await r.json();$('list').innerHTML=(d.cases||[]).map(x=>`<div class="case"><strong>${x.code} — ${x.title}</strong><div class="muted">المطلوب: ${x.target_amount} | المؤمّن: ${x.funded_amount} | الحالة: ${x.status}</div><label>تسجيل مبلغ مؤمّن</label><input id="a${x.id}" type="number" min="0"><button onclick="add(${x.id})">تسجيل المبلغ</button><div class="doc"><input id="dl${x.id}" placeholder="اسم الوثيقة"><input id="du${x.id}" placeholder="رابط الوثيقة"><button onclick="doc(${x.id})">إضافة وثيقة</button></div></div>`).join('')||'<p class="muted">لا توجد حالات منشورة حالياً.</p>'}async function add(id){const amount=Number($('a'+id).value||0);if(!amount)return alert('أدخل مبلغاً صحيحاً.');const d=await api({action:'contribution',case_id:id,amount,status:'confirmed'});alert(d.success?'تم تسجيل المبلغ وتحديث حالة التمويل.':d.error||'تعذر التسجيل');load()}async function doc(id){const d=await api({action:'document',case_id:id,label:$('dl'+id).value,url:$('du'+id).value,public:true});alert(d.success?'تمت إضافة الوثيقة.':d.error||'تعذر الإضافة');load()}load();</script></body></html>
