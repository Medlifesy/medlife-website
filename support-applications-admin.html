<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الدعم | إدارة ميدلايف</title><link rel="icon" href="logo.PNG"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>body{font-family:Cairo,sans-serif;background:#f6f8fc;color:#1e293b;margin:0}.wrap{max-width:1150px;margin:auto;padding:25px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;padding:22px;margin:18px 0;box-shadow:0 12px 35px #151d3610}h1,h2{color:#151d36}.muted{color:#64748b;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.application{border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin:14px 0}.badge{display:inline-block;background:#fff0f3;color:#c71943;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:900}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.detail{background:#f7f9fc;border-radius:10px;padding:10px}.detail small{display:block;color:#64748b}.detail strong{color:#151d36}textarea,select,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #dbe2ea;border-radius:10px;font:inherit;margin-top:5px}button{border:0;border-radius:10px;padding:10px 16px;background:#ff2a54;color:#fff;font:inherit;font-weight:900;cursor:pointer}.danger{background:#151d36}@media(max-width:700px){.row,.details{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>طلبات الدعم الخاصة</h1><p class="muted">هذه الصفحة للإدارة فقط. الطلبات لا تظهر للعامة قبل التحقق والموافقة. لا تنشر بيانات المرضى أو الوثائق الحساسة.</p><div class="card"><div class="row"><div><label>ADMIN_API_KEY</label><input id="key" type="password"></div><div style="display:flex;align-items:end;gap:8px"><button onclick="save()">حفظ</button><button class="danger" onclick="load()">تحديث الطلبات</button></div></div></div><div id="list" class="card">جارٍ التحميل...</div></div><script>const K='medlife_support_admin_key';const $=x=>document.getElementById(x);$('key').value=sessionStorage.getItem(K)||'';function save(){sessionStorage.setItem(K,$('key').value);load()}async function api(body){const r=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Key':sessionStorage.getItem(K)||''},body:JSON.stringify(body)});return r.json()}const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function money(n){return new Intl.NumberFormat('ar-SY').format(Number(n||0))+' ل.س'}async function load(){const d=await api({action:'applications'});if(!d.success){$('list').innerHTML='<p>'+esc(d.error||'غير مصرح')+'</p>';return}const a=d.applications||[];$('list').innerHTML='<h2>الطلبات ('+a.length+')</h2>'+ (a.length?a.map(x=>`<article class="application"><span class="badge">${esc(x.status)}</span><h3>${esc(x.application_code)} — ${esc(x.applicant_name)}</h3><div class="details"><div class="detail"><small>الهاتف</small><strong>${esc(x.phone)}</strong></div><div class="detail"><small>المحافظة</small><strong>${esc(x.governorate)}</strong></div><div class="detail"><small>نوع الطلب</small><strong>${esc(x.request_type)}</strong></div><div class="detail"><small>العمر</small><strong>${esc(x.beneficiary_age)}</strong></div><div class="detail"><small>المبلغ المطلوب</small><strong>${money(x.requested_amount)}</strong></div><div class="detail"><small>طريقة التواصل</small><strong>${esc(x.preferred_contact)}</strong></div></div><p><strong>الحاجة:</strong> ${esc(x.need_summary)}</p><p><strong>التفاصيل الطبية:</strong> ${esc(x.medical_details)}</p><p><strong>الوضع المالي:</strong> ${esc(x.family_income)}</p><p><strong>دعم آخر:</strong> ${esc(x.existing_support)}</p><p><strong>الوثائق:</strong><br>${(JSON.parse(x.document_urls||'[]')||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`).join('<br>')||'لا توجد روابط وثائق'}</p><div class="row"><div><label>قرار المراجعة</label><select id="s${x.id}"><option>pending</option><option>under_review</option><option>verified</option><option>approved</option><option>rejected</option><option>closed</option></select></div><div><label>ملاحظات الإدارة</label><textarea id="n${x.id}">${esc(x.admin_notes)}</textarea></div></div><br><button onclick="update(${x.id})">حفظ قرار المراجعة</button></article>`).join(''):'<p class="muted">لا توجد طلبات حالياً.</p>'}async function update(id){const d=await api({action:'application_update',id,status:$('s'+id).value,admin_notes:$('n'+id).value});alert(d.success?'تم تحديث الطلب.':d.error||'تعذر التحديث');load()}load();</script></body></html>
